    post:
      tags: [Faxes]
      operationId: sendFax
      summary: Send a fax
      description: |
        Accepts one outbound fax and answers **202** — the render and the call happen after this
        returns. Watch it finish with `GET /v1/faxes/{fax}`; there is no callback to wait on, and no
        retry to perform.

        **The body is flat, and it is not a JSON:API document.** A body carrying `data` is refused
        outright rather than half-obeyed. Send either `multipart/form-data` with `documents[]` file
        parts, or JSON whose `documents` is a list of `https` URLs — never both in one request.

        **`Idempotency-Key` is mandatory.** A second POST carrying the same key replays the first
        rather than sending a second fax, and the replay is marked with an `Idempotent-Replay: true`
        response header. That header is the ONLY thing that tells the two apart: the body is the
        same fax either way.
      security:
        - bearerAuth: [fax:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Your own key for this send. Reusing one returns the original fax instead of sending a
            second copy — which is what makes a retry of a request whose response you never saw
            safe.
          schema: { type: string }
          example: chart-4471-attempt-1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendFaxMultipartRequest'
            encoding:
              cover_page:
                contentType: application/json
              tags:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendFaxUrlRequest'
            example:
              fax_account: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
              to: '+13025556789'
              from: '+14075550100'
              resolution: fine
              client_reference: chart-4471
              tags:
                clinic: north
              cover_page:
                to_name: Dr Ruiz
                subject: Records
              documents:
                - https://records.acme-vet.example/charts/4471.pdf
      responses:
        '202':
          description: |
            Accepted. The fax exists and is readable at `GET /v1/faxes/{fax}`.
          headers:
            Idempotent-Replay:
              description: |
                Present, with the value `true`, only when this response replays an earlier send that
                carried the same `Idempotency-Key`. Absent on a fresh accept.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFaxAccepted'
              example:
                data:
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  status: queued
                  direction: outbound
                  from: '+14075550100'
                  to: '+13025556789'
                  client_reference: chart-4471
                  created_at: '2026-08-16T11:02:31+00:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Either the credential may not create faxes, or `from` is a well-formed number this fax
            account does not hold (`code: caller_id_not_permitted`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '403'
                    code: caller_id_not_permitted
                    title: Caller ID not permitted
                    detail: That number is not routed to this fax account.
                    source:
                      parameter: from
        '409':
          description: The fax account is suspended, so it may receive but not send.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: fax_account_suspended
                    title: Fax account suspended
                    detail: >-
                      That fax account is suspended, so it can receive faxes but not send them.
                      Reinstate it first.
        '413':
          description: 'One document is past the per-file ceiling (`code: document_too_large`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '415':
          description: |
            A document's BYTES are not a PDF, TIFF, PNG or JPEG. The name and the declared content
            type are both yours, so neither decides — the bytes are sniffed
            (`code: unsupported_media_type`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: |
            The request is malformed — a missing `Idempotency-Key`, a `to` that is not E.164, a
            JSON:API document body, more than five documents, uploads and URLs mixed in one request,
            a document URL that is not `https` or points at a private address, a `fax_account` id
            that names no account of yours, or — on a multipart send — a `tags` or `cover_page` part
            whose body is not a JSON object, or whose decoded fields fail the same shape and length
            rules the JSON body enforces on `tags.*` / `cover_page.*` (`code: validation_failed`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Invalid request
                    detail: The to field format is invalid.
                    source:
                      parameter: to
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}:
