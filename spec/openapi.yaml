          in: query
          required: false
          description: Side-load the endpoint this delivery was for.
          schema:
            type: string
            enum: [endpoint]
        - name: filter[endpoint]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[event_type]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
      responses:
