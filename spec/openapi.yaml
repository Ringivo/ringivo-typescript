openapi: 3.1.1
info:
  title: API Reference
  version: 0.1.0
  description: |
    REST API for the fax platform and its outbound webhooks.

    ## Authentication

    Mint a token at `POST /v1/integration/token`, then send `Authorization: Bearer <token>` on
    every call. One request does it: send your client id and secret in the body, name the
    **tenant** you are acting for — and, if you were granted one, a **customer** inside it — and
    ask for the `scopes` you need. The token comes back already scoped to that context. Leave
    `scopes` out and it comes back holding none, which every resource then refuses. Nothing later
    in the call chain picks a tenant; the token carries it for its whole life.

    A token lasts **15 minutes** (`expires_in: 900`), and there is no refresh token. Mint another
    when it expires, and mint another when a call answers **401**. Hold each token for its full
    life rather than minting one per request — that endpoint is throttled harder than the rest of
    the API. Its own description carries the rest: which scopes you end up holding, why a mint is
    refused, and how quickly a withdrawn grant stops you.

    **`POST /oauth/token` is platform-internal and not for API integrators.** It serves this
    platform's own machine principals, and this document deliberately does not describe it. A
    token minted there carries no tenant, so every `/v1` resource refuses it; nothing in the flow
    above uses it.

    ## The resource surface is JSON:API

    Everything under `/v1/` whose path names a resource collection speaks
    [JSON:API 1.0](https://jsonapi.org/format/): send and accept `application/vnd.api+json`, and read
    the document out of `data` (a resource object, or a list of them) with `errors` on a failure.

    Four endpoints are deliberately NOT JSON:API documents, and each says so in its own description:
    `POST /v1/faxes` (its body may be `multipart/form-data`), `GET /v1/faxes/{fax}/media` and
    `GET /v1/faxes/{fax}/thumbnail` (a computed composite, not a stored resource), and
    `POST /v1/faxes/{fax}/cancel` (a decision, not a field assignment). They take and answer plain
    `application/json`, and their error documents are still JSON:API error documents.

    ## What a credential can reach

    A token's **scopes** are the front door; they are never the reach. A customer-scoped credential
    reads its own customer's rows and a tenant-scoped one its own reseller's, decided before any
    rule runs — so a resource belonging to somebody else answers **404**, never 403. A token issued
    for a person additionally sees only the fax accounts that person was granted.

    ## Pagination

    Every collection pages the same way, by **cursor**. Ask for `page[size]` rows — the default is
    25 and the ceiling is 100 — then move with `page[after]` or `page[before]`. A size above the
    ceiling, or one that is not a whole number of rows, is refused with a 400 whose error carries
    `meta: {page: {maxSize: 100}}`; it is never quietly reduced to something you did not ask for.
    The two directions are one walk, so sending both at once is a 400 as well.

    A cursor is an opaque string we minted. Take one from `meta.page.nextCursor`, from a resource
    object's own `meta.page.cursor`, or from a pagination link, and send it back unchanged — never
    build one and never edit one. A cursor does not expire, and it belongs to the query that
    produced it: replay one under a different `filter` or `sort` and the request is refused with a
    400 rather than answered with rows from a different question.

    Every collection has a stable order, so a walk neither repeats a row nor skips one. The default
    is newest-first, `-createdAt,-id` — the id settles ties between rows created in the same
    instant. Every collection also accepts `sort`, and each operation lists the fields it takes;
    any other field is refused with a 400 rather than quietly ignored.

    `links.first` is always present, `links.prev` whenever a previous page exists, and `links.next`
    on every page but the last. On the final page `next` is **absent**, and `meta.page.nextCursor`
    is `null` — that null is the end-of-feed signal to branch on, because it is there on every page.
    There is no `last` link: finding the far end of the collection is the work a cursor exists to
    avoid. Beside the links, `meta.page` carries `size` and `nextCursor`, and on some collections an
    exact `total`. Treat `total` as optional: the `page` schema names the collections that have one.

    **To read a whole collection**, follow `links.next` — or send `meta.page.nextCursor` back as
    `page[after]` — until `meta.page.nextCursor` is `null`.

    **To poll for what is new**, remember the FIRST item's `meta.page.cursor` from your last read,
    then poll with `page[before]=<that cursor>`. You get only the rows that arrived since, newest
    first, and the first item of each answer is the cursor to remember for the next poll. An empty
    `data` means nothing arrived: keep the SAME cursor and poll again, because there is no new first
    item to move it to.
  license:
    # A description of a proprietary service. `identifier` is an SPDX expression, and SPDX reserves
    # the `LicenseRef-` prefix for exactly this: a licence that is not one of the public ones.
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  # Placeholder, and never what a reader sees: ApiDocsController rewrites `servers` to the reseller's
  # own API host on every request to /docs/api/openapi.json (ADR-0028's white-label rule). This value
  # reaches only the linters and the SDK generators.
  - url: https://api.example.com
security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Exchange client credentials for a bearer token.
  - name: Faxes
    description: The inbox and the outbox, as one collection told apart by `direction`.
  - name: Fax accounts
    description: The customer-scoped container every fax hangs off.
  - name: Fax account users
    description: Which people may read which fax account's faxes.
  - name: Webhook endpoints
    description: |
      Where you want to be called back, and with what signing secret.

      **Scope note.** These operations accept EITHER vocabulary, and the two do not reach the same
      endpoints: `fax:*` reaches only **fax-account-scoped** webhook endpoints, while
      customer-scoped and tenant-scoped endpoints require `webhooks:*`. An endpoint your token
      cannot reach answers **404**, exactly as an id that names nothing does.
  - name: Webhook deliveries
    description: |
      What we owed each endpoint, and what became of it.

      **Scope note.** A delivery borrows its endpoint's reach entirely, so the same narrowing
      applies: `fax:*` reaches only the deliveries of **fax-account-scoped** endpoints, while the
      deliveries of customer- and tenant-scoped endpoints require `webhooks:*`.
  - name: Number lookups
    description: |
      Who carries a phone number, what name it presents, and whether it can receive text messages.

      **This is the one operation here that costs you money.** Every lookup is billed at your
      per-lookup rate whether or not you have ever owned the number — so it is reachable only with a
      **personal access token**, never with a client-credentials token. A third party's credential
      cannot spend your balance.

paths:
  /v1/integration/token:
    post:
      tags: [Authentication]
      operationId: issueIntegrationToken
      summary: Exchange client credentials for a tenant- or customer-scoped token
      description: |
        The token a machine client presents to the rest of this API. Send the client id and secret
        you were issued, name the **tenant** you are acting for, and you get back a token that
        carries that tenant — and, when you name one, a **customer** inside it.

        Which rows you reach is decided by the token, never by a header or a path you send later.
        That is why the tenant is named here and nowhere else: acting for another tenant means
        asking for another token, and one token is one context for its whole life.

        The token lasts **15 minutes**. There is no refresh token — mint another when it expires.

        ## Your client must already hold a grant

        Credentials alone are not access. A **grant** is a record your reseller wrote that says
        *this client may act for this tenant, with at most these scopes*, optionally narrowed to one
        **customer** inside that tenant. If no active grant matches what you asked for, this
        endpoint answers **403** however good your credentials are.

        Grants are made out of band and never through this API. Ask the reseller whose platform you
        are integrating with for a client id, its secret, and the grant behind them.

        ## Two acts stand behind a customer-scoped credential

        A credential that acts for **one customer** of a reseller exists only after two separate
        acts by two different parties:

        1. the **reseller** turns API access on for that one customer and picks the scopes it may
           ever hold — its ceiling. This is the act that writes the grant.
        2. the **customer** then has its own credential created inside that ceiling.

        Neither act happens through this API, and together they are the whole answer to *why can my
        client mint a token for customer A but not for customer B?* — a grant exists for A and not
        for B.

        ## `customer` selects a context; by itself it narrows nothing

        Naming a customer **selects a grant somebody already wrote for it**. It never trims a wider
        grant down. A client holding only a tenant-wide grant cannot obtain a customer-scoped token
        by naming a customer, and a client granted customer A cannot reach customer B by asking. So
        there is no narrowing step you can forget: omit `customer` and you get the tenant-wide token
        your tenant-wide grant allows; name one and you get that customer's token, or a 403.

        That 403 reads the same for a tenant nobody granted you and for a customer nobody granted
        you. This is deliberate: a different message would let a caller discover which of a
        reseller's customers a client has been enabled for.

        ## Your scopes are an intersection, and a dropped scope is silent

        The scopes on the token are

        ```
        requested ∩ granted ∩ (customer named ? customer-scopeable : everything)
        ```

        **A scope outside that set is dropped, not refused.** You get a 200 carrying a token that
        simply does not hold it. That covers a scope your grant does not carry, a scope no customer
        credential may hold, **and a scope name this platform does not publish at all** — so a typo
        costs you a capability rather than an error.

        So **read `scopes` back off the response** and treat it as the authoritative answer. A call
        made on the assumption that you got what you asked for fails later at the resource instead,
        with a 403 that looks unrelated to this one.

        **`scopes` is optional and you almost always want it.** Leave it out and the intersection is
        empty: the request succeeds and hands you a token that carries no scopes and is refused by
        every resource you spend it on.

        ## Which scopes a customer-scoped token may hold

        Only scopes marked customer-scopeable survive that third intersection. Today they are
        `numbers:read` and `numbers:route`.

        **`numbers:assign` is not one of them and cannot be.** Assignment decides which customer a
        number belongs to, so it is never self-served by that customer's own credential; a token
        carrying it would be refused at every number it tried to assign. Ask for it on a
        customer-scoped token and it is dropped like any other unflagged scope:

        ```
        POST /v1/integration/token
        { "client_id": "…", "client_secret": "…", "tenant": "…", "customer": "…",
          "scopes": ["numbers:read", "numbers:assign", "numbers:route"] }

        200 OK
        { "token_type": "Bearer", "expires_in": 900,
          "scopes": ["numbers:read", "numbers:route"] }
        ```

        A tenant-wide credential is a different case: it may hold `numbers:assign`, and moving
        numbers between customers is exactly what it is for.

        ## Revocation, with its real clock

        Your grant is re-checked on **every** request you make with the token, not only when the
        token is minted. So a reseller who withdraws a grant, or a customer who revokes the
        credential, stops you on your next call rather than at the end of the token's 15 minutes.

        Reaching every region takes a moment: the answer is cached per region. In practice the cut
        lands well under a second, but **30 seconds** is the worst case to design against — never
        "immediate".

        Rotating a secret is not a revocation: it stops the old secret minting NEW tokens and leaves
        tokens already minted alive until they expire.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationTokenRequest'
            example:
              client_id: 0198c4a1-1f2e-7a3b-9c40-5f6e7d8a9b01
              client_secret: 9tK2xr4mQ7vBnZ1sD5hL0pWfC8jY3aE6
              tenant: 0198c4a1-3d4e-7f50-a1b2-c3d4e5f6a7b8
              scopes: [numbers:read, numbers:route]
      responses:
        '200':
          description: |
            A bearer token. `scopes` is what it actually carries — compare it with what you asked
            for before you spend it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationTokenResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                token_type: Bearer
                expires_in: 900
                scopes: [numbers:read, numbers:route]
        '401':
          description: The client id or the secret is wrong.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '401'
                    title: Unauthorized
                    detail: Invalid client credentials.
        '403':
          description: |
            Your credentials are good and no active grant matches — either for this tenant, or for
            the customer you named. The two are not told apart, on purpose.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '403'
                    title: Forbidden
                    detail: No active integration grant for this tenant.
        '422':
          description: |
            A member is missing or malformed, including a `tenant` or `customer` that is not a uuid.
            Each error's `source.pointer` names the member. A well-formed id that names nothing you
            were granted is the 403 above and not this — refusing it here would answer questions
            about another reseller's customers.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Unprocessable Entity
                    detail: The customer field must be a valid UUID.
                    source:
                      pointer: /customer
        '429':
          description: |
            Too many attempts. This endpoint is throttled harder than the rest of the API because
            every attempt costs a password check: **10 a minute per IP address** and **20 a minute
            per client id**, whichever you reach first. Wait the number of seconds in `Retry-After`,
            and hold each token for its full 15 minutes rather than minting one per request.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '429'
                    title: Too Many Requests
                    detail: Too Many Attempts.

  /v1/faxes:
    get:
      tags: [Faxes]
      operationId: listFaxes
      summary: List faxes
      description: |
        The inbox and the outbox in one collection, newest first.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: include
          in: query
          description: Related resources to side-load. `attempts` is the only path a fax publishes.
          required: false
          schema:
            type: string
            enum: [attempts]
          example: attempts
        - name: filter[fax_account]
          in: query
          required: false
          description: Only faxes on this fax account.
          schema: { type: string, format: uuid }
        - name: filter[direction]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FaxDirection'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FaxStatus'
        - name: filter[from]
          in: query
          required: false
          description: Exact match on the sending number, in E.164.
          schema: { type: string }
          example: '+14075550100'
        - name: filter[to]
          in: query
          required: false
          description: Exact match on the receiving number, in E.164.
          schema: { type: string }
          example: '+13025556789'
        - name: filter[client_reference]
          in: query
          required: false
          description: Exact match on the reference your own system supplied at send time.
          schema: { type: string }
        - name: filter[created_after]
          in: query
          required: false
          description: Faxes created at or after this moment.
          schema: { type: string }
          example: '2026-08-05'
        - name: filter[created_before]
          in: query
          required: false
          description: Faxes created at or before this moment.
          schema: { type: string }
          example: '2026-08-20'
        - name: filter[read]
          in: query
          required: false
          description: '`true` for faxes somebody has marked read, `false` for the rest.'
          schema: { type: boolean }
        - name: filter[archived]
          in: query
          required: false
          schema: { type: boolean }
        - name: filter[tag]
          in: query
          required: false
          description: |
            Match on your own tags, one query member per tag name — `filter[tag][clinic]=north`.
            Two of them mean BOTH, never either. `filter[tag]` with no tag name is refused with a
            400 rather than ignored.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
      responses:
        '200':
          description: A page of faxes.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxCollectionDocument'
              example:
                data:
                  - type: faxes
                    id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                    attributes:
                      direction: inbound
                      status: received
                      failureCode: null
                      from: '+13025556789'
                      to: '+14075550100'
                      pagesTotal: 3
                      pagesTransferred: 3
                      partial: false
                      attemptCount: 1
                      resolution: fine
                      clientReference: null
                      coverPage: null
                      read: false
                      archived: false
                      tags:
                        clinic: north
                      documents:
                        - kind: pdf
                          ordinal: 0
                          contentType: application/pdf
                          byteSize: 40960
                          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                          pages: 3
                      createdAt: '2026-08-16T11:02:31.000000Z'
                      completedAt: '2026-08-16T11:03:04.000000Z'
                    meta:
                      page:
                        cursor: 'eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ'
                links:
                  first: 'https://api.example.com/v1/faxes?page%5Bsize%5D=25'
                  next: 'https://api.example.com/v1/faxes?page%5Bafter%5D=eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ&page%5Bsize%5D=25'
                meta:
                  page:
                    size: 25
                    nextCursor: 'eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Faxes]
      operationId: sendFax
      summary: Send a fax
      description: |
        Accepts one outbound fax and answers **202** — the render and the call happen after this
        returns. Watch it finish with `GET /v1/faxes/{fax}`; there is no callback to wait on, and no
        retry to perform.

        **The body is flat, and it is not a JSON:API document.** A body carrying `data` is refused
        outright rather than half-obeyed. Send either `multipart/form-data` with `documents[]` file
        parts, or JSON whose `documents` is a list of `https` URLs — never both in one request.

        **`Idempotency-Key` is mandatory.** A second POST carrying the same key replays the first
        rather than sending a second fax, and the replay is marked with an `Idempotent-Replay: true`
        response header. That header is the ONLY thing that tells the two apart: the body is the
        same fax either way.
      security:
        - bearerAuth: [fax:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Your own key for this send. Reusing one returns the original fax instead of sending a
            second copy — which is what makes a retry of a request whose response you never saw
            safe.
          schema: { type: string }
          example: chart-4471-attempt-1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendFaxMultipartRequest'
            encoding:
              cover_page:
                contentType: application/json
              tags:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendFaxUrlRequest'
            example:
              fax_account: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
              to: '+13025556789'
              from: '+14075550100'
              resolution: fine
              client_reference: chart-4471
              tags:
                clinic: north
              cover_page:
                to_name: Dr Ruiz
                subject: Records
              documents:
                - https://records.acme-vet.example/charts/4471.pdf
      responses:
        '202':
          description: |
            Accepted. The fax exists and is readable at `GET /v1/faxes/{fax}`.
          headers:
            Idempotent-Replay:
              description: |
                Present, with the value `true`, only when this response replays an earlier send that
                carried the same `Idempotency-Key`. Absent on a fresh accept.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFaxAccepted'
              example:
                data:
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  status: queued
                  direction: outbound
                  from: '+14075550100'
                  to: '+13025556789'
                  client_reference: chart-4471
                  created_at: '2026-08-16T11:02:31+00:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Either the credential may not create faxes, or `from` is a well-formed number this fax
            account does not hold (`code: caller_id_not_permitted`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '403'
                    code: caller_id_not_permitted
                    title: Caller ID not permitted
                    detail: That number is not routed to this fax account.
                    source:
                      parameter: from
        '409':
          description: The fax account is suspended, so it may receive but not send.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: fax_account_suspended
                    title: Fax account suspended
                    detail: >-
                      That fax account is suspended, so it can receive faxes but not send them.
                      Reinstate it first.
        '413':
          description: 'One document is past the per-file ceiling (`code: document_too_large`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '415':
          description: |
            A document's BYTES are not a PDF, TIFF, PNG or JPEG. The name and the declared content
            type are both yours, so neither decides — the bytes are sniffed
            (`code: unsupported_media_type`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: |
            The request is malformed — a missing `Idempotency-Key`, a `to` that is not E.164, a
            JSON:API document body, more than five documents, uploads and URLs mixed in one request,
            a document URL that is not `https` or points at a private address, a `fax_account` id
            that names no account of yours, or — on a multipart send — a `tags` or `cover_page` part
            whose body is not a JSON object, or whose decoded fields fail the same shape and length
            rules the JSON body enforces on `tags.*` / `cover_page.*` (`code: validation_failed`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Invalid request
                    detail: The to field format is invalid.
                    source:
                      parameter: to
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFax
      summary: Read one fax
      description: |
        The fax and its document metadata. **No object key and no URL is ever published here** — the
        bytes are reached only through `GET /v1/faxes/{fax}/media`, which mints a short-lived
        download URL and records who asked.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - name: include
          in: query
          required: false
          description: Side-load the per-call attempt records.
          schema:
            type: string
            enum: [attempts]
      responses:
        '200':
          description: The fax.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxDocumentResponse'
              example:
                data:
                  type: faxes
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  attributes:
                    direction: outbound
                    status: delivered
