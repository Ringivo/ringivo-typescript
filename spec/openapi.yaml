  /v1/tenants/{tenant}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Read your reseller account
      description: |
        Self-view only: this resource always answers with the credential's own tenant. Any other id
        resolves to nothing — **404**, fail-closed, exactly as an id that names no row at all.

        `onboardingRequirements` is what this account still owes before it may write anything on this
        surface — `[]` means nothing is outstanding. Reading it is never walled, so a client checks
        here before a write and confirms here once it is fixed.
      security:
        - bearerAuth: [tenants:read]
      responses:
        '200':
          description: Your reseller account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TenantDocumentResponse'
              example:
                data:
                  type: tenants
                  id: 0198c4a1-b425-76e7-18e9-031425364a5b
                  attributes:
                    brandName: Acme Vet Communications
                    legalName: Acme Vet Communications LLC
                    status: active
                    createdAt: '2026-06-01T12:00:00.000000Z'
                    onboardingRequirements: []
                    brandColorPrimary: '#0057b8'
                    brandColorAccent: '#ffb703'
                    supportEmail: support@acme-vet.example
                    supportPhone: '+14155550100'
                    includedDomain: acme-vet.reseller.example
                    whiteLabelDomain:
                      registrableDomain: acmevet.com
                      consoleHost: portal.acmevet.com
                      apiHost: api.acmevet.com
                      status: active
                      isPrimary: true
                    sendingIdentity:
                      address: no-reply@acmevet.com
                      status: active
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Tenants]
      operationId: updateTenant
      summary: Change your brand colors or support contact
      description: |
        The two Settings › Branding panels, as an API write: brand colors and the support contact
        your customers see. Every other attribute on this resource — including the domain and
        sending-identity objects — is read-only; there is no API write path for either yet.

        Send only what changed. An attribute you leave out keeps its current value; one you send as
        `null` clears it — all four are nullable. `brandColorPrimary`/`brandColorAccent` are
        six-digit hex; `supportPhone` is E.164.

        **Blocked while onboarding is incomplete.** An account with a non-empty
        `onboardingRequirements` (see the GET above) refuses every write on this surface with a 403.
      security:
        - bearerAuth: [tenants:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/TenantUpdateRequest'
            example:
              data:
                type: tenants
                id: 0198c4a1-b425-76e7-18e9-031425364a5b
                attributes:
                  brandColorPrimary: '#0057b8'
                  brandColorAccent: '#ffb703'
                  supportEmail: support@acme-vet.example
                  supportPhone: '+14155550100'
      responses:
        '200':
          description: The updated account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TenantDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

# -------------------------------------------------------------------------------------------------
# Outbound webhooks — what WE send to YOUR server.
# -------------------------------------------------------------------------------------------------
  /v1/pbx/subscribers:
    get:
      tags: [PBX subscribers]
      operationId: listPbxSubscribers
      summary: List PBX subscribers
      description: |
        Every subscriber on your customers' phone systems, extension first — people AND machines.
        Read `kind` to tell them apart, or ask for the kinds you want with `filter[kind]`.

        **For a click-to-call picker**, send `filter[kind]=user&filter[hasDevices]=true`: the people
        who have a phone. A subscriber with no device cannot place a call.

        **Every `/v1/pbx/` read is scoped to your customers' PBX domains**, and there is no unscoped
        form. A credential that reaches no customer with a PBX is refused with a **400** rather than
        given an empty page, so "nobody has a phone system yet" never reads as "nobody has any
        subscribers".
      security:
        - bearerAuth: [pbx-users:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - name: sort
          in: query
          required: false
          description: |
            `user` (the default) or `displayName`, either reversible with a leading `-`. The id is
            appended as a tiebreaker, so the order is always total and a page boundary cannot fall
            inside a tie.
          schema:
            type: string
            enum: [user, -user, displayName, -displayName]
          example: displayName
        - name: filter[customer]
          in: query
          required: false
          description: Only the subscribers of this customer's PBX domain.
          schema: { type: string, format: uuid }
        - name: filter[user]
          in: query
          required: false
          description: Exact match on the extension. `101` does not match `1010`.
          schema: { type: string }
          example: '101'
        - name: filter[search]
          in: query
          required: false
          description: |
            Case-insensitive substring match on the display name, first name, last name or
            extension — the one parameter behind a directory search box.
          schema: { type: string }
          example: perkins
        - name: filter[kind]
          in: query
          required: false
          description: |
            One kind, or several separated by commas (`callQueue,autoAttendant`). The words are the
            `kind` values. A word outside the list is refused with a **400** that names the accepted
            words, never answered with an empty page.
          schema: { type: string }
          example: user
        - name: filter[hasDevices]
          in: query
          required: false
          description: |
            `true` for subscribers with at least one device registration, `false` for those with
            none — the same devices the `devices` relationship lists.
          schema: { type: boolean }
          example: true
      responses:
        '200':
          description: A page of PBX subscribers.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PbxSubscriberCollectionDocument'
              example:
                data:
                  - type: subscribers
                    id: 6f98cc5d-5248-5100-9967-8606e2993077
                    attributes:
                      user: '101'
                      domain: acme.example
                      displayName: Ann Perkins
                      firstName: Ann
                      lastName: Perkins
                      email: ann@acme.example
                      scope: Basic User
                      group: sales
                      site: HQ
                      presence: open
                      callerIdNumber: '+14075550101'
                      callerIdName: Ann Perkins
                      timeZone: US/Eastern
                      createdAt: '2026-01-02 03:04:05'
                      updatedAt: '2026-09-01 10:00:00'
                      kind: user
                    relationships:
                      customer:
                        data: { type: customers, id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f }
                      devices:
                        data:
                          - { type: devices, id: 92e7c8b3-9d9f-5286-86ac-f0d0c035e6c0 }
                meta:
                  page:
                    size: 25
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/pbx/subscribers/{subscriber}:
    get:
      tags: [PBX subscribers]
      operationId: getPbxSubscriber
      summary: Read one PBX subscriber
      description: |
        A subscriber outside your customers' domains answers **404**, not 403 — the same answer an id
        that names nothing gives.
      security:
        - bearerAuth: [pbx-users:read]
      parameters:
        - $ref: '#/components/parameters/PbxSubscriberId'
      responses:
        '200':
          description: The PBX subscriber.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PbxSubscriberDocumentResponse'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/pbx/subscribers/{subscriber}/calls:
    post:
      tags: [PBX calls]
      operationId: placePbxCall
      summary: Place a click-to-dial call
      description: |
        Asks the phone system to ring `{subscriber}`'s phone and connect it to `destination`.

        **202, and the id is yours before the call exists.** The `data.id` in the answer is minted
        here and handed to the phone system as the SIP Call-ID it places the call under. Nothing
        else about the call is knowable at this point, which is why `status` is always `requested`.

        **Find the call's records with this id.** A call record's own id comes from the phone
        system's CDR row, so the two ids differ: send this one as `filter[callId]` on
        `GET /v1/pbx/call-records` once the call ends. One call writes two records; the phone system
        records the leg that rang the user as hidden, so the list answers the outbound leg alone
        unless you add `filter[includeHidden]=true`.

        **`device` must belong to `{subscriber}`.** A device id that names a registration owned by
        somebody else — including a subscriber with the same extension on another domain — is refused with a
        **422** pointing at `/data/attributes/device`. Nothing is dialled.

        A subscriber outside your customers' domains answers **404**, not 403 — the same answer an id that
        names nothing gives. A phone system that refuses or cannot be reached answers **502** with
        its own status in `errors[0].meta.vendor_status`; nothing was dialled and the request may be
        retried.
      security:
        - bearerAuth: [pbx-calls:write]
      parameters:
        - $ref: '#/components/parameters/PbxSubscriberId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PbxCallRequest'
      responses:
        '202':
          description: The call was accepted by the phone system. It has not happened yet.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PbxCallDocumentResponse'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '502':
          $ref: '#/components/responses/PhoneSystemUnreachable'
  /v1/pbx/devices:
    get:
      tags: [PBX devices]
      operationId: listPbxDevices
      summary: List PBX devices
      description: |
        The registrations your customers' phones have made — a row exists because something sent a
        SIP REGISTER, and disappears when nothing does.
      security:
        - bearerAuth: [pbx-users:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - name: sort
          in: query
          required: false
          description: '`aor` (the default), reversible with a leading `-`.'
          schema:
            type: string
            enum: [aor, -aor]
        - name: filter[customer]
          in: query
          required: false
          description: Only the registrations on this customer's PBX domain.
          schema: { type: string, format: uuid }
        - name: filter[subscriber]
          in: query
          required: false
          description: |
            Only the registrations belonging to this PBX **subscriber id** — not an extension. An id
            you cannot reach answers an empty page rather than a refusal.
          schema: { type: string, format: uuid }
        - name: filter[registered]
          in: query
          required: false
          description: '`true` for registrations that have not expired, `false` for the rest.'
          schema: { type: boolean }
      responses:
        '200':
          description: A page of devices.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PbxDeviceCollectionDocument'
              example:
                data:
                  - type: devices
                    id: 92e7c8b3-9d9f-5286-86ac-f0d0c035e6c0
                    attributes:
                      aor: sip:101@acme.example
                      user: '101'
                      domain: acme.example
                      mode: register
                      userAgent: Polycom/6.4.2
                      contact: sip:101@198.51.100.7:5060
                      transport: udp
                      receivedFrom: 198.51.100.7:5060
                      registeredAt: '2026-09-14 08:00:00'
                      registrationExpiresAt: '2026-09-14 09:00:00'
                      registered: true
                      autoAnswer: false
                      createdAt: '2026-01-02 03:04:05'
                    relationships:
                      customer:
                        data: { type: customers, id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f }
                      subscriber:
                        data: { type: subscribers, id: 6f98cc5d-5248-5100-9967-8606e2993077 }
                meta:
                  page:
                    size: 25
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/pbx/devices/{device}:
    get:
      tags: [PBX devices]
      operationId: getPbxDevice
      summary: Read one PBX device
      security:
        - bearerAuth: [pbx-users:read]
      parameters:
        - $ref: '#/components/parameters/PbxDeviceId'
      responses:
        '200':
          description: The device.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PbxDeviceDocumentResponse'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/pbx/call-records:
    get:
      tags: [Call records]
      operationId: listCallRecords
      summary: List call records
      description: |
        Your customers' call log, newest first.

        **The date range picks the months that are read.** The switch keeps one table per month, so
        `filter[startedAfter]` and `filter[startedBefore]` decide which are opened at all. With no
        range you get the current and previous month; a range wider than **13 months** is refused
        with a 400 carrying `meta: {filter: {maxMonths: 13}}`.

        **Hidden records are left out of this list** and served on a direct read, which is what the
        phone system's own portal does. `filter[includeHidden]=true` puts them back.
      security:
        - bearerAuth: [pbx-call-records:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - name: sort
          in: query
          required: false
          description: '`-startedAt` (the default, newest first) or `startedAt`.'
          schema:
            type: string
            enum: [-startedAt, startedAt]
        - name: filter[customer]
          in: query
          required: false
          description: Only the calls on this customer's PBX domain.
          schema: { type: string, format: uuid }
        - name: filter[startedAfter]
          in: query
          required: false
          description: Calls that started at or after this moment, RFC 3339.
          schema: { type: string, format: date-time }
          example: '2026-09-01T00:00:00Z'
        - name: filter[startedBefore]
          in: query
          required: false
          description: Calls that started at or before this moment, RFC 3339.
          schema: { type: string, format: date-time }
          example: '2026-09-30T23:59:59Z'
        - name: filter[direction]
          in: query
          required: false
          description: |
            A word outside this list is refused with a 400, never answered with an empty page.
            `inbound` selects both answered and missed inbound calls; `internal` selects calls that
            stayed inside one domain.
          schema:
            $ref: '#/components/schemas/CallDirection'
        - name: fields[call-records]
          in: query
          required: false
          description: |
            **Ask for the extended fields here.** A call record has a standard set, which you get on
            every response, and an extended set of the phone system's own raw values, which you get
            only by naming them:

            `?fields[call-records]=direction,startedAt,origCallId,terminatedTo`

            This is the JSON:API sparse-fieldset parameter, so it **narrows** rather than adds: the
            response carries exactly the fields you name and nothing else. List every field you want,
            standard ones included. Send nothing and you get the standard set.

            The extended fields are `vendorId`, `origCallId`, `termCallId`, `byAction`,
            `terminatedTo`, `codec`, `hostname`, `rawFromUri`, `rawFromUser`, `rawToUser` and
            `rawRequestUser`. Naming a field that does not exist is a 400.
          schema: { type: string }
          example: direction,startedAt,vendorId,terminatedTo
        - name: filter[subscriber]
          in: query
          required: false
          description: |
            Calls with this PBX **subscriber id** on either leg — placed by them or taken by them.
          schema: { type: string, format: uuid }
        - name: filter[callId]
          in: query
          required: false
          description: |
            The records of ONE click-to-dial call — the `id` that `POST /v1/pbx/subscribers/{subscriber}/calls`
            answered with.

            **One call writes two records.** The phone system rings the user first and then dials
            out, and it records each leg once the call ends. It records the leg that rang the user as
            hidden, so this list answers the outbound leg alone; add `filter[includeHidden]=true` for
            both.

            **The date range still applies.** Only the months in the range are searched — this month
            and last unless you send `filter[startedAfter]` or `filter[startedBefore]` — so look up
            an older call with a range that covers it.

            An id that names no call answers an empty page, not an error.
          schema: { type: string, format: uuid }
          example: 01a0a62e-bd9e-73a1-89ec-127a80d6dd4c
        - name: filter[includeHidden]
          in: query
          required: false
          description: '`true` also returns records the phone system marks hidden.'
          schema: { type: boolean }
      responses:
        '200':
          description: A page of call records.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CallRecordCollectionDocument'
              example:
                data:
                  - type: call-records
                    id: e4837703-48c1-5c9e-8699-bbaafb17bb84
                    attributes:
                      direction: inbound
                      disposition: answered
                      tenantId: 0198c4a1-1111-7222-8333-444455556666
                      domain: acme.example
                      territory: telimatic
                      fromNumber: '+13025556789'
                      fromExtension: null
                      fromName: Dr Bell
                      toNumber: '+14075550101'
                      dialedNumber: '+14075550101'
                      routedByExtension: null
                      answeringExtension: '101'
                      startedAt: '2026-09-12T14:00:00Z'
                      answeredAt: '2026-09-12T14:00:04Z'
                      releasedAt: '2026-09-12T14:01:04Z'
                      durationSeconds: 64
                      talkSeconds: 60
                      releaseCode: end
                      releaseText: 'Orig: Bye'
                      hasRecording: true
                      hidden: false
                    relationships:
                      customer:
                        data: { type: customers, id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f }
                      fromSubscriber:
                        data: null
                      toSubscriber:
                        data: { type: subscribers, id: 6f98cc5d-5248-5100-9967-8606e2993077 }
                meta:
                  page:
                    size: 25
                    nextCursor: null
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/pbx/call-records/{callRecord}:
    get:
      tags: [Call records]
      operationId: getCallRecord
      summary: Read one call record
      description: |
        A hidden record IS served here — the list leaves it out, a direct read does not, which is
        what the phone system's own portal does.
      security:
        - bearerAuth: [pbx-call-records:read]
      parameters:
        - $ref: '#/components/parameters/CallRecordId'
      responses:
        '200':
          description: The call record.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CallRecordDocumentResponse'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/pbx/call-records/{callRecord}/recordings:
    get:
      tags: [Call records]
      operationId: listCallRecordRecordings
      summary: List a call record's recordings, each with a download link
      description: |
        One call can be captured more than once — the phone system keys a recording by
        `(call id, capture id)`, and a call record names BOTH of its legs' call ids — so this
        answers a **collection**, not a single link. Use it whenever `hasRecording` is true on the
        call record.

        **Each item carries its own `content-url`**, a time-limited link on your own API host.
        Follow it with a plain `GET` and **no `Authorization` header**: the signature it carries is
        the authorization. Treat the URL as opaque — the signature covers the whole address, so
        editing any part of it invalidates the link.

        **Every call mints fresh links and writes one audit entry per recording**, naming who asked.
        Do not cache a URL past its `expires-at` or share it: anyone holding one listens to that
        call with no further authorization.

        **This collection is not paged.** It is the captures of one call, not a walk over a growing
        table, so there are no `page[...]` parameters and no `meta.page` — every recording of the
        call is in the one response.
      security:
        - bearerAuth: [pbx-call-records:read]
      parameters:
        - $ref: '#/components/parameters/CallRecordId'
      responses:
        '200':
          description: |
            The call's recordings, in vendor key order `(call_id, ccc_id)` — NOT chronological
            across legs. An EMPTY `data` array is a normal answer: a call that was not recorded has
            none, and a call recorded a moment ago has none until the phone system has finished
            uploading the audio to us.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RecordingCollectionDocument'
              example:
                data:
                  - type: recordings
                    id: 6f98cc5d-5248-5100-9967-8606e2993077
                    attributes:
                      ccc-id: 00b1
                      duration: 97
                      byte-size: 1563244
                      sha256: abababababababababababababababababababababababababababababababab
                      superseded: false
                      content-url: https://api.yourprovider.example/v1/pbx/recordings/6f98cc5d-5248-5100-9967-8606e2993077/content?expires=1789557037&signature=...
                      expires-at: '2026-09-16T11:07:31+00:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No call record of yours has that id (`code: not_found`). A call belonging to another
            account answers the same way as one that does not exist — its existence is itself
            information.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
  /v1/pbx/recordings/{recording}/content:
    get:
      tags: [Call records]
      operationId: downloadRecording
      summary: Download a recording's audio (the URL the recordings list names)
      description: |
        **You do not build this URL — you follow it.** Each item of
        `GET /v1/pbx/call-records/{callRecord}/recordings` carries a `content-url`, and this is
        where it points. Treat it as opaque: the signature covers the whole address, so editing the
        path, the host or any query parameter invalidates it.

        Send **no `Authorization` header**. The signature is the authorization here, which is why
        this operation publishes no security scheme — the entitlement was checked when the link was
        minted, by the request that held your token. The link stops working at the `expires-at` the
        list reported.

        The audio is streamed as `audio/wav` with `Content-Disposition: inline`. Range requests are
        not supported: a `Range` header is ignored and the whole recording is returned with a 200,
        so there is no seeking and no resumable download.
      security: []
      parameters:
        - $ref: '#/components/parameters/RecordingId'
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The audio itself.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '403':
          description: |
            The signature did not verify, or the link has expired (`Invalid signature.`). Ask the
            recordings list for a fresh one — a link cannot be repaired or extended.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: |
            There is no such recording to serve (`code: not_found`). Every miss answers the same way
            on purpose — an unknown recording and one whose audio we no longer hold are deliberately
            indistinguishable, because this route takes no credential.

            **A link that minted successfully can still 404 here.** The list reports the `byte-size`
            and `sha256` recorded for the audio, which is metadata; this endpoint answers for the
            bytes. Retry the list, and treat a repeat as "the recording is not available" rather
            than as a transport failure.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/pbx/call-records/{callRecord}/transcripts:
    get:
      tags: [Call records]
      operationId: listCallRecordTranscripts
      summary: List a call record's transcripts, each with a download link
      description: |
        What was said on a recorded call. One call can be captured more than once — the phone system
        keys a recording by `(call id, capture id)` — so this answers a **collection**, with one item
        per capture rather than one item per transcript.

        **`status` is the member to branch on.** `ready` means we hold the words and the item carries
        them; `pending` means that capture has no transcript yet and every other member is null.
        Transcription runs after the audio has finished uploading, so a call recorded a moment ago is
        normally `pending` for a few minutes.

        **The words themselves are not here.** Ask
        `GET /v1/pbx/call-records/{callRecord}/transcripts/{recording}` for one transcript with its
        `segments`, or follow `content-url` for the raw provider JSON. Deriving turns costs a read of
        the stored document per capture, which is why the list does not do it for captures you did
        not ask about.

        **`byte-size` and `sha256` describe the DOCUMENT behind `content-url`**, not the audio. They
        are not comparable with the same members on the recordings list, which describe the audio.

        **Every call mints fresh links and writes one audit entry per transcript**, naming who asked.
        Do not cache a URL past its `expires-at` or share it: anyone holding one reads that call with
        no further authorization.

        **This collection is not paged.** It is the captures of one call, not a walk over a growing
        table, so there are no `page[...]` parameters and no `meta.page`.
      security:
        - bearerAuth: [pbx-call-records:read, pbx-transcripts:read]
      parameters:
        - $ref: '#/components/parameters/CallRecordId'
      responses:
        '200':
          description: |
            The call's transcripts, in vendor key order `(call_id, ccc_id)` — NOT chronological
            across legs. An EMPTY `data` array is a normal answer: a call that was not recorded has
            no captures to transcribe.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TranscriptCollectionDocument'
              example:
                data:
                  - type: transcripts
                    id: 6f98cc5d-5248-5100-9967-8606e2993077
                    attributes:
                      ccc-id: 00b1
                      status: ready
                      language: en-US
                      duration: 97
                      byte-size: 18422
                      sha256: abababababababababababababababababababababababababababababababab
                      provider: deepgram
                      model: nova-3
                      content-url: https://api.yourprovider.example/v1/pbx/transcripts/6f98cc5d-5248-5100-9967-8606e2993077/content?expires=1789557037&signature=...
                      expires-at: '2026-09-17T11:07:31+00:00'
                  - type: transcripts
                    id: 7a09dd6e-6359-5211-aa78-9717f3aa4188
                    attributes:
                      ccc-id: 00b2
                      status: pending
                      language: null
                      duration: null
                      byte-size: null
                      sha256: null
                      provider: null
                      model: null
                      content-url: null
                      expires-at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No call record of yours has that id (`code: not_found`). A call belonging to another
            account answers the same way as one that does not exist — its existence is itself
            information.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
  /v1/pbx/call-records/{callRecord}/transcripts/{recording}:
    get:
      tags: [Call records]
      operationId: getCallRecordTranscript
      summary: Read one transcript, with its speaker turns
      description: |
        One capture's transcript, with `segments` — the turns of the conversation, each carrying a
        speaker label, its bounds in seconds and what was said.

        **It is nested under the call record on purpose.** A transcript is reachable only through a
        call you may already read, which is what makes another account's transcript answer 404 rather
        than 403. Pass the recording id from an item of the list above; an id that is not one of this
        call's captures answers 404.

        **A 404 here is not always "no such thing".** `transcript_pending` means the capture is real
        and its transcript has not been written yet — ask again in a few minutes.
        `transcript_failed` means transcription was tried and permanently gave up, so there is
        nothing to wait for.
      security:
        - bearerAuth: [pbx-call-records:read, pbx-transcripts:read]
      parameters:
        - $ref: '#/components/parameters/CallRecordId'
        - $ref: '#/components/parameters/TranscriptRecordingId'
      responses:
        '200':
          description: The transcript, with its turns.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/TranscriptDocumentResponse'
              example:
                data:
                  type: transcripts
                  id: 6f98cc5d-5248-5100-9967-8606e2993077
                  attributes:
                    ccc-id: 00b1
                    status: ready
                    language: en-US
                    duration: 97
                    byte-size: 18422
                    sha256: abababababababababababababababababababababababababababababababab
                    provider: deepgram
                    model: nova-3
                    content-url: https://api.yourprovider.example/v1/pbx/transcripts/6f98cc5d-5248-5100-9967-8606e2993077/content?expires=1789557037&signature=...
                    expires-at: '2026-09-17T11:07:31+00:00'
                    segments:
                      - speaker: Speaker 1
                        start: 0.08
                        end: 2.4
                        text: Acme Dental, how can I help?
                      - speaker: Speaker 2
                        start: 2.6
                        end: 5.1
                        text: I need to move my appointment.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Nothing to serve, and the `code` says which kind of nothing: `not_found` (no call record
            of yours has that id, or no capture of it has that recording id),
            `transcript_pending` (the capture is real and its transcript is not written yet) or
            `transcript_failed` (transcription gave up, and no further attempt will be made).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
  /v1/pbx/transcripts/{recording}/content:
    get:
      tags: [Call records]
      operationId: downloadTranscript
      summary: Download a transcript's source document (the URL the transcripts list names)
      description: |
        **You do not build this URL — you follow it.** Each `ready` item of
        `GET /v1/pbx/call-records/{callRecord}/transcripts` carries a `content-url`, and this is
        where it points. Treat it as opaque: the signature covers the whole address, so editing the
        path, the host or any query parameter invalidates it.

        Send **no `Authorization` header**. The signature is the authorization here, which is why
        this operation publishes no security scheme — the entitlement was checked when the link was
        minted, by the request that held your token. The link stops working at the `expires-at` the
        list reported.

        **What you get is the speech-to-text provider's own response, gzipped and unmodified.** It is
        the lossless copy we keep, so it carries more than `segments` does — word timings and
        confidences among them — and its shape is the provider's rather than ours. If you want a
        stable shape, read `segments` on the transcript instead.
      security: []
      parameters:
        - $ref: '#/components/parameters/TranscriptRecordingId'
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The provider's response document, gzipped.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '403':
          description: |
            The signature did not verify, or the link has expired (`Invalid signature.`). Ask the
            transcripts list for a fresh one — a link cannot be repaired or extended.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: |
            There is no such document to serve (`code: not_found`). Every miss answers the same way
            on purpose — a transcript we have never held, one whose retention window has closed and
            one whose stored document is gone are deliberately indistinguishable, because this route
            takes no credential.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

