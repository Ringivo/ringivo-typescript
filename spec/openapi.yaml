    ZtpDeviceUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [ztp-devices] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              properties:
                label: { type: [string, 'null'], maxLength: 64 }
            relationships:
              type: object
