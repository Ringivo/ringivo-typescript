openapi: 3.1.1
info:
  title: API Reference
  version: 0.1.0
  description: |
    REST API for the fax platform and its outbound webhooks.

    **This document describes the integrator contract** — what a client credential issued to you by
    a reseller may do. It is the whole of what is available to you, and every rule below is stated
    for that credential rather than hedged across other kinds of caller.

    ## Authentication

    Mint a token at `POST /oauth/token`, then send `Authorization: Bearer <token>` on
    every call. It is an ordinary OAuth 2.0 client-credentials exchange, so an OAuth client
    library can make the call the way it already writes it: send your client id and secret, name
    the **tenant** you are acting for — and, if you were granted one, a **customer** inside it —
    and ask for the `scope` you need. The token comes back already scoped to that context. Both
    `tenant` and `scope` are required: a request missing either is refused rather than answered
    with a token that cannot do anything. Nothing later in the call chain picks a tenant; the token
    carries it for its whole life.

    A token lasts **15 minutes** (`expires_in: 900`), and there is no refresh token. Mint another
    when it expires, and mint another when a call answers **401**. Hold each token for its full
    life rather than minting one per request — that endpoint is throttled harder than the rest of
    the API. Its own description carries the rest: which scopes you end up holding, why a mint is
    refused, and how quickly a withdrawn grant stops you.

    **The mint speaks OAuth; every resource speaks JSON:API.** A refusal at `POST /oauth/token` is
    a plain `application/json` object carrying `error` and `error_description` (RFC 6749 section
    5.2), never a JSON:API error document. So write one error parser for the mint and another for
    everything you spend the token on: the line runs between the two, not through either.

    ## The resource surface is JSON:API

    Everything under `/v1/` whose path names a resource collection speaks
    [JSON:API 1.0](https://jsonapi.org/format/): send and accept `application/vnd.api+json`, and read
    the document out of `data` (a resource object, or a list of them) with `errors` on a failure.

    Four endpoints are deliberately NOT JSON:API documents, and each says so in its own description:
    `POST /v1/faxes` (its body may be `multipart/form-data`), `GET /v1/faxes/{fax}/media` and
    `GET /v1/faxes/{fax}/thumbnail` (a computed composite, not a stored resource), and
    `POST /v1/faxes/{fax}/cancel` (a decision, not a field assignment). They take and answer plain
    `application/json`, and their error documents are still JSON:API error documents.

    `POST /oauth/token` is outside `/v1` altogether and is not on this surface at all: it is an
    OAuth token endpoint, and its refusals are OAuth error objects — see **Authentication** above.

    ## What a credential can reach

    A token's **scopes** are the front door; they are never the reach. A customer-scoped credential
    reads its own customer's rows and a tenant-scoped one its own reseller's, decided before any
    rule runs — so a resource belonging to somebody else answers **404**, never 403. A token issued
    for a person additionally sees only the fax accounts that person was granted.

    ## Pagination

    Every collection pages the same way, by **cursor**. Ask for `page[size]` rows — the default is
    25 and the ceiling is 100 — then move with `page[after]` or `page[before]`. A size above the
    ceiling, or one that is not a whole number of rows, is refused with a 400 whose error carries
    `meta: {page: {maxSize: 100}}`; it is never quietly reduced to something you did not ask for.
    The two directions are one walk, so sending both at once is a 400 as well.

    A cursor is an opaque string we minted. Take one from `meta.page.nextCursor`, from a resource
    object's own `meta.page.cursor`, or from a pagination link, and send it back unchanged — never
    build one and never edit one. A cursor does not expire, and it belongs to the query that
    produced it: replay one under a different `filter` or `sort` and the request is refused with a
    400 rather than answered with rows from a different question.

    Every collection has a stable order, so a walk neither repeats a row nor skips one. The default
    is newest-first, `-createdAt,-id` — the id settles ties between rows created in the same
    instant. Every collection also accepts `sort`, and each operation lists the fields it takes;
    any other field is refused with a 400 rather than quietly ignored.

    `links.first` is always present, `links.prev` whenever a previous page exists, and `links.next`
    on every page but the last. On the final page `next` is **absent**, and `meta.page.nextCursor`
    is `null` — that null is the end-of-feed signal to branch on, because it is there on every page.
    There is no `last` link: finding the far end of the collection is the work a cursor exists to
    avoid. Beside the links, `meta.page` carries `size` and `nextCursor`, and on some collections an
    exact `total`. Treat `total` as optional: the `page` schema names the collections that have one.

    **To read a whole collection**, follow `links.next` — or send `meta.page.nextCursor` back as
    `page[after]` — until `meta.page.nextCursor` is `null`.

    **To poll for what is new**, remember the FIRST item's `meta.page.cursor` from your last read,
    then poll with `page[before]=<that cursor>`. You get only the rows that arrived since, newest
    first, and the first item of each answer is the cursor to remember for the next poll. An empty
    `data` means nothing arrived: keep the SAME cursor and poll again, because there is no new first
    item to move it to.
  license:
    # A description of a proprietary service. `identifier` is an SPDX expression, and SPDX reserves
    # the `LicenseRef-` prefix for exactly this: a licence that is not one of the public ones.
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  # Placeholder, and never what a reader sees: ApiDocsController rewrites `servers` to the reseller's
  # own API host on every request to /docs/api/openapi.json (ADR-0028's white-label rule). This value
  # reaches only the linters and the SDK generators.
  - url: https://api.example.com
security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Exchange client credentials for a bearer token.
  - name: Faxes
    description: The inbox and the outbox, as one collection told apart by `direction`.
  - name: Fax accounts
    description: The customer-scoped container every fax hangs off.
  - name: Fax account users
    description: Which people may read which fax account's faxes.
  - name: Webhook endpoints
    description: |
      Where you want to be called back, and with what signing secret.

      **Scope note.** These operations accept EITHER vocabulary, and the two do not reach the same
      endpoints: `fax:*` reaches only **fax-account-scoped** webhook endpoints, while
      customer-scoped and tenant-scoped endpoints require `webhooks:*`. An endpoint your token
      cannot reach answers **404**, exactly as an id that names nothing does.
  - name: Webhook deliveries
    description: |
      What we owed each endpoint, and what became of it.

      **Scope note.** A delivery borrows its endpoint's reach entirely, so the same narrowing
      applies: `fax:*` reaches only the deliveries of **fax-account-scoped** endpoints, while the
      deliveries of customer- and tenant-scoped endpoints require `webhooks:*`.
  - name: Number lookups
    description: |
      Who carries a phone number, what name it presents, and whether it can receive text messages.

      **This is the one operation here that costs you money.** Every lookup is billed at your
      per-lookup rate whether or not you have ever owned the number — so it is reachable only with a
      **personal access token**, never with a client-credentials token. A third party's credential
      cannot spend your balance.
  - name: ZTP devices
    description: |
      The phone MAC addresses you have registered with a vendor's zero-touch redirect service, so a
      drop-shipped handset finds your provisioning URL the first time it boots.

      **`active` means the redirect is set, not that the phone works.** A phone boots configured in
      two steps: the redirect service has to send it to the provisioning URL, and the phone system
      has to hold a device record for that MAC. This collection is the first step alone. If a device
      here is `active` and the handset still will not provision, the answer is the second step.
  - name: Text messaging
    description: |
      Turning text messaging on and off for your numbers, and the record of every request.

      **State lives on the number; the act is its own resource.** `GET /v1/phone-numbers/{id}`
      carries a read-only `messaging` object saying whether that number can send and receive text
      messages today. This collection is the REQUESTS that got it there — one row per number per
      attempt, kept forever, so a number that took three tries has three rows and each keeps its own
      outcome.

      **A request cannot be cancelled or amended.** Once it is sent it runs to an outcome. A failed
      one is never edited either: you retry it, and a retry mints a NEW request that carries the same
      authorization. That is why `POST .../retry` answers 201 with a different id.

      **A failed request cannot be retried for 24 hours.** The commonest failure is the number's
      current provider refusing the authorization, and sending the same letter an hour later gets the
      same answer. The refusal tells you when you may try again, in `meta.retryAllowedAt`, and the
      same instant is on the resource as `retryAllowedAt`.
  - name: Port orders
    description: |
      Moving numbers a customer already owns onto the platform: the paperwork, your customer's part
      of it, and where the order stands.

      **Reading is a machine scope; writing is not.** `port-orders:read` reaches the collection and
      the detail with the client-credentials token every other resource here uses. There is
      deliberately no `port-orders:write` beside it, because the whole intake — opening a draft,
      transcribing a bill into it, attaching paperwork, handing it to our desk — is one act a
      **person** is trusted with rather than a set of verbs a third party can be granted piecemeal.
      So every write below needs a **personal access token** minted for one of your own console
      users, and a client-credentials token that attempts one is refused with a **403**.

      **The carrier is absent from this resource, by decision.** Which wholesale carrier we file a
      port through is our supplier relationship, so nothing here names one: not the order, not its
      carrier-side reference, and not the carrier's own words about a number.

paths:
  /oauth/token:
    post:
      tags: [Authentication]
      operationId: issueToken
      summary: Exchange client credentials for a tenant- or customer-scoped token
      description: |
        The token a machine client presents to the rest of this API. Send
        `grant_type=client_credentials` with the client id and secret you were issued, name the
        **tenant** you are acting for, and you get back a token that carries that tenant — and,
        when you name one, a **customer** inside it.

        This is a standard OAuth 2.0 token endpoint (RFC 6749 section 4.4), so most OAuth client
        libraries can call it unmodified. `tenant` and `customer` are the only two members the
        standard does not define; send them beside the ones it does.

        Which rows you reach is decided by the token, never by a header or a path you send later.
        That is why the tenant is named here and nowhere else: acting for another tenant means
        asking for another token, and one token is one context for its whole life.

        The token lasts **15 minutes**. There is no refresh token — mint another when it expires.

        ## What to send

        The body may be `application/x-www-form-urlencoded` — what RFC 6749 section 4.4.2
        specifies, and what an OAuth library writes — or `application/json`. Both are read the
        same way.

        | member | what it is |
        |---|---|
        | `grant_type` | always `client_credentials`. |
        | `client_id`, `client_secret` | your credentials, unless they ride an `Authorization: Basic` header instead. |
        | `tenant` | the reseller you are acting for. **Required** — always name it. |
        | `customer` | one customer inside that tenant, when a grant names one. |
        | `scope` | the scopes you are asking for, as ONE space-delimited string. |

        **`scope` is the only scope spelling this endpoint reads.** A `scopes` array is not read: a
        request that sends only that one has asked for nothing, and asking for nothing is refused
        with a **400** `invalid_scope` rather than answered with a token good for nothing. You will
        hear about it on your first call.

        ## Two ways to send your credentials

        Put `client_id` and `client_secret` in the body, **or** send them as an
        `Authorization: Basic` header — base64 of `client_id:client_secret`, the spelling
        RFC 6749 section 2.3.1 defines and every OAuth client library already writes. The two are
        equal: the same secret check runs either way, and you are rate-limited as the same client
        whichever you pick.

        **Send your secret ONE way, never both, and this endpoint enforces it.** RFC 6749 section
        2.3 says a client must not use more than one authentication method. A request carrying a
        `client_secret` in the body *and* a secret in the `Authorization: Basic` header is refused
        with a **400** `invalid_request` — because otherwise the body silently wins and the header
        goes unchecked, so a stale secret in the header passes unnoticed and a stale one in the body
        fails a request whose header was perfectly good, with nothing on the wire telling you which
        was read. Sending the same secret both ways is still two credentials and is still refused;
        the rule is about how many you sent, not whether they agree.

        **A `client_id` in the body beside a Basic header is fine.** That is one authentication
        method plus a redundant name for yourself — it decides nothing, so it is not refused. Only
        two SECRETS are.

        ## Your client must already hold a grant

        Credentials alone are not access. A **grant** is a record your reseller wrote that says
        *this client may act for this tenant, with at most these scopes*, optionally narrowed to one
        **customer** inside that tenant. If no active grant matches what you asked for, this
        endpoint answers **400** with `error: unauthorized_client`, however good your credentials
        are. The status tells you nothing here — this endpoint answers 400 for several unrelated
        reasons — so branch on `error`. Note that `unauthorized_client` itself covers two of them:
        this one, and a client not allowed to use the `client_credentials` grant at all. The 400
        response below names both, and neither is something a caller can fix without their reseller.

        Grants are made out of band and never through this API. Ask the reseller whose platform you
        are integrating with for a client id, its secret, and the grant behind them.

        ## `tenant` is required — always name it

        Send `tenant` on every mint. Omit it and the request is a **400** `invalid_request` saying
        so; a `tenant` sent with an empty value (`""` or `null`) counts as omitted, per RFC 6749
        section 3.2, and gets that same answer.

        **This endpoint used to infer the tenant when your client held exactly one active grant, and
        that is deliberately gone.** It worked until the day your reseller granted your client a
        *second* tenant — at which point an integration that had been running for months began
        failing, in code nobody had touched, because of a change made on someone else's screen. A
        convenience that plants a failure for a future unrelated event is worse than no convenience.
        Naming the tenant costs you one parameter and removes that whole class of surprise.

        `customer` without `tenant` is half a selector — a customer id names a context inside a
        tenant the request never gave — and is a **400** `invalid_request`; send both or neither.

        **An empty `tenant` counts as an absent one, and is refused as missing.** RFC 6749 section
        3.2 requires it: "Parameters sent without a value MUST be treated as if they were omitted
        from the request." So `""` and `null` are not a way to ask for anything — they are simply
        not sending the parameter, and the refusal above is what you get. An empty `customer` still
        means the tenant-wide token, as it always has.

        ## One act stands behind a customer-scoped credential

        A credential that acts for **one customer** of a reseller is created by that customer, in
        one act, from its own console page. Creating it writes the grant this endpoint resolves.

        That act does not happen through this API, and it is the whole answer to *why can my client
        mint a token for customer A but not for customer B?* — a grant exists for A and not for B.

        The customer, its reseller, or Telimatic support can **revoke** a credential, and from here
        every one of those reads the same: a **401** whose `error` is `invalid_client`, for a client
        that worked yesterday. A revoke flags the client itself, so authentication is what fails —
        this is the SAME answer a wrong secret gets, and deliberately so: the endpoint does not tell a
        caller whether the id it is holding still exists. It is not the `400` `unauthorized_client`
        that a client with no grant for the tenant or customer it named receives; that one
        authenticates fine and is refused a CONTEXT.

        ## `customer` selects a context; by itself it narrows nothing

        Naming a customer **selects a grant somebody already wrote for it**. It never trims a wider
        grant down. A client holding only a tenant-wide grant cannot obtain a customer-scoped token
        by naming a customer, and a client granted customer A cannot reach customer B by asking. So
        there is no narrowing step you can forget: omit `customer` and you get the tenant-wide token
        your tenant-wide grant allows; name one and you get that customer's token, or a 400
        `unauthorized_client`.

        That refusal reads the same for a tenant nobody granted you and for a customer nobody
        granted you — same status, same `error`, same sentence, byte for byte. This is deliberate: a
        different message would let a caller discover which of a reseller's customers a client holds
        a grant for.

        ## Your scopes are an intersection, and a dropped scope is silent

        The scopes on the token are

        ```
        requested ∩ granted ∩ (customer named ? customer-scopeable : everything)
        ```

        **A scope outside that set is dropped, not refused** — as long as something survives. You
        get a 200 carrying a token that simply does not hold it. That covers a scope your grant does
        not carry and a scope no customer credential may hold. Both are permission answers, and both
        are silent.

        **If the intersection is EMPTY, the request is refused instead: a 400 whose `error` is
        `invalid_scope`.** A token holding nothing is refused by every resource you would spend it
        on, so handing you one would only move the failure somewhere it is harder to read. This is
        the one place the loud/silent line moves with the size of the answer rather than its kind:
        *some* of your scopes dropped still leaves a credential that means something, and **all** of
        them dropped does not. Asking for no `scope` at all reaches the same empty set and the same
        refusal.

        Your client's own ceiling — the scope set stamped on the credential when it was created —
        narrows the request before any of that, and drops just as silently. The two are written
        together whenever the credential's owner edits it, so they normally agree; where they can
        drift is an **installed integration**, whose grant the reseller writes and whose client
        ceiling somebody else stamped. There, a scope that shows up on your grant and never on your
        token means the credential itself does not carry it. Read `scope` back off the response
        either way.

        **A scope NAME this platform does not publish at all is the one exception: a 400 whose
        `error` is `invalid_scope` and whose `hint` names the offender.** That is a typo, not a
        permission answer, and it is the one case you could never diagnose by reading `scope` back
        off a 200 — a misspelled scope and a withheld one look identical there. The line is drawn
        at existence: a real scope you were not granted is still dropped in silence, as long as
        something survives the intersection.

        So **read `scope` back off the response** and treat it as the authoritative answer. A call
        made on the assumption that you got what you asked for fails later at the resource instead,
        with a 403 that looks unrelated to this one.

        **`scope` is required.** Leave it out and the intersection is empty, which is a **400**
        `invalid_scope` rather than a token good for nothing — so there is no request without it that
        can succeed, which is what makes it required rather than merely advisable.

        **The answer comes back in two spellings.** `scope` is the space-delimited string RFC 6749
        section 5.1 defines; `scopes` is the same list as an array. The two always agree — read
        whichever suits you.

        **You will never see a token with no scopes at all** — an empty set is the refusal above,
        so every token this endpoint hands YOU carries at least one scope. The response schema still
        describes the empty case (`scope` omitted, `scopes` as `[]`) because the same endpoint serves
        this platform's own internal credentials, which have no grant to intersect and are not
        refused. It is documented there rather than here so a generated model matches the wire in
        every case; it is not a shape an integrator can produce.

        ## Which scopes a customer-scoped token may hold

        Only scopes marked customer-scopeable survive that third intersection. Today they are
        `numbers:read`, `numbers:route`, `fax:read`, `fax:write`, `ztp-devices:read` and
        `ztp-devices:write`.

        The fax pair is what a customer's own integrator authenticates with: a customer-scoped fax
        token reads and sends within that customer's fax accounts and reaches nothing else, because a
        sibling customer's rows do not exist to it at all (a 404, never a 403).

        **`fax-accounts:write` is not customer-scopeable, and that is the line.** Sending a fax is
        something a customer does for itself; deciding what fax accounts it has, and who may open its
        inbox, is its reseller's act. So the account-management scope is granted on tenant-wide
        credentials only — ask for it on a customer-scoped token and it is dropped like any other
        unflagged scope. A customer-scoped integrator sends with `fax:write` and asks its reseller to
        create the accounts.

        **`numbers:assign` is not one of them and cannot be.** Assignment decides which customer a
        number belongs to, so it is never self-served by that customer's own credential; a token
        carrying it would be refused at every number it tried to assign. Ask for it on a
        customer-scoped token and it is dropped like any other unflagged scope:

        ```
        POST /oauth/token
        Content-Type: application/x-www-form-urlencoded

        grant_type=client_credentials&client_id=…&client_secret=…
        &tenant=…&customer=…&scope=numbers%3Aread+numbers%3Aassign+numbers%3Aroute

        200 OK
        { "token_type": "Bearer", "expires_in": 900,
          "scope": "numbers:read numbers:route",
          "scopes": ["numbers:read", "numbers:route"] }
        ```

        A tenant-wide credential is a different case: it may hold `numbers:assign`, and moving
        numbers between customers is exactly what it is for.

        ## Revocation, with its real clock

        Your grant is re-checked on **every** request you make with the token, not only when the
        token is minted. So a reseller who withdraws a grant, or a customer who revokes the
        credential, stops you on your next call rather than at the end of the token's 15 minutes.

        Reaching every region takes a moment: the answer is cached per region. In practice the cut
        lands well under a second, but **30 seconds** is the worst case to design against — never
        "immediate".

        Rotating a secret is not a revocation: it stops the old secret minting NEW tokens and leaves
        tokens already minted alive until they expire.
      security:
        # TWO ENTRIES, and the empty one is load-bearing. `{}` says this operation needs no declared
        # scheme — the credentials are in the body — and `basicAuth` is the alternative spelling.
        # A lone `basicAuth` entry would publish the header as MANDATORY, which it is not, and the
        # old bare `security: []` published no way to send it as a header at all.
        - {}
        - basicAuth: []
      requestBody:
        required: true
        content:
          # BOTH SPELLINGS, and the form one is listed first because it is what RFC 6749 section
          # 4.4.2 specifies and what an OAuth client library writes without being asked.
          # TWO NAMED EXAMPLES, not two schemas. The request has two shapes worth seeing — acting
          # for a whole tenant, and acting for one customer inside it — and they differ by ONE
          # optional member, so a `oneOf` would be the wrong tool twice over: JSON Schema objects
          # are open, so a customer-scoped body validates against the tenant-wide branch too and
          # matches BOTH, which fails `oneOf`'s exactly-one rule; and with `tenant` required there
          # is no constraint left for a union to express that the flat schema does not. It also
          # forks the generated clients (openapi-python-client emits a four-way union body for this
          # one endpoint). Named examples are the conventional way to show distinct use cases that
          # share a schema, and the four comparable services checked — GitHub installation tokens,
          # Google IAM generateAccessToken, Stripe, Auth0 — all publish flat schemas here.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
            examples:
              tenantWide:
                summary: Acting for a whole tenant
                description: |
                  The default shape. Your grant is tenant-wide, so the token reaches every customer
                  under that tenant your scopes allow. Send no `customer`.
                value:
                  grant_type: client_credentials
                  client_id: 0198c4a1-1f2e-7a3b-9c40-5f6e7d8a9b01
                  client_secret: 9tK2xr4mQ7vBnZ1sD5hL0pWfC8jY3aE6
                  tenant: 0198c4a1-3d4e-7f50-a1b2-c3d4e5f6a7b8
                  scope: numbers:read numbers:route
              customerScoped:
                summary: Acting for one customer inside that tenant
                description: |
                  For a credential a reseller granted for ONE of its customers. `customer` SELECTS
                  that pre-written grant — it never narrows a wider one — so send it only when a
                  grant names that customer, and send `tenant` beside it either way. Only
                  customer-scopeable scopes survive on the token you get back.
                value:
                  grant_type: client_credentials
                  client_id: 0198c4a1-1f2e-7a3b-9c40-5f6e7d8a9b01
                  client_secret: 9tK2xr4mQ7vBnZ1sD5hL0pWfC8jY3aE6
                  tenant: 0198c4a1-3d4e-7f50-a1b2-c3d4e5f6a7b8
                  customer: 0198c4a1-5f60-7182-b3c4-d5e6f708a9b0
                  scope: numbers:read numbers:route
          application/json:
            schema:
              $ref: '#/components/schemas/OauthTokenRequest'
            examples:
              tenantWide:
                summary: Acting for a whole tenant
                description: |
                  The default shape. Your grant is tenant-wide, so the token reaches every customer
                  under that tenant your scopes allow. Send no `customer`.
                value:
                  grant_type: client_credentials
                  client_id: 0198c4a1-1f2e-7a3b-9c40-5f6e7d8a9b01
                  client_secret: 9tK2xr4mQ7vBnZ1sD5hL0pWfC8jY3aE6
                  tenant: 0198c4a1-3d4e-7f50-a1b2-c3d4e5f6a7b8
                  scope: numbers:read numbers:route
              customerScoped:
                summary: Acting for one customer inside that tenant
                description: |
                  For a credential a reseller granted for ONE of its customers. `customer` SELECTS
                  that pre-written grant — it never narrows a wider one — so send it only when a
                  grant names that customer, and send `tenant` beside it either way. Only
                  customer-scopeable scopes survive on the token you get back.
                value:
                  grant_type: client_credentials
                  client_id: 0198c4a1-1f2e-7a3b-9c40-5f6e7d8a9b01
                  client_secret: 9tK2xr4mQ7vBnZ1sD5hL0pWfC8jY3aE6
                  tenant: 0198c4a1-3d4e-7f50-a1b2-c3d4e5f6a7b8
                  customer: 0198c4a1-5f60-7182-b3c4-d5e6f708a9b0
                  scope: numbers:read numbers:route
      responses:
        '200':
          description: |
            A bearer token. `scope` and `scopes` are what it actually carries — compare either with
            what you asked for before you spend it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthTokenResponse'
              example:
                access_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9...
                token_type: Bearer
                expires_in: 900
                scope: numbers:read numbers:route
                scopes: [numbers:read, numbers:route]
        '400':
          description: |
            Every refusal on this endpoint except a bad credential and a rate limit. RFC 6749
            section 5.2 gives the token endpoint one status for all of them, so **the status tells
            you nothing here — `error` is the member to branch on.** Four values arrive, and they
            answer two different questions.

            **`error` narrows the cause; for one value it does not pin it to one.**
            `unauthorized_client` below carries two distinct causes that share a status and a code,
            and only the unparseable `error_description` separates them. Treat it as "this client
            may not mint this token" and check both your grant and your client's grant types.

            *Your request is malformed.*

            - `invalid_request` — a missing `tenant` (which includes one sent empty, since RFC 6749
              section 3.2 makes a valueless parameter an omitted one), a `tenant` or `customer` that
              is not a uuid, a `customer` with no `tenant` beside it, or a `client_secret` in the
              body while the `Authorization: Basic` header carries one too (RFC 6749 section 2.3 —
              send your secret one way).
            - `invalid_scope` — **two causes wear this code too**, and unlike the pair below they
              are told apart by a member you CAN read. Either a scope NAME this platform does not
              publish, which carries a `hint` naming the offender and reads
              `The requested scope is invalid, unknown, or malformed`; **or** your requested scopes
              intersected your grant to **nothing**, which carries NO `hint` and reads
              `None of the requested scopes are on this grant. Ask for at least one scope the grant carries.`
              The first is a typo, the second is a permission answer. A real scope you were simply
              not granted is still dropped in silence, as long as something else survives.
            - `unsupported_grant_type` — `grant_type` is missing, or is not one this endpoint
              serves. Integrations send `client_credentials`.

            *Your request is well-formed and you may not have it.*

            - `unauthorized_client` — **two causes wear this code.** Either your credentials are
              good and no active grant matches (for this tenant, or for the customer you named — a
              request that named no `tenant` at all lands here too, word for word, when your client
              holds no active grant to resolve: one endpoint, one no-grant answer); **or** your
              client is not configured for the `client_credentials` grant type at all, which is a
              provisioning fault rather than a grant one. `error_description` reads
              `No active integration grant for this tenant.` for the first and
              `The authenticated client is not authorized to use this authorization grant type.`
              for the second — but that member is prose for a human log, so do not branch on it. If
              you cannot tell which you hit, ask your reseller to confirm both the grant and the
              credential's grant types.

            **The two questions share a status on purpose, and the no-grant answer is deliberately
            uninformative.** A well-formed id that names nothing you were granted is
            `unauthorized_client` rather than `invalid_request`, and the sentence is identical
            whichever of the two was missing — telling them apart would answer questions about
            another reseller's customers.

            (The no-grant refusal was a **403** until 2026-08-21. RFC 6749 section 5.2 prescribes
            400 for every token-endpoint error but `invalid_client`, so the status was corrected
            while no integrator depended on it. The `error` value and the sentence did not change.
            The 403 did have one accidental virtue — it separated the no-grant refusal from the
            grant-type one above, which the conformant 400 no longer does. Separating them on
            purpose needs a distinct `error` value, and that is an open question rather than an
            oversight.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
              examples:
                malformedSelector:
                  summary: A selector that is not a uuid (invalid_request)
                  value:
                    error: invalid_request
                    error_description: The tenant and customer selectors must be UUIDs, and customer requires a tenant.
                noActiveGrant:
                  summary: Good credentials, no grant for the context you named (unauthorized_client)
                  value:
                    error: unauthorized_client
                    error_description: No active integration grant for this tenant.
        '401':
          description: |
            The client id or the secret is wrong (`error: invalid_client`). If you sent credentials
            in the body *and* in an `Authorization: Basic` header, the body's are the pair that was
            checked.

            When you authenticated with an `Authorization` header, this response also carries
            `WWW-Authenticate: Basic realm="OAuth"` (RFC 6749 §5.2). Credentials sent in the body get
            no such header — it is the only response on this endpoint that ever carries one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OauthError'
              example:
                error: invalid_client
                error_description: Client authentication failed
        '429':
          description: |
            Too many attempts. This endpoint is throttled harder than the rest of the API because
            every attempt costs a password check: **60 a minute per IP address** and **20 a minute
            per client id**, whichever you reach first. Wait the number of seconds in `Retry-After`,
            and hold each token for its full 15 minutes rather than minting one per request.

            **Branch on the status, not the body.** This is the one refusal here that is not an
            OAuth error object: it is the framework's own rate-limit page and it arrives as HTML
            whatever you put in `Accept`. `Retry-After` carries everything you need from it.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema: { type: integer }
          content:
            text/html:
              schema: { type: string }

  /v1/faxes:
    get:
      tags: [Faxes]
      operationId: listFaxes
      summary: List faxes
      description: |
        The inbox and the outbox in one collection, newest first.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: include
          in: query
          description: Related resources to side-load. `attempts` is the only path a fax publishes.
          required: false
          schema:
            type: string
            enum: [attempts]
          example: attempts
        - name: filter[fax_account]
          in: query
          required: false
          description: Only faxes on this fax account.
          schema: { type: string, format: uuid }
        - name: filter[direction]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FaxDirection'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FaxStatus'
        - name: filter[from]
          in: query
          required: false
          description: Exact match on the sending number, in E.164.
          schema: { type: string }
          example: '+14075550100'
        - name: filter[to]
          in: query
          required: false
          description: Exact match on the receiving number, in E.164.
          schema: { type: string }
          example: '+13025556789'
        - name: filter[client_reference]
          in: query
          required: false
          description: Exact match on the reference your own system supplied at send time.
          schema: { type: string }
        - name: filter[created_after]
          in: query
          required: false
          description: Faxes created at or after this moment.
          schema: { type: string }
          example: '2026-08-05'
        - name: filter[created_before]
          in: query
          required: false
          description: Faxes created at or before this moment.
          schema: { type: string }
          example: '2026-08-20'
        - name: filter[read]
          in: query
          required: false
          description: '`true` for faxes somebody has marked read, `false` for the rest.'
          schema: { type: boolean }
        - name: filter[archived]
          in: query
          required: false
          schema: { type: boolean }
        - name: filter[tag]
          in: query
          required: false
          description: |
            Match on your own tags, one query member per tag name — `filter[tag][clinic]=north`.
            Two of them mean BOTH, never either. `filter[tag]` with no tag name is refused with a
            400 rather than ignored.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties: { type: string }
      responses:
        '200':
          description: A page of faxes.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxCollectionDocument'
              example:
                data:
                  - type: faxes
                    id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                    attributes:
                      direction: inbound
                      status: received
                      failureCode: null
                      from: '+13025556789'
                      to: '+14075550100'
                      pagesTotal: 3
                      pagesTransferred: 3
                      partial: false
                      attemptCount: 1
                      resolution: fine
                      clientReference: null
                      coverPage: null
                      read: false
                      archived: false
                      tags:
                        clinic: north
                      documents:
                        - kind: pdf
                          ordinal: 0
                          contentType: application/pdf
                          byteSize: 40960
                          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                          pages: 3
                      createdAt: '2026-08-16T11:02:31.000000Z'
                      completedAt: '2026-08-16T11:03:04.000000Z'
                    meta:
                      page:
                        cursor: 'eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ'
                links:
                  first: 'https://api.example.com/v1/faxes?page%5Bsize%5D=25'
                  next: 'https://api.example.com/v1/faxes?page%5Bafter%5D=eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ&page%5Bsize%5D=25'
                meta:
                  page:
                    size: 25
                    nextCursor: 'eyJ2IjoxLCJrIjpbIjIwMjYtMDgtMTYgMTE6MDI6MzEiLCIwMTk4YzRhMS0yYjNjLTdkNGUtOGY1MC0xYTJiM2M0ZDVlNmYiXSwiZCI6Ijc1NTYwMWEyNDE5ODljMzEifQ'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Faxes]
      operationId: sendFax
      summary: Send a fax
      description: |
        Accepts one outbound fax and answers **202** — the render and the call happen after this
        returns. Watch it finish with `GET /v1/faxes/{fax}`; there is no callback to wait on, and no
        retry to perform.

        **The body is flat, and it is not a JSON:API document.** A body carrying `data` is refused
        outright rather than half-obeyed. Send either `multipart/form-data` with `documents[]` file
        parts, or JSON whose `documents` is a list of `https` URLs — never both in one request.

        **`Idempotency-Key` is mandatory.** A second POST carrying the same key replays the first
        rather than sending a second fax, and the replay is marked with an `Idempotent-Replay: true`
        response header. That header is the ONLY thing that tells the two apart: the body is the
        same fax either way.
      security:
        - bearerAuth: [fax:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Your own key for this send. Reusing one returns the original fax instead of sending a
            second copy — which is what makes a retry of a request whose response you never saw
            safe.
          schema: { type: string }
          example: chart-4471-attempt-1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendFaxMultipartRequest'
            encoding:
              cover_page:
                contentType: application/json
              tags:
                contentType: application/json
          application/json:
            schema:
              $ref: '#/components/schemas/SendFaxUrlRequest'
            example:
              fax_account: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
              to: '+13025556789'
              from: '+14075550100'
              resolution: fine
              client_reference: chart-4471
              tags:
                clinic: north
              cover_page:
                to_name: Dr Ruiz
                subject: Records
              documents:
                - https://records.acme-vet.example/charts/4471.pdf
      responses:
        '202':
          description: |
            Accepted. The fax exists and is readable at `GET /v1/faxes/{fax}`.
          headers:
            Idempotent-Replay:
              description: |
                Present, with the value `true`, only when this response replays an earlier send that
                carried the same `Idempotency-Key`. Absent on a fresh accept.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendFaxAccepted'
              example:
                data:
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  status: queued
                  direction: outbound
                  from: '+14075550100'
                  to: '+13025556789'
                  client_reference: chart-4471
                  created_at: '2026-08-16T11:02:31+00:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Either the credential may not create faxes, or `from` is a well-formed number this fax
            account does not hold (`code: caller_id_not_permitted`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '403'
                    code: caller_id_not_permitted
                    title: Caller ID not permitted
                    detail: That number is not routed to this fax account.
                    source:
                      parameter: from
        '409':
          description: The fax account is suspended, so it may receive but not send.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: fax_account_suspended
                    title: Fax account suspended
                    detail: >-
                      That fax account is suspended, so it can receive faxes but not send them.
                      Reinstate it first.
        '413':
          description: 'One document is past the per-file ceiling (`code: document_too_large`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '415':
          description: |
            A document's BYTES are not a PDF, TIFF, PNG or JPEG. The name and the declared content
            type are both yours, so neither decides — the bytes are sniffed
            (`code: unsupported_media_type`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: |
            The request is malformed — a missing `Idempotency-Key`, a `to` that is not E.164, a
            JSON:API document body, more than five documents, uploads and URLs mixed in one request,
            a document URL that is not `https` or points at a private address, a `fax_account` id
            that names no account of yours, or — on a multipart send — a `tags` or `cover_page` part
            whose body is not a JSON object, or whose decoded fields fail the same shape and length
            rules the JSON body enforces on `tags.*` / `cover_page.*` (`code: validation_failed`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    code: validation_failed
                    title: Invalid request
                    detail: The to field format is invalid.
                    source:
                      parameter: to
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFax
      summary: Read one fax
      description: |
        The fax and its document metadata. **No object key and no URL is ever published here** — the
        bytes are reached only through `GET /v1/faxes/{fax}/media`, which mints a short-lived
        download URL and records who asked.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - name: include
          in: query
          required: false
          description: Side-load the per-call attempt records.
          schema:
            type: string
            enum: [attempts]
      responses:
        '200':
          description: The fax.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxDocumentResponse'
              example:
                data:
                  type: faxes
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  attributes:
                    direction: outbound
                    status: delivered
                    failureCode: null
                    from: '+14075550100'
                    to: '+13025556789'
                    pagesTotal: 3
                    pagesTransferred: 3
                    partial: false
                    attemptCount: 1
                    resolution: fine
                    clientReference: chart-4471
                    coverPage:
                      to_name: Dr Ruiz
                      subject: Records
                    read: false
                    archived: false
                    tags:
                      clinic: north
                    documents:
                      - kind: pdf
                        ordinal: 0
                        contentType: application/pdf
                        byteSize: 40960
                        sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        pages: 3
                    createdAt: '2026-08-16T11:02:31.000000Z'
                    completedAt: '2026-08-16T11:06:02.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Faxes]
      operationId: updateFax
      summary: Move a fax's read, archived or tags flags
      description: |
        Three fields belong to the reader — `read`, `archived` and `tags` — and everything else
        describes a transmission that already happened. Naming a machinery-owned field with a
        CHANGED value is refused with a 422 rather than silently dropped; echoing the whole document
        back unchanged is fine, which is what makes GET-then-PATCH work.

        `tags` is replaced wholesale, never merged: sending `{"clinic":"north"}` means the tags ARE
        that. `read` is idempotent — marking an already-read fax read again does not move when it
        was first read.
      security:
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FaxUpdateRequest'
            example:
              data:
                type: faxes
                id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                attributes:
                  read: true
                  archived: true
                  tags:
                    clinic: north
      responses:
        '200':
          description: The updated fax.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Faxes]
      operationId: deleteFax
      summary: Delete a fax
      description: |
        Asymmetric on purpose: the **media is purged immediately** and the metadata row is retired
        as the evidence that a transmission happened. A soft delete that left the images in place
        would be a deletion in name only.
      security:
        - bearerAuth: [fax:write]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/media:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFaxMedia
      summary: Mint a download URL for a fax's document
      description: |
        Answers a small **plain-JSON composite**, not the bytes and not a JSON:API document: `url`
        is a time-limited download URL **on your own API host**, and `expires_at` says until when.

        Follow `url` with a plain `GET` and **no `Authorization` header**. It carries its own
        signature, and that signature is the authorization — sending a bearer token is unnecessary
        and adds nothing. Treat the URL as opaque: the signature covers the whole address, so
        editing any part of it invalidates the link.

        Every call mints a fresh capability and writes an audit entry naming who asked, so do not
        cache the URL past its expiry or share it — anyone holding it reads that document with no
        further authorization.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - name: format
          in: query
          required: false
          description: '`pdf` is what a person reads; `tiff` is what went on the wire. Defaults to `pdf`.'
          schema:
            type: string
            enum: [pdf, tiff]
            default: pdf
      responses:
        '200':
          description: A download URL and the facts about what is behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaLink'
              example:
                url: https://api.yourprovider.example/v1/faxes/0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f/media/content?format=pdf&expires=1787057037&signature=...
                expires_at: '2026-08-16T11:07:31+00:00'
                byte_size: 40960
                sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The fax does not exist for you, OR it has no document of that kind — a fax accepted a
            second ago has no rendered PDF yet, and a purged one has none any more
            (`code: not_found`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: '`format` was neither `pdf` nor `tiff` (`code: validation_failed`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFaxThumbnail
      summary: Mint a download URL for a fax's first-page preview
      description: |
        The same composite as `GET /v1/faxes/{fax}/media`, one document kind over: the first-page
        PNG generated at conversion. Its own path rather than a third `format` value, because a
        list screen asks for a preview from a different place in your code than the one that
        downloads a fax.

        Follow `url` the same way — a plain `GET`, no `Authorization` header.
      security:
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: A download URL for the preview image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaLink'
              example:
                url: https://api.yourprovider.example/v1/faxes/0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f/thumbnail/content?expires=1787057037&signature=...
                expires_at: '2026-08-16T11:07:31+00:00'
                byte_size: 128
                sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No fax of yours has that id, or it has no preview (`code: not_found`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/media/content:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: downloadFaxMedia
      summary: Download a fax's document (the URL the media link names)
      description: |
        **You do not build this URL — you follow it.** `GET /v1/faxes/{fax}/media` answers a `url`,
        and this is where it points. Treat it as opaque: the signature covers the whole address, so
        editing the path, the host or any query parameter invalidates it.

        Send **no `Authorization` header**. The signature is the authorization here, which is why
        this operation publishes no security scheme — the entitlement was checked when the link was
        minted, by the request that held your token. The link stops working at the `expires_at` the
        mint reported.

        The bytes are streamed with the media type pinned to the document kind, and
        `Content-Disposition: inline`. Range requests are not supported: a `Range` header is ignored
        and the whole document is returned with a 200.
      security: []
      parameters:
        - name: format
          in: query
          required: false
          description: '`pdf` is what a person reads; `tiff` is what went on the wire. Defaults to `pdf`.'
          schema:
            type: string
            enum: [pdf, tiff]
            default: pdf
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The document itself.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
        '403':
          description: |
            The signature did not verify, or the link has expired (`Invalid signature.`). Mint a
            fresh one — a link cannot be repaired or extended.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: |
            There is no such document to serve (`code: not_found`). Every miss answers the same way
            on purpose — an unknown fax, one that has not rendered yet, one whose media has been
            purged, and one whose stored object has gone missing are deliberately
            indistinguishable, because this route takes no credential.

            **A link that minted successfully can still 404 here.** The mint reports the
            `byte_size` and `sha256` recorded for the document, which is metadata; this endpoint
            answers for the bytes. Retry the mint, and treat a repeat as "the document is not
            available" rather than as a transport failure.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/faxes/{fax}/thumbnail/content:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: downloadFaxThumbnail
      summary: Download a fax's first-page preview (the URL the thumbnail link names)
      description: |
        The same contract as `GET /v1/faxes/{fax}/media/content`, one document kind over: the
        first-page PNG. Follow the `url` from `GET /v1/faxes/{fax}/thumbnail`, send no
        `Authorization` header, and treat the address as opaque. It carries no `format`.
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The preview image.
          content:
            image/png:
              schema: { type: string, format: binary }
        '403':
          description: The signature did not verify, or the link has expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: 'There is no preview to serve (`code: not_found`) — see the media route for why every miss looks alike.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/faxes/{fax}/cancel:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    post:
      tags: [Faxes]
      operationId: cancelFax
      summary: Cancel a fax before the far end answers
      description: |
        A decision recorded against a call that may already be up — which is why it is a verb and
        not `PATCH {status: "cancelled"}`. **200 and not 202**: the decision is complete when this
        returns, and no later result undoes it.

        Once the far end has answered, or the fax has already finished, it cannot be cancelled:
        that is a 409 whose `meta.reason` is `answered` or `terminal`. This refusal carries **no
        `code` member** — the status is the contract.
      security:
        - bearerAuth: [fax:write]
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFaxResult'
              example:
                data:
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  status: cancelled
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The call has been answered, or the fax has already finished.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Fax not cancellable
                    detail: That fax's call has already been answered.
                    meta:
                      reason: answered
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-accounts:
    get:
      tags: [Fax accounts]
      operationId: listFaxAccounts
      summary: List fax accounts
      description: |
