                    completedAt: '2026-08-16T11:06:02.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Faxes]
      operationId: updateFax
      summary: Move a fax's read, archived or tags flags
      description: |
        Three fields belong to the reader — `read`, `archived` and `tags` — and everything else
        describes a transmission that already happened. Naming a machinery-owned field with a
        CHANGED value is refused with a 422 rather than silently dropped; echoing the whole document
        back unchanged is fine, which is what makes GET-then-PATCH work.

        `tags` is replaced wholesale, never merged: sending `{"clinic":"north"}` means the tags ARE
        that. `read` is idempotent — marking an already-read fax read again does not move when it
        was first read.
      security:
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FaxUpdateRequest'
            example:
              data:
                type: faxes
                id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                attributes:
                  read: true
                  archived: true
                  tags:
                    clinic: north
      responses:
        '200':
          description: The updated fax.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Faxes]
      operationId: deleteFax
      summary: Delete a fax
      description: |
        Asymmetric on purpose: the **media is purged immediately** and the metadata row is retired
        as the evidence that a transmission happened. A soft delete that left the images in place
        would be a deletion in name only.
      security:
        - bearerAuth: [fax:write]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/media:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFaxMedia
      summary: Mint a download URL for a fax's document
      description: |
        Answers a small **plain-JSON composite**, not the bytes and not a JSON:API document: `url`
        is a time-limited download URL **on your own API host**, and `expires_at` says until when.

        Follow `url` with a plain `GET` and **no `Authorization` header**. It carries its own
        signature, and that signature is the authorization — sending a bearer token is unnecessary
        and adds nothing. Treat the URL as opaque: the signature covers the whole address, so
        editing any part of it invalidates the link.

        Every call mints a fresh capability and writes an audit entry naming who asked, so do not
        cache the URL past its expiry or share it — anyone holding it reads that document with no
        further authorization.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - name: format
          in: query
          required: false
          description: '`pdf` is what a person reads; `tiff` is what went on the wire. Defaults to `pdf`.'
          schema:
            type: string
            enum: [pdf, tiff]
            default: pdf
      responses:
        '200':
          description: A download URL and the facts about what is behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaLink'
              example:
                url: https://api.yourprovider.example/v1/faxes/0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f/media/content?format=pdf&expires=1787057037&signature=...
                expires_at: '2026-08-16T11:07:31+00:00'
                byte_size: 40960
                sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The fax does not exist for you, OR it has no document of that kind — a fax accepted a
            second ago has no rendered PDF yet, and a purged one has none any more
            (`code: not_found`).
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: '`format` was neither `pdf` nor `tiff` (`code: validation_failed`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: getFaxThumbnail
      summary: Mint a download URL for a fax's first-page preview
      description: |
        The same composite as `GET /v1/faxes/{fax}/media`, one document kind over: the first-page
        PNG generated at conversion. Its own path rather than a third `format` value, because a
        list screen asks for a preview from a different place in your code than the one that
        downloads a fax.

        Follow `url` the same way — a plain `GET`, no `Authorization` header.
      security:
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: A download URL for the preview image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaLink'
              example:
                url: https://api.yourprovider.example/v1/faxes/0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f/thumbnail/content?expires=1787057037&signature=...
                expires_at: '2026-08-16T11:07:31+00:00'
                byte_size: 128
                sha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'No fax of yours has that id, or it has no preview (`code: not_found`).'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/faxes/{fax}/media/content:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: downloadFaxMedia
      summary: Download a fax's document (the URL the media link names)
      description: |
        **You do not build this URL — you follow it.** `GET /v1/faxes/{fax}/media` answers a `url`,
        and this is where it points. Treat it as opaque: the signature covers the whole address, so
        editing the path, the host or any query parameter invalidates it.

        Send **no `Authorization` header**. The signature is the authorization here, which is why
        this operation publishes no security scheme — the entitlement was checked when the link was
        minted, by the request that held your token. The link stops working at the `expires_at` the
        mint reported.

        The bytes are streamed with the media type pinned to the document kind, and
        `Content-Disposition: inline`. Range requests are not supported: a `Range` header is ignored
        and the whole document is returned with a 200.
      security: []
      parameters:
        - name: format
          in: query
          required: false
          description: '`pdf` is what a person reads; `tiff` is what went on the wire. Defaults to `pdf`.'
          schema:
            type: string
            enum: [pdf, tiff]
            default: pdf
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The document itself.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/tiff:
              schema: { type: string, format: binary }
        '403':
          description: |
            The signature did not verify, or the link has expired (`Invalid signature.`). Mint a
            fresh one — a link cannot be repaired or extended.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: |
            There is no such document to serve (`code: not_found`). Every miss answers the same way
            on purpose — an unknown fax, one that has not rendered yet, one whose media has been
            purged, and one whose stored object has gone missing are deliberately
            indistinguishable, because this route takes no credential.

            **A link that minted successfully can still 404 here.** The mint reports the
            `byte_size` and `sha256` recorded for the document, which is metadata; this endpoint
            answers for the bytes. Retry the mint, and treat a repeat as "the document is not
            available" rather than as a transport failure.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/faxes/{fax}/thumbnail/content:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    get:
      tags: [Faxes]
      operationId: downloadFaxThumbnail
      summary: Download a fax's first-page preview (the URL the thumbnail link names)
      description: |
        The same contract as `GET /v1/faxes/{fax}/media/content`, one document kind over: the
        first-page PNG. Follow the `url` from `GET /v1/faxes/{fax}/thumbnail`, send no
        `Authorization` header, and treat the address as opaque. It carries no `format`.
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: integer, format: int64 }
        - name: signature
          in: query
          required: true
          description: Part of the signature, minted for you. Do not edit it.
          schema: { type: string }
      responses:
        '200':
          description: The preview image.
          content:
            image/png:
              schema: { type: string, format: binary }
        '403':
          description: The signature did not verify, or the link has expired.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '404':
          description: 'There is no preview to serve (`code: not_found`) — see the media route for why every miss looks alike.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/faxes/{fax}/cancel:
    parameters:
      - $ref: '#/components/parameters/FaxId'
    post:
      tags: [Faxes]
      operationId: cancelFax
      summary: Cancel a fax before the far end answers
      description: |
        A decision recorded against a call that may already be up — which is why it is a verb and
        not `PATCH {status: "cancelled"}`. **200 and not 202**: the decision is complete when this
        returns, and no later result undoes it.

        Once the far end has answered, or the fax has already finished, it cannot be cancelled:
        that is a 409 whose `meta.reason` is `answered` or `terminal`. This refusal carries **no
        `code` member** — the status is the contract.
      security:
        - bearerAuth: [fax:write]
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFaxResult'
              example:
                data:
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  status: cancelled
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The call has been answered, or the fax has already finished.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Fax not cancellable
                    detail: That fax's call has already been answered.
                    meta:
                      reason: answered
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-accounts:
    get:
      tags: [Fax accounts]
      operationId: listFaxAccounts
      summary: List fax accounts
      description: |
        A token issued for a person lists only the accounts that person was granted; a machine
        credential lists every account in its scope.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[customer]
          in: query
          required: false
          description: Only the accounts of this customer.
          schema: { type: string, format: uuid }
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FaxAccountStatus'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more fax account ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The fax accounts.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountCollectionDocument'
              example:
                data:
                  - type: fax-accounts
                    id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    attributes:
                      name: Front desk
                      headerText: ACME VETERINARY
                      defaultFromE164: '+14075550100'
                      retentionDays: 90
                      retentionPages: 500
                      status: active
                      createdAt: '2026-08-01T09:00:00.000000Z'
                      updatedAt: '2026-08-16T11:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Fax accounts]
      operationId: createFaxAccount
      summary: Create a fax account
      description: |
        An account is created FOR one of your customers, named in the `customer` relationship. A
        customer id that is not yours answers **404** on that relationship pointer — the same answer
        an id that names nothing anywhere gets.

        Retention is two rules and each may be off: `retentionDays` deletes pages older than N days,
        `retentionPages` keeps only the newest N pages. Send `null` for either to turn it off. Naming
        neither gives the defaults — one year, no page limit.

        Numbers are not attached here: point a DID at the account through the routing API.
      security:
        - bearerAuth: [fax-accounts:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FaxAccountCreateRequest'
            example:
              data:
                type: fax-accounts
                attributes:
                  name: Front desk
                  headerText: ACME VETERINARY
                  retentionDays: 90
                  retentionPages: 500
                relationships:
                  customer:
                    data:
                      type: customers
                      id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
      responses:
        '201':
          description: The created account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The `customer` relationship names a customer that does not exist for you.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '404'
                    title: Not Found
                    detail: The related resource does not exist.
                    source:
                      pointer: /data/relationships/customer
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-accounts/{faxAccount}:
    parameters:
      - $ref: '#/components/parameters/FaxAccountId'
    get:
      tags: [Fax accounts]
      operationId: getFaxAccount
      summary: Read one fax account
      security:
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: The fax account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountDocumentResponse'
              example:
                data:
                  type: fax-accounts
                  id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                  attributes:
                    name: Front desk
                    headerText: ACME VETERINARY
                    defaultFromE164: '+14075550100'
                    retentionDays: 90
                    retentionPages: 500
                    status: active
                    createdAt: '2026-08-01T09:00:00.000000Z'
                    updatedAt: '2026-08-16T11:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Fax accounts]
      operationId: updateFaxAccount
      summary: Change a fax account's settings, or suspend it
      description: |
        `status` is the operational lever: suspending an account stops it SENDING while it goes on
        receiving, without deleting the compliance record behind it.

        An account cannot be moved to another customer — every fax it holds carries the customer it
        was sent or received for — and naming a different one is a 422 rather than a silent drop. A
        sparse PATCH of one attribute leaves every other field alone.
      security:
        - bearerAuth: [fax-accounts:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FaxAccountUpdateRequest'
            example:
              data:
                type: fax-accounts
                id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                attributes:
                  name: Front desk
                  status: suspended
      responses:
        '200':
          description: The updated account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Fax accounts]
      operationId: deleteFaxAccount
      summary: Delete a fax account
      description: |
        The account's fax PAGES are deleted permanently and the account stops being listed. The fax
        records survive — a transmission is the evidence a retention obligation and an audit are
        about — and so do the account's user grants.

        **Deleting is refused while any number routes to the account.** Remove the routing first
        (`DELETE /v1/phone-numbers/{phoneNumber}/routing`), then delete.
      security:
        - bearerAuth: [fax-accounts:write]
      responses:
        '204':
          description: Retired.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Numbers still route to this account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: fax_account_has_routed_numbers
                    title: Fax account has routed numbers
                    detail: 2 number(s) still route to the Front desk fax account. Remove their routing first, then delete it.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-accounts/{faxAccount}/numbers:
    parameters:
      - $ref: '#/components/parameters/FaxAccountId'
    get:
      tags: [Fax accounts]
      operationId: listFaxAccountNumbers
      summary: List the numbers routed to a fax account
      description: |
        Read-only. Attaching a number is the routing API's act, because a number points at one
        destination and that rule belongs to the number.
      security:
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - name: sort
          in: query
          required: false
          description: |
            Sortable fields: `createdAt`, `id`, `e164`. Prefix with `-` to reverse. The default is
            `-createdAt,-id`, newest first. Any other field is refused with a 400.
          schema: { type: string }
          example: '-createdAt'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more number ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The DIDs routed to this account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PhoneNumberCollectionDocument'
              example:
                data:
                  - type: phone-numbers
                    id: 0198c4a1-5e6f-7081-b283-4d5e6f708192
                    attributes:
                      e164: '+14075550111'
                      status: active
                      country: US
                      activatedAt: '2026-07-30T14:11:00.000000Z'
                      createdAt: '2026-07-30T14:10:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-account-users:
    get:
      tags: [Fax account users]
      operationId: listFaxAccountUsers
      summary: List fax-account grants
      description: |
        One row per (user, fax account) pair — the answer to "who can see this account's faxes?".
      security:
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[fax_account]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[user]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more grant ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The grants.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountUserCollectionDocument'
              example:
                data:
                  - type: fax-account-users
                    id: 0198c4a1-6f70-7192-c394-5e6f70819203
                    attributes:
                      userEmail: records@acme-vet.example
                      createdAt: '2026-08-02T10:00:00.000000Z'
                      updatedAt: '2026-08-02T10:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Fax account users]
      operationId: createFaxAccountUser
      summary: Grant a user access to a fax account
      description: |
        A grant is a pair of foreign keys and a fact: it exists or it does not. There is no update
        route — withdraw one by deleting it.

        The account may be one the caller does not themselves hold: administering an account is
        permission-gated, while reading its content is grant-gated, so somebody has to be able to
        add the first member.

        The user must be one of the account's customer's own users. A grant is the customer-staff
        door, so naming anybody else — one of your own staff, or another customer's user — is
        refused with a 422.
      security:
        - bearerAuth: [fax-accounts:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/FaxAccountUserCreateRequest'
            example:
              data:
                type: fax-account-users
                relationships:
                  faxAccount:
                    data:
                      type: fax-accounts
                      id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                  user:
                    data:
                      type: users
                      id: 0198c4a1-7081-72a3-d4a5-6f7081920314
      responses:
        '201':
          description: The created grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountUserDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: A relationship names a fax account or user that does not exist for you.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/fax-account-users/{faxAccountUser}:
    parameters:
      - name: faxAccountUser
        in: path
        required: true
        description: The grant's id.
        schema: { type: string, format: uuid }
    get:
      tags: [Fax account users]
      operationId: getFaxAccountUser
      summary: Read one grant
      security:
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: The grant.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountUserDocumentResponse'
              example:
