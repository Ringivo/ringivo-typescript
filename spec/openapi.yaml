  /v1/sip-trunks:
    get:
      tags: [SIP trunks]
      operationId: listSipTrunks
      summary: List SIP trunks
      description: |
        Every trunk your credential can reach. A customer-scoped credential sees its own customer's
        trunks and no others.
      security:
        - bearerAuth: [sip-trunks:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[customer]
          in: query
          required: false
          description: Only the trunks of this customer.
          schema: { type: string, format: uuid }
        - name: filter[mode]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SipTrunkMode'
        - name: filter[enabled]
          in: query
          required: false
          schema: { type: boolean }
        - name: filter[region]
          in: query
          required: false
          description: |
            The trunk's primary region. There is deliberately no `filter[tenant]`: your credential is
            already narrowed to one reseller, so such a filter could only name your own id.
          schema: { type: string, enum: [use1, usw1] }
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more trunk ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The SIP trunks.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SipTrunkCollectionDocument'
              example:
                data:
                  - type: sip-trunks
                    id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    attributes:
                      name: Joe's Pizza PBX
                      domainLabel: joespizza
                      primaryRegion: use1
                      enabled: true
                      mode: register
                      username: joespizza-7k2q9x
                      password: null
                      registrationMode: replace
                      registrationExpires: 300
                      localization: US
                      aniFormat: e164
                      dnisFormat: e164
                      dialPolicy: us_canada
                      mediaMode: anchored
                      codecs: [PCMU, PCMA, G722]
                      registration:
                        state: registered
                        contacts: 1
                        expires_at: '2026-09-10T18:31:00Z'
                      createdAt: '2026-09-01T09:00:00.000000Z'
                      updatedAt: '2026-09-09T11:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [SIP trunks]
      operationId: createSipTrunk
      summary: Create a SIP trunk
      description: |
        A trunk is created FOR one of your customers, named in the `customer` relationship. A
        customer id that is not yours answers **404** on that relationship pointer — the same answer
        an id that names nothing anywhere gets.

        `name`, `domainLabel`, `primaryRegion` and `mode` are required; a `register` trunk also needs
        `username` and `password`. Everything else falls to the platform default, so a backend
        provisioning a hundred trunks sends only the facts that differ.

        `domainLabel` is unique across the whole platform and becomes part of the hostname the phone
        system signs in to. Changing it later MOVES that hostname and ends every current
        registration.

        **A `static` trunk is refused here with a 409**, because it must name an enabled destination
        and destinations are their own resource.
      security:
        - bearerAuth: [sip-trunks:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SipTrunkCreateRequest'
            example:
              data:
                type: sip-trunks
                attributes:
                  name: Joe's Pizza PBX
                  domainLabel: joespizza
                  primaryRegion: use1
                  mode: register
                  username: joespizza-7k2q9x
                  password: a-long-generated-secret
                relationships:
                  customer:
                    data:
                      type: customers
                      id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
      responses:
        '201':
          description: The created trunk.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SipTrunkDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The `customer` relationship names a customer that does not exist for you.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '404'
                    title: Not Found
                    detail: The related resource does not exist.
                    source:
                      pointer: /data/relationships/customer
        '409':
          description: |
            A static trunk was asked for and no destination could be named. The error carries
            `code: sip_trunk_refused`. One code covers every state refusal this resource has, so the
            actionable half is always `detail` — it is the only member that can carry a count or
            name the thing in the way.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: sip_trunk_refused
                    title: Conflict
                    detail: Add at least one destination before saving a static trunk.
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/sip-trunks/{sipTrunk}:
    parameters:
      - $ref: '#/components/parameters/SipTrunkId'
    get:
      tags: [SIP trunks]
      operationId: getSipTrunk
      summary: Read one SIP trunk
      security:
        - bearerAuth: [sip-trunks:read]
      responses:
        '200':
          description: The SIP trunk.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SipTrunkDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [SIP trunks]
      operationId: updateSipTrunk
      summary: Change a SIP trunk's settings
      description: |
        A sparse PATCH of one attribute leaves every other field alone. Omitting `password` leaves the
        stored credential as it is — it is never cleared by omission, because a trunk with no password
        can neither register nor be challenged.

        A trunk cannot be moved to another customer, and its addresses and destinations are not
        edited here: naming `sipTrunkIps` or `sipTrunkTargets` is a 422 that says where they live.
      security:
        - bearerAuth: [sip-trunks:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/SipTrunkUpdateRequest'
            example:
              data:
                type: sip-trunks
                id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                attributes:
                  dialPolicy: nanp
                  enabled: false
      responses:
        '200':
          description: The updated trunk.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SipTrunkDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [SIP trunks]
      operationId: deleteSipTrunk
      summary: Delete a SIP trunk
      description: |
        The trunk, its addresses and its destinations go permanently. The phone system stops being
        able to sign in within seconds.

        **Deleting is refused while any number routes to the trunk.** Move those numbers first
        (`DELETE /v1/phone-numbers/{phoneNumber}/routing`), then delete. To stop calls without
        deleting anything, PATCH `enabled: false`.
      security:
        - bearerAuth: [sip-trunks:write]
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Numbers still route to this trunk. The error carries `code: sip_trunk_refused` — the same
            code as the create's 409, with the count in `detail`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: sip_trunk_refused
                    title: Conflict
                    detail: This trunk still routes 3 phone numbers. Move them first.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/sip-trunks/{sipTrunk}/sip-trunk-ips:
