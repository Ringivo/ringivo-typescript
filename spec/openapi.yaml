            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxDocumentResponse'
              example:
                data:
                  type: faxes
                  id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                  attributes:
                    direction: outbound
                    status: delivered
                    failureCode: null
                    from: '+14075550100'
                    to: '+13025556789'
                    pagesTotal: 3
                    pagesTransferred: 3
                    partial: false
                    attemptCount: 1
                    resolution: fine
                    clientReference: chart-4471
                    coverPage:
                      to_name: Dr Ruiz
                      subject: Records
