          description: A page of faxes.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxCollectionDocument'
              example:
                data:
                  - type: faxes
                    id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                    attributes:
                      direction: inbound
                      status: received
                      failureCode: null
                      from: '+13025556789'
                      to: '+14075550100'
                      pagesTotal: 3
                      pagesTransferred: 3
                      partial: false
                      attemptCount: 1
                      resolution: fine
                      clientReference: null
                      coverPage: null
                      read: false
                      archived: false
                      tags:
                        clinic: north
                      documents:
                        - kind: pdf
                          ordinal: 0
