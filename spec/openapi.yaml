    # -- port-orders -------------------------------------------------------------------------------
    # THREE NAMED VOCABULARIES AND NO MORE. A named enum here is one a PHP declaration owns and
    # `OpenApiConformanceTest`'s ENUM_MIRRORS holds it to. The smaller vocabularies below —
    # `portType`, a number's `numberType`, the two task words, the bill-reading states, the mail
    # `kind` — are spelled INLINE on the property that takes them, because each is one property's
    # business and there is no single PHP list for a mirror to compare against.
    PortOrderStatus:
      type: string
      description: |
        Where an order stands. `draft` is yours to edit; `awaiting_signature` is the same order
        locked while your customer signs the Letter of Authorization, and an edit returns it to
        `draft`; `awaiting_review` is with our desk; `submitted` means the paperwork went to a
        carrier; `foc_assigned` means one committed to a cutover date; `completed` and `failed` are
        the two ends.

        **The order and each of its numbers share this vocabulary, except `awaiting_signature`.**
        That one is the order's alone: it is a fact about the paperwork, and a number has none of
        its own — so a number stays `draft` until the order enters review.
      enum:
        - draft
        - awaiting_signature
        - awaiting_review
        - submitted
        - foc_assigned
        - completed
        - failed
    PortNumberFailureCause:
      type: [string, 'null']
      description: |
        Why ONE number left the port, beside the `failed` status it shares with every other way of
        ending. `withdrawn` — it was taken off the order before it moved, and nothing refused it.
        `carrier_refused` — a carrier declined this number while committing to the rest.

        **`null` is a third reading and not a missing value:** nobody stated a cause. It is what
        every number carries when the whole ORDER failed, whose own status says what happened.

        It names no carrier: `carrier_refused` says a carrier refused, never which one.
      enum:
        - withdrawn
        - carrier_refused
        - null
    PortDocumentKind:
      type: string
      description: |
        The two slots an order has, and the whole vocabulary of an upload's `kind`. The generated
        letter is not one of them — nobody uploads a letter we write.
      enum: [loa, bill]
    PortType:
      type: [string, 'null']
      description: |
        Whether the whole account moves or some lines stay behind. There is no default: a draft that
        has never been asked must not read like one that answered `full`.

        **`null` is a third reading and not a missing value:** nobody has said yet. A `partial` port
        is the one that needs `newBillingNumber`, because the losing account lives on.
      enum: [full, partial, null]
    PortNumberType:
      type: [string, 'null']
      description: |
        What the BILL says one line is. It is deliberately not corrected from what the network says —
        the two disagree often, and a carrier works from the bill.

        **`null` is a third reading and not a missing value:** the bill did not say.
      enum: [landline, wireless, voip, null]
    PortOrderTaskBillState:
      type: string
      description: '`missing` until the bill is in its slot, `received` afterwards.'
      enum: [missing, received]
    PortOrderTaskDateState:
      type: string
      description: |
        `missing` until somebody has said when the numbers should move, `chosen` once they have.

        `chosen` with a null `requestedFocDate` is an ordinary answer and not a half-finished one:
        "the first available date" is an answer that names no day, and the day is stamped when the
        order enters review, against the calendar as it stands then.
      enum: [missing, chosen]
    PortOrderTaskSignatureState:
      type: string
      description: |
        `not_ready` — no letter has been generated, so there is nothing to sign. `ready` — a letter
        is waiting and the signed slot is empty. `signed` — the slot is filled, by the signing
        ceremony or by a wet-signed scan you uploaded yourself; either way your customer is finished.
      enum: [not_ready, ready, signed]
    PortOrderBillExtractionStatus:
      type: string
      description: |
        `pending` — a bill has just been uploaded and the reading has not answered yet.
        `done` — a model answered and the blank columns were filled. `failed` — nobody could read
        it, which blocks nothing; you type the fields. `skipped` — the order left `draft` before the
        answer arrived, so nothing was applied.
      enum: [pending, done, failed, skipped]
    PortOrderRequestLinkMailKind:
      type: string
      description: |
        Which mail to send. `bill` asks for the phone bill; `signature` asks for a signature and
        needs a generated letter to point at. Both carry the SAME link — one durable link per order
        carries every task — so a kind is different words around one URL and never a second URL.
      enum: [bill, signature]
    PortOrderNumberState:
      type: object
      description: |
        Where ONE number stands. A port splits, so this is the only honest answer to "where is my
        port?" on an order a carrier has answered unevenly.
      properties:
        e164:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PortOrderStatus'
        cause:
          $ref: '#/components/schemas/PortNumberFailureCause'
        focDate:
          type: [string, 'null']
          format: date
          description: |
            The carrier's firm commitment for THIS number, as a plain `YYYY-MM-DD` day. Null until
            there is one, which is most of an order's life.
        stopped:
          type: boolean
          description: |
            Whether a carrier is currently holding this number pending a correction. It is the
            MARKER and never the carrier's own words: a losing carrier's sentence about your account
            does not cross to this plane.
        stoppedSince:
          type: [string, 'null']
          format: date-time
          description: Since when, or null while nothing is held.
    PortOrderDocumentSlot:
      type: [object, 'null']
      description: |
        One uploaded document, as a digest and a date — **never a handle**. These documents are
        fetched unauthenticated by a losing carrier's LNP desk, so their identifiers are bearer
        capabilities and no surface here publishes one. `null` is a draft's ordinary condition: an
        order is opened days before the bill it is transcribed from exists.
      properties:
        sha256:
          type: string
          description: |
            The digest of the bytes as we hold them, read back off storage rather than computed from
            what was sent. Hash your own copy and compare.
        uploadedAt:
          type: [string, 'null']
          format: date-time
    PortOrderDocuments:
      type: object
      description: The two slots, keyed by kind. Both keys are always present; either may be null.
      properties:
        loa:
          $ref: '#/components/schemas/PortOrderDocumentSlot'
        bill:
          $ref: '#/components/schemas/PortOrderDocumentSlot'
    PortOrderUnsignedLoa:
      type: [object, 'null']
      description: |
        The letter we generated for your customer to sign, or `null` before one has ever been built
        — and again after any edit that moves a field it prints.
      properties:
        sha256: { type: string }
        generatedAt: { type: [string, 'null'], format: date-time }
    PortOrderRequestLinkState:
      type: object
      description: |
        Whether your customer's door is open, and nothing that would let anyone walk through it. The
        URL exists in plaintext exactly once, in the response to the call that minted it.
      properties:
        active:
          type: boolean
          description: |
            True while a link is live. Revoked, expired and never-issued are one answer here, as
            they are everywhere else on this surface.
    PortOrderTasks:
      type: object
      description: |
        What is left for your customer to do, in their three steps: hand us the bill, say when the
        numbers should move, then sign the transfer form. Poll this to know whether to chase them —
        it is progress and names no document, no digest and no identifier.

        Each task has its OWN vocabulary; they are not one list. Read them per key.
      properties:
        bill:
          $ref: '#/components/schemas/PortOrderTaskBillState'
        date:
          $ref: '#/components/schemas/PortOrderTaskDateState'
        signature:
          $ref: '#/components/schemas/PortOrderTaskSignatureState'
    PortOrderBillExtraction:
      type: [object, 'null']
      description: |
        Whether a model read the bill, and which fields it answered for — **never what it said**.
        `null` until a bill has been uploaded at all.

        The values are already this order's own attributes wherever the reading was applied, so a
        second copy here would be one that can disagree with the fields beside it. The NAMES answer
        the question you actually have: which of these did we not have to type?
      properties:
        status:
          $ref: '#/components/schemas/PortOrderBillExtractionStatus'
        fields:
          type: array
          description: |
            The columns the reading carried a value for, in the snake_case the extractor names them
            by. `done` with an empty list is real and ordinary: the bill was read and every column
            it could have filled was already filled.
          items: { type: string }
        extractedAt:
          type: [string, 'null']
          format: date-time
    PortOrderAttributes:
      type: object
      properties:
        label:
          type: string
          maxLength: 255
          description: |
            Your own working title for the order, and the one field editable in any live state. It
            is never sent to a carrier and never printed on the letter, which is exactly why a
            rename is allowed after the rest of the order has frozen.
        country:
          type: string
          maxLength: 2
          description: Declared once at create and immutable after. Defaults to `US`.
        status:
          $ref: '#/components/schemas/PortOrderStatus'
        endUserName:
          type: [string, 'null']
          description: |
            The LEGAL name on the losing account, exactly as the bill prints it — not a contact's
            personal name, and not your own label for them. A carrier matches on this.
        endUserAddress:
          type: [string, 'null']
          description: |
            The service address as one verbatim block, which is what a losing carrier receives and
            what the letter prints. **RENDERED from the five parts below** on every edit that
            touches one, so send the parts. It stays writable because an order transcribed before
            the parts existed carries a hand-typed block and nothing else.
        loaSigner:
          type: [string, 'null']
          description: Who signs the Letter of Authorization.
        loaDate:
          type: [string, 'null']
          format: date
          description: |
            The day they sign it, as a plain `YYYY-MM-DD` — a day and not an instant, so nothing
            here invents a time nobody stored.
        currentProvider:
          type: [string, 'null']
          description: Who carries the numbers today.
        accountNumber:
          type: [string, 'null']
          description: The account number with them, as their bill prints it.
        monthlyMou:
          type: integer
          description: |
            Monthly minutes of use on the losing account. Nobody is asked for one — it rides the
            wire at its stored value, `0` unless somebody set it — and it is kept writable because
            it is a real column a carrier is told about.
        accountPin:
          type: 'null'
          description: |
            **Write-only. Every read answers `null`.** The port-out PIN is a credential on somebody
            else's account: it is stored encrypted, and a response cannot tell you whether one is on
            file. Read `accountPinAttestedNone` instead — it is the other answer to the same
            question.
        accountPinAttestedNone:
          type: boolean
          description: |
            Your own word that the losing account has NO port-out PIN. It round-trips freely — it is
            a fact about the account rather than a credential.

            A row may hold this or a PIN and never both: typing a PIN clears this for you, and
            setting this while a PIN is stored is refused. The submit gate asks for one of the two.
        billingPhone:
          type: [string, 'null']
          description: |
            The billing telephone number the losing account bills under — the BTN a carrier finds
            the customer service record by. Bill data, not a credential.
        portType:
          $ref: '#/components/schemas/PortType'
        newBillingNumber:
          type: [string, 'null']
          description: |
            The number the surviving account will bill under — asked only on a `partial` port, where
            the losing account lives on. On a full port it closes and the question has no answer.
        serviceStreetNumber: { type: [string, 'null'] }
        serviceStreetName: { type: [string, 'null'] }
        serviceCity: { type: [string, 'null'] }
        serviceState:
          type: [string, 'null']
          description: A two-letter state or province code.
        serviceZip: { type: [string, 'null'] }
        requestedFocDate:
          type: [string, 'null']
          format: date-time
          description: |
            The cutover you are asking a carrier for — an INSTANT, unlike `loaDate`, because both
            carriers are told a time of day. Optional while the order is a draft and never null
            afterwards: the submit gate stamps 11:00 Eastern on the tenth United States business day
            out when you named none, and keeps yours exactly when you did.
        contactName: { type: [string, 'null'] }
        contactTitle: { type: [string, 'null'] }
        contactEmail: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        numbersNotTransferring:
          type: [string, 'null']
          description: |
            Free text for the lines staying behind on a partial port — a note for the desk, never a
            second number list.
        numbers:
          type: array
          description: |
            The whole set to move, as bare E.164 strings. This is the WRITABLE set and it is
            replaced wholesale on every edit; where each of them STANDS is `numberStates` below.
          items: { type: string }
        correctionsRequired:
          type: boolean
          description: |
            **Is this port waiting on you?** True while a carrier is holding a number pending a
            correction, or our desk has asked you for one. Derived on every read from those markers,
            so it un-sets itself the moment a carrier withdraws its objection — which is exactly why
            it is a flag beside `status` and not an eighth state.
        correctionsNote:
          type: [string, 'null']
          description: |
            What we said to fix, in our desk's own sentence, written for you. Null wherever nobody
            has said anything — including every purely derived `correctionsRequired`, because the
            remedy for a carrier's stop lives in that carrier's own prose and that does not cross to
            this plane.
        numberStates:
          type: array
          description: |
            Where each number stands, one entry per number. A port splits, so this and not the
            order's own `status` is what answers "which of my lines have moved?".
          items:
            $ref: '#/components/schemas/PortOrderNumberState'
        documents:
          $ref: '#/components/schemas/PortOrderDocuments'
        unsignedLoa:
          $ref: '#/components/schemas/PortOrderUnsignedLoa'
        requestLink:
          $ref: '#/components/schemas/PortOrderRequestLinkState'
        tasks:
          $ref: '#/components/schemas/PortOrderTasks'
        detailsConfirmedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When a person vouched that the transcribed fields match the bill. It CLEARS on any edit
            that touches them, so it is a live fact rather than a milestone.
        signatureRequestedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the letter went to your customer. Not the request link's own age — a link is minted
            for the bill task days earlier and survives a reopen.
        billExtraction:
          $ref: '#/components/schemas/PortOrderBillExtraction'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    PortOrderResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [port-orders] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/PortOrderAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    # `Document` here is the JSON:API sense — one resource in an envelope. The PDFs an order carries
    # are `PortOrderDocuments` above and the upload pair below.
    PortOrderDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PortOrderResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PortOrderCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortOrderResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PortOrderCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [port-orders] }
            attributes:
              type: object
              # TWO MEMBERS AND NO MORE, which is the create arm's whole contract: everything else
              # this resource declares is refused with a 422 rather than dropped. See the operation.
              required: [label]
              properties:
                label: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 2 }
    PortOrderNumberInput:
      description: |
        One number to move: a bare E.164 string, or an object naming what the bill says the line is.
      oneOf:
        - type: string
        - type: object
          required: [e164]
          properties:
            e164: { type: string }
            numberType:
              $ref: '#/components/schemas/PortNumberType'
    PortOrderUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [port-orders] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              description: |
                Send what you are changing. An omitted attribute is left alone; an explicit `null`
                clears the field. `numbers` is replaced wholesale. `country`, `status`, the
                timestamps and every derived attribute may be echoed back unchanged and are a 422
                with a different value.
              properties:
                label: { type: [string, 'null'], maxLength: 255 }
                endUserName: { type: [string, 'null'] }
                endUserAddress: { type: [string, 'null'] }
                loaSigner: { type: [string, 'null'] }
                loaDate: { type: [string, 'null'], format: date }
                currentProvider: { type: [string, 'null'] }
                accountNumber: { type: [string, 'null'] }
                monthlyMou: { type: [integer, 'null'] }
                accountPin:
                  type: [string, 'null']
                  description: Write-only — see the attribute of the same name on the resource.
                accountPinAttestedNone: { type: boolean }
                billingPhone: { type: [string, 'null'] }
                portType:
                  $ref: '#/components/schemas/PortType'
                newBillingNumber: { type: [string, 'null'] }
                serviceStreetNumber: { type: [string, 'null'] }
                serviceStreetName: { type: [string, 'null'] }
                serviceCity: { type: [string, 'null'] }
                serviceState: { type: [string, 'null'] }
                serviceZip: { type: [string, 'null'] }
                requestedFocDate: { type: [string, 'null'], format: date-time }
                contactName: { type: [string, 'null'] }
                contactTitle: { type: [string, 'null'] }
                contactEmail: { type: [string, 'null'] }
                contactPhone: { type: [string, 'null'] }
                numbersNotTransferring: { type: [string, 'null'] }
                numbers:
                  type: [array, 'null']
                  items:
                    $ref: '#/components/schemas/PortOrderNumberInput'
              additionalProperties: true

    # -- the port-orders process endpoints — flat JSON, not JSON:API documents ----------------------
    PortOrderDocumentUploadRequest:
      type: object
      description: |
        The two parts an upload is made of. PDF only, decided on the file's own first five bytes,
        and at most 20 MB.
      required: [kind, file]
      properties:
        kind:
          $ref: '#/components/schemas/PortDocumentKind'
        file:
          type: string
          format: binary
          description: The PDF itself, as one file part.
    PortOrderSubmitted:
      type: object
      description: |
        A flat acknowledgement, not a JSON:API document. Read the whole order back at
        `GET /v1/port-orders/{portOrder}`.
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/PortOrderStatus'
            numbers:
              type: array
              description: The set the order went in with, as it now stands.
              items: { type: string }
    PortOrderDocumentStored:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            kind:
              $ref: '#/components/schemas/PortDocumentKind'
            sha256:
              type: [string, 'null']
              description: |
                The digest of the bytes as stored — the handle-free way to check we hold the file
                you sent.
    PortOrderLoaGenerated:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            sha256:
              type: [string, 'null']
              description: The digest of the letter now waiting to be signed.
    PortOrderRequestLinkIssued:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            url:
              type: string
              format: uri
              description: |
                Your customer's link, on your own branded portal host. **Ask again whenever you need
                it** — `POST /v1/port-orders/{portOrder}/request-link` answers with the same URL for
                as long as the link is live, so you need not store it. It was the only copy until
                2026-09-01, when the token stopped being stored hashed-only.
    PortOrderRequestLinkRevoked:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            revoked:
              type: boolean
              description: |
                Whether anything was live to revoke. `false` is an ordinary answer — most orders
                never have a link at all — and not an error.
    PortOrderRequestLinkSendRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email
          description: Your customer's address.
        kind:
          $ref: '#/components/schemas/PortOrderRequestLinkMailKind'
          default: bill
        note:
          type: [string, 'null']
          maxLength: 500
          description: Your own sentence to your customer, carried in the mail.
    PortOrderRequestLinkSent:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            sent_to:
              type: string
              format: email
              description: The address the mail went to, echoed back.
