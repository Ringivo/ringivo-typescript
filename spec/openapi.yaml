  /v1/webhook-endpoints:
    get:
      tags: [Webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: |
        **No response ever carries a signing secret** except the create and the rotate that minted
        it. Every other read answers `"secret": null` — an honest statement that the platform holds
        no readable copy.

        **Scope:** `fax:read` lists only **fax-account-scoped** endpoints; customer- and
        tenant-scoped endpoints are absent from that list and require `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[scope_type]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookScopeType'
        - name: filter[scope_id]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[active]
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: The endpoints.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCollectionDocument'
              example:
                data:
                  - type: webhook-endpoints
                    id: 0198c4a1-8192-73b4-e5b6-708192031425
                    attributes:
                      scopeType: fax_account
                      scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                      url: https://hooks.acme-vet.example/faxes
                      events: [fax.received, fax.delivered]
                      active: true
                      secret: null
                      secretPreviousExpiresAt: null
                      createdAt: '2026-08-10T08:00:00.000000Z'
                      updatedAt: '2026-08-10T08:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        **The signing secret is in this response and nowhere else, ever.** Store it before you do
        anything else; there is no way to read it back.

        The URL must be `https` with a public host — plain http, credentials in the URL, a private
        address literal and a non-http scheme are each refused at registration. A hostname that
        does not resolve yet is accepted on purpose, so you can register before publishing DNS.

        `events` is the list you want. **`null` or `[]` both mean "every event in scope"**, and the
        list is published back verbatim rather than normalised, so a client that sent `[]` can tell
        its write was understood. An event name this platform does not publish is a 422 — a typo
        would otherwise subscribe you to silence.

        `scopeType`/`scopeId` say what the endpoint hears about, and neither can be changed
        afterwards: the delivery history is the record of what THAT scope was told.

        **Scope:** `fax:write` may register only a `fax_account`-scoped endpoint; naming a
        `customer` or `tenant` scope with a `fax:*` token is refused with a 422, and needs
        `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreateRequest'
            example:
              data:
                type: webhook-endpoints
                attributes:
                  url: https://hooks.acme-vet.example/faxes
                  scopeType: fax_account
                  scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                  events: [fax.received, fax.delivered]
      responses:
        '201':
          description: |
            The created endpoint, carrying its signing secret for the only time.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: fax_account
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    active: true
                    secret: whsec_Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdo
                    secretPreviousExpiresAt: null
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-10T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            The URL, the event list or the scope was refused. A scope you may not use and a scope
            that does not exist are refused with the SAME message, on purpose — telling them apart
            would make this field a way to discover which ids are real. Supplying your own `secret`
            is refused here too.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-endpoints/{webhookEndpoint}:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    get:
      tags: [Webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Read one webhook endpoint
      description: |
        `secret` is always `null` here — see the create.

        **Scope:** `fax:read` reaches only **fax-account-scoped** endpoints; a customer- or
        tenant-scoped endpoint answers **404** to a `fax:*` token, exactly as an id that names
        nothing does, and requires `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: The endpoint.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: fax_account
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    active: true
                    secret: null
                    secretPreviousExpiresAt: null
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-10T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Webhook endpoints]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint's URL, events or switch
      description: |
        `url`, `events` and `active` are editable. `scopeType` and `scopeId` are not — a caller who
        wants a different scope removes this endpoint and registers another.

        **Scope:** `fax:write` reaches only **fax-account-scoped** endpoints; a customer- or
        tenant-scoped endpoint answers **404** to a `fax:*` token and requires `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdateRequest'
            example:
              data:
                type: webhook-endpoints
                id: 0198c4a1-8192-73b4-e5b6-708192031425
                attributes:
                  url: https://hooks.acme-vet.example/faxes/v2
                  events: [fax.received, fax.delivered]
                  active: false
      responses:
        '200':
          description: The updated endpoint.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      description: |
        The fan-out stops at once. **The delivery history survives** — "why did our integration stop
        hearing about faxes?" is answered by the deliveries of the endpoint somebody removed.

        **Scope:** `fax:write` reaches only **fax-account-scoped** endpoints; a customer- or
        tenant-scoped endpoint answers **404** to a `fax:*` token and requires `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-endpoints/{webhookEndpoint}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    post:
      tags: [Webhook endpoints]
      operationId: rotateWebhookEndpointSecret
      summary: Mint a new signing secret
      description: |
        A verb and not a PATCH, because it MINTS A CREDENTIAL and starts a clock.

        The new secret is in this response and nowhere else. The **previous secret goes on signing
        for a 24-hour grace window**, and `secretPreviousExpiresAt` is the deadline — during that
        window a delivery's signature header carries two `v1` values, newest first. Roll your own
        copy before the deadline.

        **Scope:** `fax:write` may rotate only a **fax-account-scoped** endpoint's secret; a
        customer- or tenant-scoped endpoint answers **404** to a `fax:*` token and requires
        `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      responses:
        '200':
          description: The endpoint, carrying the newly minted secret.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: fax_account
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    active: true
                    secret: whsec_bmV3c2VjcmV0dmFsdWUwMTIzNDU2Nzg5YWJjZGVm
                    secretPreviousExpiresAt: '2026-08-17T08:00:00.000000Z'
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-16T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-deliveries:
    get:
      tags: [Webhook deliveries]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: |
        Read-only evidence about your endpoints — what we owed each one, and what became of it.

        **`filter[status]=dead` is the query this collection exists for.** Delivery is at-least-once
        with a dead-letter, so "we tried and gave up" is a state that is reached without your server
        ever hearing about it; this is where you learn what you missed after an outage. An unknown
        status value is refused with a 400 rather than ignored.

        The body we POSTed is never published here — only its `payloadSha256` digest, so an
        integrator who kept what they received can prove it is what we sent.

        **Scope:** a delivery borrows its endpoint's reach, so `fax:read` lists only the deliveries
        of **fax-account-scoped** endpoints; the deliveries of customer- and tenant-scoped endpoints
        require `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: include
          in: query
          required: false
          description: Side-load the endpoint this delivery was for.
          schema:
            type: string
            enum: [endpoint]
        - name: filter[endpoint]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[event_type]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryCollectionDocument'
              example:
                data:
                  - type: webhook-deliveries
                    id: 0198c4a1-9203-74c5-f6c7-819203142536
                    attributes:
                      eventId: 0198c4a1-a314-75d6-07d8-92031425364a
                      eventType: fax.received
                      payloadSha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                      status: dead
                      attemptNo: 7
                      statusCode: 500
                      durationMs: 812
                      error: null
                      nextAttemptAt: null
                      deliveredAt: null
                      deadAt: '2026-08-16T19:45:00.000000Z'
                      createdAt: '2026-08-16T11:02:31.000000Z'
                      updatedAt: '2026-08-16T19:45:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-deliveries/{webhookDelivery}:
    parameters:
      - name: webhookDelivery
        in: path
        required: true
