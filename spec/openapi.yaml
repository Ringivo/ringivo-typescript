  /v1/number-lookups:
    post:
      tags: [Number lookups]
      operationId: lookUpNumber
      summary: Look up a phone number
      description: |
        Everything we can find out about one number: who carries it now, what name it presents, and
        whether it can receive text messages.

        **This call costs you money.** It is billed at your per-lookup rate, every time, for any
        number — including one you do not own and never will. There is no free or cached variant, and
        a repeated lookup of the same number is a second lookup.

        **It needs a personal access token, not a client-credentials token.** This is the only
        operation here with that requirement, and it follows from the line above: because a lookup
        spends your balance, it is not something a third-party integration's credential may do on
        your behalf. Mint a token for one of your own console users from the portal's Security page.
        That user needs permission to look numbers up, which is held by exactly the roles that can
        already buy a number — so if they can purchase a DID, they can run a lookup.

        **A POST, not a GET, for that reason.** A GET is safe and idempotent by definition, so
        proxies, prefetchers and retry logic are entitled to repeat one — and each repeat would be
        another charge.

        **Nothing is stored.** We return the answer and keep no copy of it, so there is no
        `GET /v1/number-lookups/{id}` to come back to and no id to come back with. Keep what you need
        from the response.

        ## The two geographies are two different facts

        `dialedNumber` describes the number you asked about. `components.lrn.data.rateCenter` and
        `.state` describe its **LRN** — the routing number it currently ports to. **They frequently
        disagree, and both are right**: `6502530000` is `MT VIEW` by dialed number and `MILLVALLEY`
        by LRN. Do not merge them, and do not treat one as a correction of the other. Use the LRN's
        when you care where the call actually lands, and the dialed number's when you care where the
        number is nominally from.

        `dialedNumber.rateCenter` and `.state` are `null` for a toll-free number. That is **absent,
        not missing**: toll-free numbers are assigned individually rather than in geographic blocks,
        so there is no rate center to report. Nothing failed.

        ## Read `status` before you read `data`

        Each of the three components reports its own outcome, and `data` is `null` for two of them:

        | `status` | What it means | Charged |
        |---|---|---|
        | `answered` | The provider returned data. It is in `data`. | yes |
        | `no_data` | The provider answered, and holds nothing for this number. | yes |
        | `failed` | We could not get an answer. | see `charged` |

        **`no_data` and `failed` are not the same fact.** "This number has no CNAM record" and "we
        could not ask" look identical if you only check `data == null`, and only the first is
        something to show a user as an answer.

        `charged` tells you whether this lookup was billed. A lookup where **some** components
        answered is billed in full; one where **every** component failed is not billed at all.
      security:
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberLookupRequest'
            example:
              number: '6502530000'
      responses:
        '200':
          description: |
            The lookup. **200 and not 201** — nothing was created, and there is nothing to fetch
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberLookupResult'
              example:
                data:
                  number: '+16502530000'
                  lookedUpAt: '2026-08-19T18:04:11+00:00'
                  charged: true
                  dialedNumber:
                    rateCenter: MT VIEW
                    state: CA
                  components:
                    lrn:
                      status: answered
                      data:
                        lrn: '14159686199'
                        spid: '8824'
                        ocn: '8826'
                        lata: '722'
                        lec: LEVEL 3 COMMUNICATIONS, LLC - CA
                        lineType: WIRELESS
                        rateCenter: MILLVALLEY
                        state: CA
                        jurisdiction: INDETERMINATE
                        local: INDETERMINATE
                        portedAt: '2014-12-23T15:47:47+00:00'
                    callerName:
                      status: answered
                      data:
                        name: GOOGLEPLEX
                    messaging:
                      status: no_data
                      data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Not a number we will look up — it is not a North American number, or its area
            code/exchange does not exist. **Nothing was looked up and you were not charged**: this
            check runs before any provider is asked.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Not a number we can look up
                    detail: >-
                      No exchange 650-999 exists, so +16509999999 is not a real number. Nothing was
                      looked up and nothing was charged.
                    source:
                      pointer: /number
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices:
    get:
      tags: [ZTP devices]
      operationId: listZtpDevices
      summary: List registered phone MAC addresses
      description: |
        Every MAC you have registered, newest first. `state` is where the vendor registration stands,
        and `lastConnectedAt` is when that phone last checked in with the redirect service — refreshed
        hourly, so `observedAt` tells you how old the reading is.

        `filter[mac]` takes any of the three spellings a MAC is written in — `001565f0517a`,
        `00:15:65:f0:51:7a`, `00-15-65-f0-51-7a` — so you can filter on the value printed on the back
        of the phone without re-spelling it.
      security:
        - bearerAuth: [ztp-devices:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[mac]
          in: query
          required: false
          description: One MAC address, in any of the three accepted spellings.
          schema: { type: string }
          example: '00:15:65:f0:51:7a'
        - name: filter[customer]
          in: query
          required: false
          description: Only the devices assigned to this customer.
          schema: { type: string, format: uuid }
        - name: filter[state]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProvisioningState'
        - name: filter[id]
          in: query
          required: false
          description: One or more device ids.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The registered devices.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceCollectionDocument'
              example:
                data:
                  - type: ztp-devices
                    id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                    attributes:
                      mac: 001565f0517a
                      vendor: yealink
                      label: Front desk
                      state: active
                      stateDetail: null
                      stateChangedAt: '2026-08-26T09:14:02.000000Z'
                      registeredAt: '2026-08-26T09:13:58.000000Z'
                      lastConnectedAt: '2026-08-26T11:02:40.000000Z'
                      lastIp: 203.0.113.24
                      observedAt: '2026-08-26T11:30:00.000000Z'
                      createdAt: '2026-08-26T09:13:55.000000Z'
                      updatedAt: '2026-08-26T11:30:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [ZTP devices]
      operationId: registerZtpDevice
      summary: Register a phone MAC address
      description: |
        One MAC per call. Send it in any of the three accepted spellings — `001565f0517a`,
        `00:15:65:f0:51:7a` or `00-15-65-f0-51-7a`, upper or lower case — and it is stored and
        returned as 12 lowercase hexadecimal characters.

        The device is created in `pending` and the vendor call is queued, so `state` is what tells you
        whether the redirect is in place. Poll the device, or read the collection, until it reaches
        `active` or `failed`; a `failed` device carries the reason in `stateDetail` and can be retried
        once you have acted on it.

        **A MAC belongs to exactly one company.** If it is already registered by somebody else, the
        call is refused with a 422 and the message *This MAC is already registered — contact support.*
        — we will not tell you who holds it, and we will not move it. Re-registering a MAC you already
        have is an ordinary duplicate, and its refusal names the device you already own.

        `customer` is optional. Omit it and the device goes into your unassigned pool; a
        **customer-scoped** credential that omits it gets its own customer, because a device it could
        not see afterwards would be of no use to it.
      security:
        - bearerAuth: [ztp-devices:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ZtpDeviceCreateRequest'
            example:
              data:
                type: ztp-devices
                attributes:
                  mac: '00:15:65:f0:51:7a'
                  label: Front desk
                relationships:
                  customer:
                    data:
                      type: customers
                      id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
      responses:
        '201':
          description: The registered device, `pending` while the vendor call is queued.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The `customer` relationship names a customer that does not exist for you.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '404'
                    title: Not Found
                    detail: The related resource does not exist.
                    source:
                      pointer: /data/relationships/customer
        '422':
          description: |
            The MAC was not one we can accept — it is not a MAC address, it is already registered by
            another company, or it is already in your own inventory. `source.pointer` names the
            member.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Registration refused
                    detail: This MAC is already registered — contact support.
                    source:
                      pointer: /data/attributes/mac
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices/{ztpDevice}:
    parameters:
      - $ref: '#/components/parameters/ZtpDeviceId'
    get:
      tags: [ZTP devices]
      operationId: getZtpDevice
      summary: Read one registered device
      security:
        - bearerAuth: [ztp-devices:read]
      responses:
        '200':
          description: The device.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
              example:
                data:
                  type: ztp-devices
                  id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                  attributes:
                    mac: 001565f0517a
                    vendor: yealink
                    label: Front desk
                    state: failed
                    stateDetail: >-
                      This MAC is registered to another company's Yealink account — contact Yealink
                      support to have it released, then retry.
                    stateChangedAt: '2026-08-26T09:14:02.000000Z'
                    registeredAt: null
                    lastConnectedAt: null
                    lastIp: null
                    observedAt: null
                    createdAt: '2026-08-26T09:13:55.000000Z'
                    updatedAt: '2026-08-26T09:14:02.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [ZTP devices]
      operationId: updateZtpDevice
      summary: Re-label a device, or move it between your customers
      description: |
        Two fields are editable and nothing else: `label`, your own caption, and the `customer` the
        device is assigned to. Send `customer: {data: null}` to put it back in your unassigned pool.
        Assignment is bookkeeping on our side — the vendor never learns of it, and the phone is not
        touched.

        **The MAC cannot be changed.** A different MAC is a different phone: register that one and
        remove this registration. Sending a different `mac` is a 422; sending the same one in another
        spelling is not a change and is accepted.

        A **customer-scoped** credential cannot use this endpoint at all. Assignment decides whose a
        phone is, so it is never self-served by the customer it would move a device to.
      security:
        - bearerAuth: [ztp-devices:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ZtpDeviceUpdateRequest'
            example:
              data:
                type: ztp-devices
                id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                attributes:
                  label: Suite 300
      responses:
        '200':
          description: The updated device.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [ZTP devices]
      operationId: deleteZtpDevice
      summary: Deregister a device
      description: |
        The device leaves your inventory immediately, and its removal from the vendor's redirect
        service is queued behind it. There is no precondition: a device stuck in `failed` is exactly
        the one you most need to be able to remove.
      security:
        - bearerAuth: [ztp-devices:write]
      responses:
        '204':
          description: Deregistered.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices/{ztpDevice}/retry:
    parameters:
      - $ref: '#/components/parameters/ZtpDeviceId'
    post:
      tags: [ZTP devices]
      operationId: retryZtpDevice
      summary: Try a refused registration again
      description: |
        Only a `failed` device can be retried, and only once you have acted on the reason in its
        `stateDetail` — a MAC held by another company at the vendor is released by that vendor's
        support desk and by nobody else, so retrying before then simply fails again.

        The device goes back to `pending` and the vendor call is queued, which is why this answers
        **202** rather than 200: the retry is accepted, not finished. Read `state` back to see where
        it got to.

        Any other state is a **409**: a device that is still settling has a run in flight, and one
        that is `active` has nothing to re-drive.
      security:
        - bearerAuth: [ztp-devices:write]
      responses:
        '202':
          description: Queued.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The device has not failed, so there is nothing to retry.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Nothing to retry
                    detail: This registration is active, not failed, so there is nothing to retry.
        '429':
          $ref: '#/components/responses/RateLimited'

# -------------------------------------------------------------------------------------------------
# Outbound webhooks — what WE send to YOUR server.
# -------------------------------------------------------------------------------------------------
webhooks:
  fax.received:
    post:
      tags: [Webhook endpoints]
      operationId: onFaxReceived
      summary: A fax arrived and is ready to read
      description: |
        Fired when an inbound fax has been rendered, not when the call ended — nearly every
        consumer's first act is to fetch the PDF, and the PDF does not exist until the render has
        run.

        **It fires on a failed render too, with `render_failed: true`.** That means the fax is real
        and its metadata is complete, and only the document is missing. A call that answered and
        turned out not to be a fax is NOT this event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaxReceivedEvent'
            example:
              event_id: 0198c4a1-a314-75d6-07d8-92031425364a
              type: fax.received
