  message.received:
    post:
      tags: [Webhook endpoints]
      operationId: onMessageReceived
      summary: A text or picture message arrived for one of your numbers
      description: |
        Fired when somebody texts a number you have enabled for messaging. This is the push half of
        `GET /v1/inbound-messages` — `data.id` is that collection's id, so refetch the message there
        when you want it back.

        **Media is described, never carried.** Each part names its content type, its filename when
        it had one, the vendor's encoding and its decoded size. There is no image and no URL: we do
        not keep the bytes, so ask your messaging provider for the file. A text message carries an
        empty `media` list rather than an absent key.

        **Scope: `tenant` and `customer`** — which is every scope there is, so the only endpoint
        that does not hear a message is one that did not ask for the type. A message belongs to a
        number, which belongs to a customer, which belongs to you — so a tenant-scoped endpoint and
        a customer-scoped one both hear it.
        `data.customer_id` is null while the number sits unassigned in your own pool, and only your
        tenant-scoped endpoints are called for that one.

        `occurred_at` is the instant the message was sent — the same value as `data.received_at` —
        and never the moment we reached you.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageReceivedEvent'
            example:
              event_id: 0198c4a1-e7b3-7a41-9c62-5f0d8a1b2c3d
              type: message.received
              occurred_at: '2026-08-16T11:14:07+00:00'
              data:
                id: 0198c4a1-6f70-7182-b394-4d5e6f708192
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                customer_id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
                kind: mms
                from: '+13025556789'
                to: '+14075550100'
                body: Here is the referral form.
                media:
                  - content_type: image/jpeg
                    filename: photo.jpg
                    encoding: base64
                    bytes: 40213
                received_at: '2026-08-16T11:14:07+00:00'
      responses:
        '2XX':
          description: Any 2XX means you accepted it.
  port_order.bill_extraction_settled:
    post:
      tags: [Webhook endpoints]
      operationId: onPortOrderBillExtractionSettled
      summary: The reading of an uploaded bill finished, whichever way it ended
      description: |
        Fired when the reading of a bill you uploaded stops being pending. It is the END of that
        wait and the only event the wait has — uploading the bill queues the reading and fires
        nothing.

        `data.status` is one of three words. `done` — a model answered and your blank columns were
        filled. `skipped` — the order left `draft` before the answer arrived, so nothing was
        applied. `failed` — nobody could read it, which blocks nothing; you type the fields.
        `pending` belongs to the shared vocabulary and never reaches you here, because it is the
        start of the wait rather than its end.

        **Three keys, and never a field the bill said.** Not the legal name, not the account number,
        and above all not the port-out PIN. Read `GET /v1/port-orders/{portOrder}` for what the
        model named — `billExtraction` carries the reading — with your own credential, which is
        where authorization runs.

        **Scope: `tenant` only.** A port order belongs to no customer and no fax account, so only a
        tenant-scoped endpoint ever receives this, and registering one needs `webhooks:*` per the
        scope note on these operations. An endpoint on either narrower scope may subscribe to the
        name and is then never called.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortOrderBillExtractionSettledEvent'
            example:
              event_id: 0198c4a1-c8d9-7b06-9e14-7b2c3d4e5f60
              type: port_order.bill_extraction_settled
              occurred_at: '2026-08-16T09:41:12+00:00'
              data:
                port_order_id: 0198c4a1-9203-74c5-a6d7-819203142536
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                status: done
      responses:
        '2XX':
          description: Any 2XX means you accepted it.
  port_order.status_changed:
    post:
      tags: [Webhook endpoints]
      operationId: onPortOrderStatusChanged
      summary: A port order moved from one status to another
      description: |
        Fired when an existing order changes status, with both ends of the move in the body. A
        CREATED ORDER FIRES NOTHING: there is no `from` to name.

        **Four keys, and never the contents of the order.** No customer name, no numbers, no
        port-out PIN. Read `GET /v1/port-orders/{portOrder}` with your own credential when you want
        them; that request is where the values live and where authorization runs.

        **Scope: `tenant` only**, exactly as `port_order.bill_extraction_settled` and for the same
        reason — a port order belongs to no customer and no fax account.

        Both ends are frozen at the moment of the move. An order that moved twice before we reached
        you sends two events, each describing its own move, and the two may arrive in either order.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortOrderStatusChangedEvent'
            example:
              event_id: 0198c4a1-f10c-7e58-8d73-6a1b2c3d4e5f
              type: port_order.status_changed
              occurred_at: '2026-08-16T17:20:44+00:00'
              data:
                port_order_id: 0198c4a1-9203-74c5-a6d7-819203142536
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                from: awaiting_review
                to: submitted
      responses:
        '2XX':
          description: Any 2XX means you accepted it.
  call-recording.available:
    post:
      tags: [Webhook endpoints]
      operationId: onCallRecordingAvailable
      summary: A recording of a call is ready to play or download
      description: |
        Fired when the recording of a call has finished uploading and we hold a copy of it. Not when
        the call ended: the recording does not exist until the switch has converted it and the bytes
        have reached our bucket, which is minutes later.

        **Ask for the audio with `GET /v1/pbx/call-records/{id}/recordings`.** This body names what
        arrived and carries no way to fetch it — no object key, no URL — for the same reason the fax
        events carry none: a body travels to you over the public internet and lands in your log
        aggregator, and a link to a recording of somebody's telephone call is a bearer capability
        sitting there forever. That request is where authorization runs and where the access is
        recorded.

        **`duration_seconds` can be null.** The switch does not always report how long a capture
        runs, and the recording is real either way — the audio is in our bucket and
        `GET /v1/pbx/call-records/{id}/recordings` serves it. Do not treat a null duration as a
        missing recording.

        **`data.superseded` is why you may hear about one recording twice.** Both switches capture
        every call independently, and one capture can be short. When the longer one replaces it, the
        bytes behind the SAME recording change and we send this event again with `superseded: true`
        — so `byte_size`, `duration_seconds` and above all `sha256` differ from what you were told
        the first time. A digest that no longer matches a copy you already downloaded is this, not a
        corrupted download. The replacement happens at most once per recording.

        **One call can produce more than one recording.** Each is a separate capture with its own
        `ccc_id` and its own event; `call_id` is what ties them to the same call.

        **You are told once per change, and never once per retry.** We send this event when a
        recording first arrives and when a supersede changes the audio behind it — nothing else
        raises it, and re-processing an announcement we have already handled sends nothing. If one
        does reach you twice, both copies carry the same `event_id`, because for this event the id
        is derived from the recording and the `sha256` rather than minted per send. Dedupe on it,
        as the envelope says.

        **Scope: `tenant` and `customer`, never `fax_account`.** A recording belongs to a customer,
        which belongs to you. `data.customer_id` is null for a recording on a domain we cannot
        resolve to one of your customers, and only your tenant-scoped endpoints are called for it.

        `occurred_at` is the moment the recording became available to us, and never the moment we
        reached you — so a supersede's `occurred_at` is later than the first event's.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallRecordingAvailableEvent'
            example:
              event_id: 6be0d8be-ef92-5045-97ff-43c277e2f1b6
              type: call-recording.available
              occurred_at: '2026-09-12T10:17:02+00:00'
              data:
                id: 63e7c087-b332-5ff3-9d26-d7dcddfa5cc1
                customer_id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
                call_id: 20260912101500000002-00112233445566778899aabbccddeeff
                ccc_id: 00b1
                duration_seconds: 97
                byte_size: 1552000
                sha256: abababababababababababababababababababababababababababababababab
                superseded: false
                recorded_at: '2026-09-12T10:15:11+00:00'
                ended_at: '2026-09-12T10:16:48+00:00'
      responses:
        '2XX':
          description: Any 2XX means you accepted it.
  call-transcript.available:
    post:
      tags: [Webhook endpoints]
      operationId: onCallTranscriptAvailable
      summary: A written transcript of a call is ready to read
      description: |
        Fired when we have transcribed the recording of a call. It is a separate moment from
        `call-recording.available` and always later: the audio has to exist before it can be
        transcribed, and the transcription itself takes a little while. Subscribing to one does not
        subscribe you to the other.

        **The words are not in this body, and never will be.** No transcript, no excerpt, no
        summary. A webhook body travels to you over the public internet and is kept in your logs at
        whatever retention you keep — and the words of somebody's telephone call are not something
        either of us should leave there. The read endpoint that serves the text is not published
        yet; it arrives in a later release, and it is where authorization will run and where the
        access will be recorded. Until then this event tells you a transcript exists.

        **Not every recording gets one.** Which calls are transcribed automatically is the phone
        system's own setting, not ours, and a recording we could not transcribe produces no event
        at all rather than an empty one. So treat the absence of this event as "no transcript",
        never as "not yet".

        **`duration_seconds` is the audio's length as the transcription measured it**, which can
        differ by a second or so from the same figure on `call-recording.available` — they are two
        measurements of one file, not one number reported twice.

        **You are told once.** A transcript is written once per recording and never updated, so
        there is no superseding event here as there is for recordings. If one does reach you twice,
        both copies carry the same `event_id` — for this event the id is derived from the transcript
        and its text rather than minted per send. Dedupe on it, as the envelope says.

        **Scope: `tenant` and `customer`, never `fax_account`** — and always the same pair the
        recording carried, because a transcript's owner is its recording's owner. `data.customer_id`
        is null for a call on a domain we cannot resolve to one of your customers, and only your
        tenant-scoped endpoints are called for it.

        `occurred_at` is the moment the transcript became available to us, and never the moment we
        reached you.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallTranscriptAvailableEvent'
            example:
              event_id: 1d3a6c02-5f21-5a44-b0c7-9e2f4471aa80
              type: call-transcript.available
              occurred_at: '2026-09-12T10:21:37+00:00'
              data:
                id: 63e7c087-b332-5ff3-9d26-d7dcddfa5cc1
                recording_id: 63e7c087-b332-5ff3-9d26-d7dcddfa5cc1
                customer_id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
                call_id: 20260912101500000002-00112233445566778899aabbccddeeff
                ccc_id: 00b1
                language: en-US
                duration_seconds: 97
      responses:
        '2XX':
          description: Any 2XX means you accepted it.

  webhook.heartbeat:
    post:
      tags: [Webhook endpoints]
      operationId: onWebhookHeartbeat
      summary: A keepalive proving the webhook path from one of our regions is working
      description: |
        Sent every five minutes, from each of our regions, to every endpoint that asks for it by
        name. It reports nothing about your data: it exists so that you — and we — can tell the
        difference between "nothing happened" and "something between us is broken".

        **You have to ask for it explicitly.** This is the one event an endpoint subscribed to
        everything does NOT receive: leaving `events` empty means every event about your faxes,
        messages, port orders and calls, and never this one. Name `webhook.heartbeat` in `events`
        to start receiving it, and remove it to stop. That is deliberate — nobody should be signed
        up for 288 deliveries a day by omission.

        **What a gap means.** A beat that does not arrive means one of the links between the event
        happening and your endpoint being called is down, and that a real event raised in that
        window may not have reached you either. Nothing is queued up for later: we expire a beat
        rather than bank it, so after an outage you get the NEXT beat, not a burst of old ones. A
        beat's `emitted_at` is therefore always recent, and a gap in the `sequence` you have seen
        is the record of the outage.

        **`sequence` counts within one region** and increases by one per beat. It is what tells you
        a beat is genuinely new. A sequence that repeats or goes backwards is a fault on our side
        and worth telling us about.

        **Each region beats independently.** You will see a `region` you did not choose and cannot
        change; treat each region's `sequence` as its own series. A region we do not deliver
        webhooks from does not beat at all.

        **Scope: `tenant` only.** A heartbeat is about our platform rather than about anything of
        one customer's, so a customer-scoped endpoint cannot subscribe to it.

        `occurred_at` equals `data.emitted_at`, and neither is the moment we reached you.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookHeartbeatEvent'
            example:
              event_id: 28bd5a88-2196-5e5d-ae52-54687a788ce3
              type: webhook.heartbeat
              occurred_at: '2026-09-18T14:05:00+00:00'
              data:
                region: usw1
                emitted_at: '2026-09-18T14:05:00+00:00'
                sequence: 40213
                nonce: 0199c1f0-1111-7000-8000-00000000000a
                origin: scheduler
      responses:
        '2XX':
          description: Any 2XX means you accepted it.

  pbx_change.confirmed:
    post:
      tags: [Webhook endpoints]
      operationId: onPbxChangeConfirmed
      summary: A change you made to the phone system is now in place
      description: |
        The phone system applies a change asynchronously: our write is accepted immediately and the
        changed row reaches us a short time later. This fires at the second moment — when the change
        was actually seen in place.

        **Field NAMES only, never the values.** `fields` says which columns the change touched; the
        values are your subscriber's own details and stay behind your credential.

        **Scope: `tenant` only.** A change is recorded against the switch row it targets, which is
        reached by a phone-system key rather than through a customer of yours.

        A change that was reported stalled and then landed sends `pbx_change.stalled` FIRST and this
        second, for the same `intent_id`. A no-op save — one that asked for values the system already
        held — sends nothing at all.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PbxChangeConfirmedEvent'
            example:
              event_id: 0198c4a1-f10c-7e58-8d73-6a1b2c3d4e60
              type: pbx_change.confirmed
              occurred_at: '2026-09-16T01:20:44+00:00'
              data:
                intent_id: 0198c4a1-9203-74c5-a6d7-819203142537
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                target_id: 0198c4a1-7731-5a2e-9c44-2b1908f6d3e1
                table: sipbxdomain_subscriber_config
                fields: [firstname, lastname]
                submitted_at: '2026-09-16T01:20:14+00:00'
      responses:
        '2XX':
          description: Any 2XX means you accepted it.

  pbx_change.stalled:
    post:
      tags: [Webhook endpoints]
      operationId: onPbxChangeStalled
      summary: A change you made has not shown up yet
      description: |
        **This is not a failure.** A change that has not appeared within the platform's watch window
        is reported here so you are not left guessing, but it very often lands a moment later — in
        which case `pbx_change.confirmed` follows for the same `intent_id`. Treat this as "not yet"
        rather than "did not work", and do not re-send the change on it.

        The window is an operator-tuned number, not a property of your change, so the same change may
        stall one day and not the next.

        **Field NAMES only, never the values**, and **scope: `tenant` only** — both exactly as
        `pbx_change.confirmed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PbxChangeStalledEvent'
            example:
              event_id: 0198c4a1-f10c-7e58-8d73-6a1b2c3d4e61
              type: pbx_change.stalled
              occurred_at: '2026-09-16T01:20:44+00:00'
              data:
                intent_id: 0198c4a1-9203-74c5-a6d7-819203142538
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                target_id: 0198c4a1-7731-5a2e-9c44-2b1908f6d3e1
                table: sipbxdomain_domains_config
                fields: [description]
                submitted_at: '2026-09-16T01:20:14+00:00'
      responses:
        '2XX':
          description: Any 2XX means you accepted it.

components:
  securitySchemes:
    # A personal access token, issued to one of your own console users from the portal's Personal
    # access tokens page (Account › Personal access tokens). It authenticates AS that person and is
    # authorized by their live permissions, so it carries no scopes at all.
    #
    # Only ONE operation takes this instead of a client-credentials token, and the reason is money:
    # a number lookup spends your balance on every call, so it is deliberately not reachable by a
    # third-party integration's credential. See that operation's description.
    personalAccessToken:
      type: http
      scheme: bearer
      description: A personal access token from your console user's Personal access tokens page (Account › Personal access tokens).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    basicAuth:
      type: http
      scheme: basic
      description: |
        Client credentials for the two token endpoints, and for nothing else — base64 of
        `client_id:client_secret`, the spelling RFC 6749 section 2.3.1 defines.

        It is an ALTERNATIVE to the body's `client_id`/`client_secret`, never a second factor and
        never required. Send your SECRET one way only: a request carrying a `client_secret` in the
        body while this header also carries one is refused with a 400 `invalid_request` (RFC 6749
        section 2.3). A body `client_id` beside this header is fine — that is one method plus a
        redundant name. Every other operation on this API authenticates with the bearer token this
        one mints.

  parameters:
    FaxId:
      name: fax
      in: path
      required: true
      description: The fax's id.
      schema: { type: string, format: uuid }
    FaxAccountId:
      name: faxAccount
      in: path
      required: true
      description: The fax account's id.
      schema: { type: string, format: uuid }
    WebhookEndpointId:
      name: webhookEndpoint
      in: path
      required: true
      description: The webhook endpoint's id.
      schema: { type: string, format: uuid }
    ZtpDeviceId:
      name: ztpDevice
      in: path
      required: true
      description: The registered device's id.
      schema: { type: string, format: uuid }
    PortOrderId:
      name: portOrder
      in: path
      required: true
      description: The port order's id.
      schema: { type: string, format: uuid }
    MessagingEnablementId:
      name: enablement
      in: path
      required: true
      description: The text-messaging request's id.
      schema: { type: string, format: uuid }
    InboundMessageId:
      name: message
      in: path
      required: true
      description: The received message's id.
      schema: { type: string, format: uuid }
    HostedMessagingOrderId:
      name: hostedMessagingOrder
      in: path
      required: true
      description: The hosted messaging order's id.
      schema: { type: string, format: uuid }
    PhoneNumberId:
      name: phoneNumber
      in: path
      required: true
      description: The phone number's id.
      schema: { type: string, format: uuid }
    TenantId:
      name: tenant
      in: path
      required: true
      description: The tenant's id. Only the credential's own tenant resolves; any other id is a 404.
      schema: { type: string, format: uuid }
    CustomerId:
      name: customer
      in: path
      required: true
      description: The customer's id. A customer that is not on your account is a 404.
      schema: { type: string, format: uuid }
    PbxSubscriberId:
      name: subscriber
      in: path
      required: true
      description: The PBX subscriber's id.
      schema: { type: string, format: uuid }
    PbxDeviceId:
      name: device
      in: path
      required: true
      description: The device registration's id.
      schema: { type: string, format: uuid }
    CallRecordId:
      name: callRecord
      in: path
      required: true
      description: The call record's id.
      schema: { type: string, format: uuid }
    RecordingId:
      name: recording
      in: path
      required: true
      description: |
        The recording's id, from an item of `GET /v1/pbx/call-records/{callRecord}/recordings`. It
        is derived from the phone system's own `(call id, capture id)`, so it is the same id in
        every region and a supersede reuses it.
      schema: { type: string, format: uuid }
    TranscriptRecordingId:
      name: recording
      in: path
      required: true
      description: |
        The recording's id, from an item of
        `GET /v1/pbx/call-records/{callRecord}/transcripts`. A transcript is keyed by its recording
        — one transcript per capture — so this is the same id the recordings list publishes, and the
        same id in every region.
      schema: { type: string, format: uuid }
    PageSize:
      name: page[size]
      in: query
      required: false
      description: |
        Rows per page. The default is 25 and the ceiling is 100. A size past the ceiling, or one
        that is not a positive whole number, is refused with a 400 whose error carries
        `meta: {page: {maxSize: 100}}` — never clamped, because a clamped page looks like a short
        one and a caller cannot tell the two apart.
      schema: { type: integer, minimum: 1, maximum: 100 }
    PageAfter:
      name: page[after]
      in: query
      required: false
      description: |
        Return the page that FOLLOWS this cursor — an opaque cursor from `meta.page.nextCursor`, a
        resource's `meta.page.cursor`, or a pagination link; never build or edit one. A cursor
        replayed under a different `filter` or `sort` is refused with a 400. Cannot be combined with
        `page[before]`.
      schema: { type: string }
    PageBefore:
      name: page[before]
      in: query
      required: false
      description: |
        Return the page that PRECEDES this cursor — this is how you poll for rows that arrived since
        your last read. An opaque cursor from `meta.page.nextCursor`, a resource's
        `meta.page.cursor`, or a pagination link; never build or edit one. A cursor replayed under a
        different `filter` or `sort` is refused with a 400. Cannot be combined with `page[after]`.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Sortable fields: `createdAt`, `id`. Prefix with `-` to reverse. The default is
        `-createdAt,-id`, newest first. Any other field is refused with a 400.

        The whitelist is short by design. A sortable field is a component of the cursor key, so it
        must be indexed — or the walk re-sorts the whole set on every page — and immutable, or the
        boundary moves under a walker and a row is served twice or skipped.
      schema: { type: string }
      example: '-createdAt'

    SipTrunkId:
      name: sipTrunk
      in: path
      required: true
      description: The SIP trunk's id.
      schema: { type: string, format: uuid }
    SipTrunkIpId:
      name: sipTrunkIp
      in: path
      required: true
      description: The allowed address's id.
      schema: { type: string, format: uuid }
    SipTrunkTargetId:
      name: sipTrunkTarget
      in: path
      required: true
      description: The destination's id.
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: No usable bearer token was presented.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: |
        Authenticated, and not entitled — a missing scope, permission or fax-account grant.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: |
        Nothing of yours has that id. **This includes "it belongs to another scope"** — a 403 there
        would confirm the row exists.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    BadQuery:
      description: |
        A query parameter was not one this collection accepts — an unknown filter value, a
        `page[size]` past the ceiling, a `filter[tag]` with no tag name, or a list-valued filter
        sent without its brackets (`filter[id]=<id>` instead of `filter[id][]=<id>`). Refused
        rather than ignored, because a filter that silently did nothing would answer 200 with the
        WHOLE collection to a caller who believes they narrowed it.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnprocessableDocument:
      description: |
        The document was well formed and could not be applied — a field the machinery owns carrying
        a CHANGED value, a value past a published limit, or a missing required member. Each error's
        `source.pointer` names the member.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    PhoneSystemUnreachable:
      description: |
        The phone system refused the request or could not be reached. Nothing was dialled and the
        request may be retried. `errors[0].meta.vendor_status` carries the status the phone system
        itself answered with, so a refusal and an outage can be told apart.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    RateLimited:
      description: 'Too many requests (`code: rate_limited`).'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'

  schemas:
    # -- The mint (POST /oauth/token) -------------------------------------------------------------
    OauthTokenRequest:
      type: object
      # `tenant` IS REQUIRED HERE because this document describes the INTEGRATOR contract, which is
      # the only one an integrator can call (see the `info.description`). The platform lane — our own
      # machine principals, which send no `tenant` — is internal infrastructure and is deliberately
      # not described in a public API reference, so there is no union of lanes to express and no
      # `oneOf` to write. A union would put a branch into both generated SDKs that no user of them
      # can ever take.
      #
      # `scope` IS REQUIRED FOR THE SAME REASON, and it follows from behaviour rather than taste:
      # on this lane an omitted `scope` intersects the grant to nothing, and an empty effective set
      # is refused. So a request without it is ALWAYS a 400 — which is what "required" means, and
      # leaving it optional would publish a call that cannot succeed.
      #
      # `client_id`/`client_secret` stay optional because they may ride an `Authorization: Basic`
      # header instead (RFC 6749 section 2.3.1) — a genuine either/or for the same caller, which is
      # a different thing from a lane the reader does not have.
      required: [grant_type, tenant, scope]
      description: |
        The body may be sent as `application/x-www-form-urlencoded` (RFC 6749 section 4.4.2) or as
        JSON; both are read the same way. Send `client_id` and `client_secret` unless they ride an
        `Authorization: Basic` header. `tenant` and `scope` are always required.
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: |
            Always `client_credentials` for an integration credential. Omitting it is a 400
            `unsupported_grant_type` — this endpoint does not infer it.
        client_id:
          type: string
          format: uuid
          description: |
            The client id you were issued. Omit it only when it rides an `Authorization: Basic`
            header instead. If you send both, the body's value is the one checked.
        client_secret:
          type: string
          description: |
            Its secret. In the body it travels over TLS and never in a URL; the alternative is the
            `Authorization: Basic` header, never a query parameter either way.
        tenant:
          type: string
          format: uuid
          description: |
            The reseller you are acting for. Your client must hold an active grant for it, or the
            request is refused with a 400 `unauthorized_client`.

            **REQUIRED.** There is no inference — omit it and the request is a 400 `invalid_request`
            naming this parameter. An empty value (`""` or `null`) counts as omitted, because RFC
            6749 section 3.2 says "Parameters sent without a value MUST be treated as if they were
            omitted from the request", and so gets that same refusal rather than a different one. A
            value that is present and not a uuid is also a 400 `invalid_request`.

        customer:
          type: [string, 'null']
          format: uuid
          description: |
            One customer inside that tenant, when a grant names one. It SELECTS a context somebody
            already granted and narrows nothing by itself. Omit it — or send null — for the
            tenant-wide token. Sending it without `tenant` is a 400 `invalid_request`.
        scope:
          type: string
          description: |
            The scopes you are asking for, as ONE space-delimited string (RFC 6749 section 3.3).
            What you receive is the intersection with your client's ceiling, your grant and, on a
            customer-scoped token, the customer-scopeable set. A scope outside that is dropped
            silently, so read `scope` back off the response.

            Silently means *a scope that exists*, and *as long as something survives*. A scope NAME
            this platform does not publish is a 400 `invalid_scope` whose `hint` names it, and so is
            an intersection that comes out EMPTY — including omitting this member altogether. See
            the operation description.

            This is the only scope spelling the endpoint reads. A `scopes` array is ignored, not
            refused — and since it leaves the intersection empty, a request that sends only `scopes`
            is answered 400 `invalid_scope` rather than handing you an empty token.
          examples: ['numbers:read numbers:route']
    OauthTokenResponse:
      type: object
      # `scope` IS NOT REQUIRED and the omission is deliberate: a token carrying no scopes omits it
      # rather than publishing `""`, which RFC 6749 section 5.1's grammar has no spelling for.
      # `scopes` stays required — it is ours, not the RFC's, and `[]` is a perfectly good value —
      # so a caller always has exactly one member that answers "what did I get?".
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
          description: 'The bearer token. Send it as `Authorization: Bearer <token>`.'
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the token expires — 900, a fresh 15 minutes.
        scope:
          type: string
          description: |
            The scopes the token actually carries, space-delimited (RFC 6749 section 5.1). This is
            the authoritative answer and it may be shorter than what you asked for.

            **OMITTED when the token carries no scopes**, because section 5.1's grammar has no
            spelling for an empty value. Read `scopes` when this is absent — only a platform-level
            credential can reach that case, since an integrator's empty set is refused at the mint.
          examples: ['numbers:read numbers:route']
        scopes:
          type: array
          items: { type: string }
          description: |
            The same list as an array. It always agrees with `scope`, and unlike `scope` it is
            ALWAYS present: a token carrying nothing answers `[]` here, so there is always one
            member that tells you what you got.
    OauthError:
      type: object
      required: [error, error_description]
      description: |
        An OAuth 2.0 error object (RFC 6749 section 5.2), served as `application/json`. This is the
        shape of every refusal at `POST /oauth/token` except the 429, which is the framework's own
        rate-limit page. Every other operation on this API answers with a JSON:API error document
        instead.
      properties:
        error:
          type: string
          description: |
            The machine-readable reason, and **the member to branch on** — the status cannot do it
            for you. This endpoint answers `invalid_request`, `invalid_scope`,
            `unsupported_grant_type` and `unauthorized_client` all with a **400**, which is what RFC
            6749 section 5.2 prescribes for the token endpoint, and only `invalid_client` with a
            401. One caveat: `unauthorized_client` covers two causes — no active grant, and a client
            not configured for the `client_credentials` grant type — which nothing machine-readable
            separates. The 400 response describes both.
        error_description:
          type: string
          description: A sentence for a human reading a log. Do not parse it.
        hint:
          type: string
          description: |
            Which input caused it, when the server can name one — an unpublished scope name, a
            missing parameter. Present on some refusals and absent on others, so treat it as
            optional: the tenant/customer refusals this platform adds carry no hint at all.

    # -- JSON:API envelope -------------------------------------------------------------------------
    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    ResourceLinks:
      type: object
      description: Links belonging to one resource object.
      properties:
        self: { type: string, format: uri }
      additionalProperties: true
    CollectionLinks:
      type: object
      description: |
        Pagination links. `first` is always present, `prev` whenever a previous page exists, and
        `next` on every page but the last — on the final page `next` is ABSENT from the document
        altogether. Branch on `meta.page.nextCursor` instead: it is `null` at the end and present on
        every page, so one member answers "is there more?" everywhere. There is no `last` link.

        A link that does not apply is ABSENT rather than null — the encoder cannot carry a null
        href — so these three are plain strings whenever they appear at all.
      properties:
        self: { type: [string, 'null'], format: uri }
        first: { type: string, format: uri }
        prev: { type: string, format: uri }
        next: { type: string, format: uri }
      additionalProperties: true
    PageMeta:
      type: object
      description: |
        Where this page sits in the collection it came from.
      required: [size, nextCursor]
      properties:
        size:
          type: integer
          description: The number of rows a full page holds for this request.
        nextCursor:
          type: [string, 'null']
          description: |
            Send this back as `page[after]` for the page that follows. `null` on the final page —
            the end-of-feed signal.
        total:
          type: integer
          description: |
            The exact number of rows the collection holds under the filters applied, repeated on
            every page of the walk. Present on SOME collections only, so read it as optional: of the
            collections documented here `customers`, `fax-accounts`, `fax-account-users` and
            `webhook-endpoints` publish it, and `faxes` and `webhook-deliveries` never do. Counting a table that only
            grows costs more with every row, which is the price a cursor walk exists to not pay.
      additionalProperties: true
    DocumentMeta:
      type: object
      description: |
        Document-level metadata. A paged collection carries `page` here.
      properties:
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: true
    ResourceMeta:
      type: object
      description: |
        Metadata belonging to one resource object.
      properties:
        page:
          type: object
          description: |
            This row's own place in the collection that served it. Present on the members of a
            paginated collection, and absent everywhere else — a single-resource read and a
            side-loaded `included` row were never positions in a walk.
          properties:
            cursor:
              type: string
              description: |
                An opaque cursor for THIS row. Send it as `page[after]` for the rows after it or as
                `page[before]` for the rows before it, under the same `filter` and `sort`.
          additionalProperties: true
      additionalProperties: true
    RelationshipToOne:
      type: object
      description: |
        A to-one relationship. `data` is present only when the relationship was resolved — a plain
        read that included nothing gives `links` alone.
      properties:
        links:
          $ref: '#/components/schemas/ResourceLinks'
        data:
          oneOf:
            - $ref: '#/components/schemas/ResourceIdentifier'
            - type: 'null'
    RelationshipToMany:
      type: object
      description: A to-many relationship.
      properties:
        links:
          $ref: '#/components/schemas/ResourceLinks'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceIdentifier'
    ErrorSource:
      type: object
      description: |
        Where the problem is. A JSON:API document body gets a `pointer`; a flat form body or a query
        parameter gets a `parameter`.
      properties:
        pointer: { type: string }
        parameter: { type: string }
    Error:
      type: object
      description: One problem with one request.
      # `status` ALONE IS REQUIRED, because `title` is genuinely not always there. Measured
      # 2026-08-31 against a live authenticated request: a refusal raised by the business rule behind
      # an endpoint carries `status`, `detail` and `source` and NO title
      # (`{"detail":"port_type must be one of: full, partial.","source":{"pointer":
      # "/data/attributes/portType"},"status":"422"}` from `PATCH /v1/port-orders/{id}`), while a
      # refusal raised by document validation one layer earlier carries `"title":"Unprocessable
      # Entity"`. Requiring it typed a member the API omits as non-optional in both generated SDKs.
      required: [status]
      properties:
        status:
          type: string
          description: The HTTP status, as a string.
        title:
          type: string
          description: |
            A short human phrase — the same for every instance of a code. **Optional**: a refusal
            that comes from an endpoint's own business rule often carries `detail` and `source` and
            no title at all, so branch on `status` and `code`, never on this.
        detail:
          type: string
          description: What went wrong this time, in a sentence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        source:
          $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      description: |
        The stable machine vocabulary an integrator branches on. Not every refusal carries one:
        where no published code names the case, the status is the contract and `meta` carries the
        detail.
      enum:
        - validation_failed
        - caller_id_not_permitted
        - document_too_large
        - too_many_pages
        - unsupported_media_type
        - fax_account_suspended
        - fax_account_has_routed_numbers
        - number_is_default_caller_id
        - rate_limited
        - not_found
        - forbidden
        - internal_error
        - sip_trunk_refused
        - transcript_pending
        - transcript_failed
    ErrorDocument:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'

    # -- Shared vocabularies -----------------------------------------------------------------------
    FaxDirection:
      type: string
      enum: [inbound, outbound]
    FaxStatus:
      type: string
      description: |
        `queued`, `converting`, `sending`, `delivered`, `partial` and `cancelled` belong to an
        outbound fax; `received` to an inbound one; `failed` to both.
      enum:
        - queued
        - converting
        - sending
        - delivered
        - partial
        - cancelled
        - received
        - failed
    FaxFailureCode:
      type: [string, 'null']
      description: The stable machine reason a fax ended badly. Null on every fax that has not failed.
      enum:
        - busy
        - no_answer
        - no_fax_tone
        - negotiation_failed
        - line_quality
        - line_dropped
        - incompatible
        - document_error
        - invalid_number
        - carrier_rejected
        - internal_error
        - null
    FaxAccountStatus:
      type: string
      description: A suspended account may receive faxes but not send them.
      enum: [active, suspended]
    FaxResolution:
      type: string
      description: The two vertical resolutions the renderer produces.
      enum: [fine, standard]
    WebhookScopeType:
      type: string
      description: |
        What an endpoint hears about. Both are matched as a containment order, so a reseller-wide
        endpoint and a customer-scoped one both hear about the same fax.

        A third value, `fax_account`, was retired on 2026-09-15 and is now refused like any other
        unknown scope. Narrow below a customer with `filter: fax_account_id:<id>` instead — the
        fax body already carries that field, and one expression generalizes where a per-object
        scope did not.
      enum: [tenant, customer]
    WebhookEventType:
      type: string
      description: |
        Every event name a subscriber may ask for. Which of them a given endpoint may ask for also
        depends on its `scopeType` — see `events` on the endpoint resource.
      enum:
        - fax.received
        - fax.queued
        - fax.converting
        - fax.sending
        - fax.delivered
        - fax.partial
        - fax.failed
        - fax.cancelled
        - message.received
        - port_order.bill_extraction_settled
        - port_order.status_changed
        - pbx_change.confirmed
        - pbx_change.stalled
        - call-recording.available
        - call-transcript.available
        - webhook.heartbeat
    WebhookDeliveryStatus:
      type: string
      description: |
        Derived, not stored. `pending` is still on the retry ladder; `dead` ran out of rungs and is
        what an outage costs you.

        **There is no `delivered`.** A delivery that lands leaves no record here at all, so this
        collection holds only what you cannot reconstruct: what we still owe you, and what we gave
        up on. Sending `filter[status]=delivered` is refused with a 400.
      enum: [pending, dead]
    Tags:
      type: [object, 'null']
      description: |
        A flat map of short labels you own — the only filing system there is. Replaced wholesale on
        a write, never merged.
      additionalProperties: { type: [string, 'null'] }
    CoverPage:
      type: [object, 'null']
      description: |
        The cover page this fax was sent with, as it was supplied: a recipient name, a sender name,
        a subject and a message. A cover page IS a page — it is counted in `pages_total` and it
        bills.
      additionalProperties: true

    # -- faxes -------------------------------------------------------------------------------------
    FaxDocumentMetadata:
      type: object
      description: |
        What one of a fax's documents is, WITHOUT any way to reach it. No object key and no URL is
        ever published here.
      properties:
        kind:
          type: string
          description: '`source` is what you uploaded; `tiff` went on the wire; `pdf` is what a person reads; `thumb` is the preview.'
          enum: [source, tiff, pdf, thumb]
        ordinal: { type: integer }
        contentType: { type: [string, 'null'] }
        byteSize: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        pages: { type: [integer, 'null'] }
    FaxAttributes:
      type: object
      properties:
        direction:
          $ref: '#/components/schemas/FaxDirection'
        status:
          $ref: '#/components/schemas/FaxStatus'
        failureCode:
          $ref: '#/components/schemas/FaxFailureCode'
        from: { type: [string, 'null'], description: 'The sending number, in E.164.' }
        to: { type: [string, 'null'], description: 'The receiving number, in E.164.' }
        pagesTotal: { type: [integer, 'null'] }
        pagesTransferred: { type: [integer, 'null'] }
        partial:
          type: [boolean, 'null']
          description: |
            Are pages missing? Not folded into `status`, because an inbound fax that lost pages is
            still `received` while an outbound one is `partial`.
        attemptCount: { type: [integer, 'null'] }
        resolution: { type: [string, 'null'] }
        clientReference:
          type: [string, 'null']
          description: The reference your own system supplied at send time.
        coverPage:
          $ref: '#/components/schemas/CoverPage'
        read:
          type: boolean
          description: Yours to set. Setting it twice does not move when the fax was first read.
        archived:
          type: boolean
          description: Yours to set.
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FaxDocumentMetadata'
        createdAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    FaxRelationships:
      type: object
      properties:
        faxAccount:
          $ref: '#/components/schemas/RelationshipToOne'
        attempts:
          $ref: '#/components/schemas/RelationshipToMany'
    FaxResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [faxes] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAttributes'
        relationships:
          $ref: '#/components/schemas/FaxRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAttemptAttributes:
      type: object
      description: |
        One call placed for one fax. Two independent sources fill it: a busy or unanswered call
        produces no fax-protocol event, so `hangupCause` is the only classifier there — and the
        reverse happens too. Both sides are nullable because both are nullable in fact.
      properties:
        attemptNo: { type: [integer, 'null'] }
        transportProfile:
          type: [object, 'null']
          description: |
            The ladder rung this call used, whole — the transport plus whether ECM and V.17 were on.
            Null on an inbound call: nobody negotiated a rung for one.
          additionalProperties: true
        startedAt: { type: [string, 'null'], format: date-time }
        answeredAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        billableMs: { type: [integer, 'null'] }
        hangupCause: { type: [string, 'null'] }
        sipStatus: { type: [integer, 'null'] }
        faxSuccess: { type: [boolean, 'null'] }
        faxResultCode: { type: [integer, 'null'] }
        faxResultText: { type: [string, 'null'] }
        pagesTransferred: { type: [integer, 'null'] }
        pagesTotal: { type: [integer, 'null'] }
        transferRate: { type: [integer, 'null'] }
        ecmUsed: { type: [boolean, 'null'] }
        t38Used: { type: [boolean, 'null'] }
        imageResolution: { type: [string, 'null'] }
        badRows: { type: [integer, 'null'] }
        remoteStationId: { type: [string, 'null'] }
    FaxAttemptResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-attempts] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAttemptAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
    FaxDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxResource'
        included:
          type: array
          description: The side-loaded resources `include` asked for.
          items:
            $ref: '#/components/schemas/FaxAttemptResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/FaxAttemptResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [faxes] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              description: |
                Only `read`, `archived` and `tags` may CHANGE. Any other attribute may be echoed back
                with its current value, and is a 422 with a different one.
              properties:
                read: { type: boolean }
                archived: { type: boolean }
                tags:
                  $ref: '#/components/schemas/Tags'
              additionalProperties: true

    # -- POST /v1/faxes ----------------------------------------------------------------------------
    # Shared by both send bodies on purpose: the ceiling on each field is one validation rule in the
    # application, so two copies here would be two places for it to drift. A COMMENT, not description
    # text — it answers a spec author's question about the file, and an integrator reading the
    # rendered page is owed the fields, not our filing.
    CoverPageRequest:
      type: [object, 'null']
      description: |
        The four fields of the built-in cover page. A cover page IS a page — it is counted in
        `pages_total` and it bills. `null` is accepted the same as omitting the field or sending
        `{}` — none of the three add a cover page.
      properties:
        to_name: { type: string, maxLength: 128 }
        from_name: { type: string, maxLength: 128 }
        subject: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 2000 }
    SendFaxMultipartRequest:
      type: object
      description: |
        Upload the pages themselves. Up to five parts, sniffed on their bytes rather than on their
        names — PDF, TIFF, PNG and JPEG are what a fax can be made of.

        Send the `tags` and `cover_page` parts as plain JSON text, not as a `Blob`: append the JSON
        string directly as the part body, because a `Blob` part gains a filename and arrives as an
        upload instead of a field, which fails validation without saying why.
      required: [fax_account, to, documents]
      properties:
        fax_account:
          type: string
          format: uuid
          description: The account to send from.
        to:
          type: string
          description: The destination, in E.164. Nothing looser — this string is dialled.
          examples: ['+13025556789']
        from:
          type: string
          description: |
            The caller ID. Omit it to use the account's `defaultFromE164`; a number the account does
            not hold is a 403, whichever way it arrived.
          examples: ['+14075550100']
        resolution:
          $ref: '#/components/schemas/FaxResolution'
        cover_page:
          $ref: '#/components/schemas/CoverPageRequest'
        client_reference:
          type: string
          maxLength: 128
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          # The ceiling counts UPLOADS PLUS URLS, so it is the same five on both bodies
          # (FaxDocumentIntake::MAX_DOCUMENTS, applied to `count($uploads) + count($urls)`).
          maxItems: 5
          description: 'The file parts. Spell them `documents[]`; a single part named `documents` is accepted too.'
          items:
            type: string
            format: binary
    SendFaxUrlRequest:
      type: object
      description: |
        Point at the pages instead of uploading them. Every URL must be `https` on a public host, and
        uploads and URLs may not be mixed in one request.
      required: [fax_account, to, documents]
      properties:
        fax_account: { type: string, format: uuid }
        to: { type: string, examples: ['+13025556789'] }
        from: { type: string, examples: ['+14075550100'] }
        resolution:
          $ref: '#/components/schemas/FaxResolution'
        cover_page:
          $ref: '#/components/schemas/CoverPageRequest'
        client_reference: { type: string, maxLength: 128 }
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
    SendFaxAccepted:
      type: object
      description: |
        A flat acknowledgement, not a JSON:API document. Read the whole fax at
        `GET /v1/faxes/{fax}`.
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/FaxStatus'
            direction:
              $ref: '#/components/schemas/FaxDirection'
            from: { type: [string, 'null'] }
            to: { type: [string, 'null'] }
            client_reference: { type: [string, 'null'] }
            created_at: { type: [string, 'null'], format: date-time }
    CancelFaxResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/FaxStatus'
    MediaLink:
      type: object
      description: |
        A capability that expires, plus the facts about what is behind it. Not a JSON:API resource:
        there is no stored member this URI could be a collection of.
      required: [url, expires_at, byte_size, sha256]
      properties:
        url:
          type: string
          format: uri
          description: |
            A time-limited download URL on your own API host. Fetch it with a plain `GET` and no
            `Authorization` header — the signature it carries is the authorization. Opaque: the
            signature covers the whole address, so any edit invalidates it. Short-lived — do not
            cache it past `expires_at` or share it.
        expires_at:
          type: string
          format: date-time
        byte_size:
          type: integer
        sha256:
          type: string
          description: The digest of the bytes behind `url`, so you can verify what you downloaded.

    # -- fax-accounts ------------------------------------------------------------------------------
    FaxAccountAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        headerText:
          type: [string, 'null']
          maxLength: 64
          description: |
            The header line printed across the top of every page. Superseded by `headerTemplate`,
            and kept because it still applies wherever no template is set — so an integrator that
            has never sent one keeps the header it configured.
        headerTemplate:
          type: [string, 'null']
          maxLength: 120
          description: |
            The header stamped across the top of every page you send, with `{account_name}`,
            `{from}`, `{to}`, `{date}` and `{time}` filled in per fax. It is the ONLY header a sent
            page carries — the sending machine's own header line is switched off, because its format
            is fixed and cannot be laid out.

            Leave it null and you get `{date} {time} {account_name} {from}`, which is the order a fax
            header has had for decades. `{account_name}` is your `headerText` if you have set one,
            and your account's name otherwise, so a line always prints.

            **`{date}` and `{time}` are when the pages were PREPARED, not when they were sent.** On a
            first attempt those are seconds apart; if the fax is retried hours later the page still
            shows the first time.

            Plain ASCII only, up to 120 characters: a character a fax page cannot print is refused
            here rather than dropped from every page without telling you.
        headerTimezone:
          type: [string, 'null']
          maxLength: 64
          description: |
            An IANA timezone name, like `America/New_York`. It is the zone `{date}` and `{time}` are
            printed in, so a recipient reads your local time rather than ours. Null uses ours.
          example: America/New_York
        defaultFromE164:
          type: [string, 'null']
          description: |
            The caller ID a send falls back to. May be set before the number is routed — whether the
            account holds it is asked at the send.
        retentionDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: |
            How long this account's fax pages are kept, in days. **Null means they are never deleted
            by age.**
        retentionPages:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000
          description: |
            How many pages this account keeps, newest first; everything past the limit is deleted.
            **Null means there is no limit.**
        status:
          $ref: '#/components/schemas/FaxAccountStatus'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    FaxAccountRelationships:
      type: object
      properties:
        customer:
          type: object
          required: [data]
          description: |
            The customer this account belongs to — an identifier, and nothing else. It does NOT
            follow the usual `RelationshipToOne` shape, and the difference is deliberate: this API
            serves no `customer` sub-resource of a fax account, so the `self` and `related` URLs
            that shape carries would both answer 404, and a link that 404s is worse than no link.
            In exchange `data` is ALWAYS present rather than only on a resolved read — the id is
            how you learn which customer an account belongs to. An account is created for one
            customer and never moves.
          properties:
            data:
              $ref: '#/components/schemas/ResourceIdentifier'
        numbers:
          $ref: '#/components/schemas/RelationshipToMany'
    FaxAccountResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-accounts] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAccountAttributes'
        relationships:
          $ref: '#/components/schemas/FaxAccountRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAccountDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxAccountResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxAccountResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountWritableAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        headerText: { type: [string, 'null'], maxLength: 64 }
        headerTemplate: { type: [string, 'null'], maxLength: 120, pattern: '^[\x20-\x7E]*$' }
        headerTimezone: { type: [string, 'null'], maxLength: 64, example: America/New_York }
        defaultFromE164: { type: [string, 'null'] }
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 36500 }
        retentionPages: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        status:
          $ref: '#/components/schemas/FaxAccountStatus'
    # A FLAT OBJECT, NOT AN `allOf` OVER THE WRITABLE SCHEMA: a TypedDict cannot re-require an
    # inherited key; both generators want a flat object here.
    FaxAccountCreateAttributes:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        headerText: { type: [string, 'null'], maxLength: 64 }
        headerTemplate: { type: [string, 'null'], maxLength: 120, pattern: '^[\x20-\x7E]*$' }
        headerTimezone: { type: [string, 'null'], maxLength: 64, example: America/New_York }
        defaultFromE164: { type: [string, 'null'] }
        retentionDays: { type: [integer, 'null'], minimum: 1, maximum: 36500 }
        retentionPages: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        status:
          $ref: '#/components/schemas/FaxAccountStatus'
    FaxAccountCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { type: string, enum: [fax-accounts] }
            attributes:
              $ref: '#/components/schemas/FaxAccountCreateAttributes'
            relationships:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    FaxAccountUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [fax-accounts] }
            id: { type: string, format: uuid }
            attributes:
              $ref: '#/components/schemas/FaxAccountWritableAttributes'

    # -- fax-account-users -------------------------------------------------------------------------
    FaxAccountUserAttributes:
      type: object
      properties:
        userEmail:
          type: [string, 'null']
          description: |
            The grantee's email — a grant list is read to answer "who can see this?", and a page of
            ids answers nothing.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    FaxAccountUserResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-account-users] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAccountUserAttributes'
        relationships:
          type: object
          description: |
            The two ends of the grant. NEITHER follows the usual `RelationshipToOne` shape, and the
            difference is deliberate: this API serves no sub-resource of a grant, so the `self` and
            `related` URLs that shape carries would all answer 404, and a link that 404s is worse
            than no link. In exchange each `data` is ALWAYS present rather than only on a resolved
            read — a grant IS its pair of ids, so a document carrying neither would carry nothing.
          properties:
            faxAccount:
              type: object
              required: [data]
              description: The fax account whose content this grant opens.
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'
            user:
              type: object
              required: [data]
              description: The person it opens it to. Their email is in `attributes.userEmail`.
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAccountUserDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxAccountUserResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountUserCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxAccountUserResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountUserCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, relationships]
          properties:
            type: { type: string, enum: [fax-account-users] }
            relationships:
              type: object
              required: [faxAccount, user]
              properties:
                faxAccount:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
                user:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'

    # -- phone-numbers (the resource is read-only; the verbs take flat bodies) ---------------------
    PhoneNumberResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [phone-numbers] }
        id: { type: string, format: uuid }
        attributes:
          type: object
          properties:
            e164: { type: [string, 'null'] }
            status:
              type: [string, 'null']
              enum: [pending, active, failed, releasing, null]
            country: { type: [string, 'null'] }
            activatedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: [string, 'null'], format: date-time }
            messaging:
              $ref: '#/components/schemas/PhoneNumberMessaging'
            voice:
              $ref: '#/components/schemas/PhoneNumberVoice'
        relationships:
          type: object
          properties:
            customer:
              $ref: '#/components/schemas/RelationshipToOne'
            routingTarget:
              $ref: '#/components/schemas/RelationshipToOne'
            pbxNumber:
              $ref: '#/components/schemas/RelationshipToOne'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    PhoneNumberMessaging:
      type: object
      description: |
        Whether this number can send and receive text messages today, and what it was given
        (console ADR-0094).

        **`enabled` is the whole of the question**; the other three are null whenever it is false,
        so a client reads one boolean and stops. The object is always present — a number with no
        messaging reports `enabled: false` rather than omitting it, so nothing has to branch on
        whether the key is there.

        **This is current STATE, not a request.** Turning messaging on and off is
        `POST /v1/messaging-enablements` and `DELETE /v1/phone-numbers/{phoneNumber}/messaging`, and
        the record of every attempt is `GET /v1/messaging-enablements`.
      required: [enabled, mmsEnabled, messageClass, enabledAt]
      properties:
        enabled:
          type: boolean
          description: Whether this number can send and receive text messages.
        mmsEnabled:
          type: [boolean, 'null']
          description: Whether picture messaging is on too. Null when messaging is off.
        messageClass:
          type: [string, 'null']
          enum: [A2P, P2P, null]
          description: |
            What the number is registered as. Every number we enable is `A2P` — application-to-person,
            the class business messaging is sent under. Null when messaging is off.
        enabledAt:
          type: [string, 'null']
          format: date-time
          description: When messaging started working on this number. Null when messaging is off.
    PhoneNumberVoice:
      type: object
      description: |
        Whether this platform supplies the number's calls (console ADR-0094).

        **`false` does not mean the number is dead.** It means somebody else carries its calls: a
        number brought in with `POST /v1/hosted-messaging-orders` is live and textable, and its
        voice service is with the provider it was already with. Emergency service is not available
        on such a number, and it has no routing target here.

        The object is always present, so nothing has to branch on whether the key is there. It is an
        object rather than a bare boolean so that a further service can arrive beside `messaging` and
        `voice` without either of them changing shape.

        **Which carrier supplies the calls is not published**, here or anywhere on this API.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Whether we carry this number's calls.
    PhoneNumberCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PhoneNumberAssignRequest:
      type: object
      description: |
        The body of an assignment — FLAT JSON rather than a JSON:API document, because the verb moves
        a number rather than patching a resource. The field is spelled the way it is sent,
        `snake_case`, and a refusal's `source.pointer` names it the same way.
      required: [customer_id]
      properties:
        customer_id:
          type: string
          format: uuid
          description: |
            The customer to give the number to. One of yours: any other id answers **404**, the same
            answer an id that names nothing gets.
    PhoneNumberRouteRequest:
      type: object
      description: |
        The body of a route — FLAT JSON, like the assignment above, and every member is optional: no
        body at all points the number at its customer's phone system. A `data` member is refused with
        a **400** rather than half-obeyed.
      properties:
        target_type:
          type: string
          enum: [pbx, fax, sip_trunk]
          default: pbx
          description: Which KIND of destination the number points at. Absent means `pbx`.
        fax_account:
          type: string
          format: uuid
          description: |
            The fax account to point the number at. **Required when `target_type` is `fax`, and
            refused with any other kind** — a customer may hold several accounts, so a fax route has
            to be told which one.
        sip_trunk:
          type: string
          format: uuid
          description: |
            The SIP trunk to point the number at. **Required when `target_type` is `sip_trunk`, and
            refused with any other kind.**


    # -- webhook-endpoints -------------------------------------------------------------------------
    WebhookEndpointAttributes:
      type: object
      properties:
        scopeType:
          $ref: '#/components/schemas/WebhookScopeType'
        scopeId:
          type: [string, 'null']
          format: uuid
          description: The id of the tenant or customer this endpoint hears about.
        url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        events:
          type: [array, 'null']
          maxItems: 64
          description: |
            The event types this endpoint asked for. **A write names at least one** — `null` and
            `[]` are refused on create and on update. Endpoints registered before 2026-09-14 that
            named none were given the catalog as it stood that day.

            **Every name must be one this endpoint's `scopeType` can carry**, or the write is a 422
            on that member. An event reaches the scopes of the things that CONTAIN it: a fax has a
            customer and a reseller; `message.received` has a customer and a reseller; a port order
            has only a reseller. So `port_order.*` on a customer-scoped endpoint is refused — it
            would be a live subscription that can never fire.

            No `minItems` here, unlike the create body, and the difference is deliberate: an empty
            list still READS as "every event in scope" wherever an event is matched, so that a row
            this rule never reached keeps receiving rather than going silently dark. This schema
            describes what may come back, and the request bodies describe what you may send.
          items:
            $ref: '#/components/schemas/WebhookEventType'
        filter:
          type: [string, 'null']
          maxLength: 1000
          description: |
            An expression that narrows delivery BELOW this endpoint's scope, matched against the
            body's `data` object. **Null means no narrowing** — every event the scope and `events`
            already match is delivered, which is how an endpoint behaves when you omit this.

            A term is `field:value`, where `field` is a dot path into `data` (`a.b.c`). A path the
            body does not carry, or one whose value is `null`, makes the term false.

            | Form | Meaning |
            |---|---|
            | `field:value` | exact, case-sensitive |
            | `field:abc*` | the value starts with `abc` |
            | `field:*` | the body carries this path and it is not null |
            | `field:<v` `field:<=v` `field:>v` `field:>=v` | ordered comparison |

            A comparison is numeric only when the body's value is a JSON **number** and the literal
            parses as a number; otherwise it compares the value's string form byte by byte. So a
            field carrying `"10"` as a string is NOT greater than `2`. A boolean compares against the
            tokens `true` and `false`. A value that is neither a scalar nor null (an array, an
            object) matches `field:*` and nothing else.

            Values are bare tokens, or double-quoted strings in which `\"` is a quote and `\\` is a
            backslash — quote anything carrying a space or a parenthesis. Inside quotes a `*` is a
            literal `*`.

            Terms combine with `AND`, `OR` and parentheses, all case-insensitive. **`OR` binds more
            tightly than `AND`**, so `a:1 OR b:2 AND c:3` means `(a:1 OR b:2) AND c:3` — parenthesise
            when you want the other reading. Two adjacent terms with no keyword are an `AND`.
            Negation is `NOT x` or a leading `-`, which mean the same thing.

            A field name is made of letters, digits, `_`, `.` and `-`. **A `-` is part of the name
            everywhere except as the first character of a term**, where it is the negation above —
            so `fax-account:A` names a field, `a.b-c:1` names one inside a path, and `-x-y:1` is
            "not `x-y`". A term that starts with `-` therefore always negates: `--x:1` is `x:1`
            negated twice, not a field called `-x`.

            The SYNTAX is checked when you register or edit the endpoint, and a 422 names the
            character it could not read. **The FIELD NAMES are not checked against anything.** A
            filter naming a field the body does not carry is valid and matches nothing, so the
            endpoint receives silence — check your field names against the event's documented body.
          examples:
            - fax_account_id:019a3c4d5e6f70819293a4b5c6d7e8f9
            - status:failed OR status:partial
            - -direction:outbound
        active: { type: [boolean, 'null'] }
        secret:
          type: [string, 'null']
          description: |
            The signing secret, `whsec_`-prefixed. **Non-null only in the response to the create or
            the rotate that minted it** — every other read is `null`, because the platform holds no
            readable copy.
        secretPreviousExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the PREVIOUS secret stops signing. Null outside a rotation's grace window; the
            previous secret itself is never published.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    WebhookEndpointResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [webhook-endpoints] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/WebhookEndpointAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    WebhookEndpointDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookEndpointCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookEndpointCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [webhook-endpoints] }
            attributes:
              type: object
              required: [url, scopeType, scopeId, events]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: '`https` only, on a public host.'
                scopeType:
                  $ref: '#/components/schemas/WebhookScopeType'
                scopeId: { type: string, format: uuid }
                events:
                  type: array
                  minItems: 1
                  maxItems: 64
                  description: |
                    Name at least one event type. An endpoint that named none would receive every
                    event type this platform ever adds, so `null` and `[]` are each a 422. Each name
                    must also be one the `scopeType` you chose can carry — see `events` on the
                    endpoint resource.
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
                filter:
                  type: [string, 'null']
                  maxLength: 1000
                  description: |
                    Narrows delivery below the scope. Omit it, or send null, to receive everything
                    the scope and `events` match. Grammar and the field-name caveat: see `filter` on
                    the endpoint resource.
                  examples:
                    - status:failed OR status:partial
                active: { type: boolean }
    WebhookEndpointUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [webhook-endpoints] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              description: |
                A PATCH is sparse: send only the members you are changing. An omitted member keeps
                its stored value.
              # THE MEMBERS ARE ENUMERATED AND `additionalProperties` IS UNSTATED, which is the same
              # shape `WebhookEndpointCreateRequest` above already has. It replaced
              # `additionalProperties: true`, whose only purpose was to let a caller echo `scopeType`
              # and `scopeId` back — those two are members now, so the escape bought nothing and cost
              # a `[key: string]: unknown` index signature in every generated client, under which a
              # misspelled member (`event` for `events`) is not a compile error.
              #
              # NOT `additionalProperties: false`, and the reason is what the server accepts rather
              # than what it refuses. An attribute this resource does not DECLARE is refused — 400,
              # by the package's spec layer before any rule runs (`The field <name> is not a
              # supported attribute`) — so `false` would be honest about a typo. But the declared set
              # is wider than the five below: `WebhookEndpointSchema` also declares `secret`,
              # `secretPreviousExpiresAt`, `createdAt` and `updatedAt`, and
              # `WebhookEndpointRequest::updateRules()` gives each of those a same-value-or-422 rule
              # rather than `prohibited`. So a client that reads the resource and PATCHes the whole
              # attributes object back, unchanged, is ACCEPTED — and `false` here would mark that
              # valid document invalid. Publishing the four as settable members to buy the stricter
              # keyword would be the worse trade: they are read-only, and a request schema is not
              # where a client should learn otherwise.
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: array
                  minItems: 1
                  maxItems: 64
                  description: |
                    Replaced wholesale by what you send, and it must still name at least one event
                    type — `null` and `[]` are each a 422 here too. The rule is on this arm because
                    the field means the same thing on each: an endpoint that could be emptied by a
                    PATCH would reach the every-event state a create refuses, one request later.
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
                filter:
                  type: [string, 'null']
                  maxLength: 1000
                  description: |
                    Replaced wholesale by what you send. **Send null to clear it**, after which the
                    endpoint hears everything its scope and `events` match again.
                active: { type: boolean }
                scopeType:
                  $ref: '#/components/schemas/WebhookScopeType'
                  description: May be sent back unchanged; a different value is a 422 — a scope cannot change.
                scopeId:
                  type: string
                  format: uuid
                  description: May be sent back unchanged; a different value is a 422 — a scope cannot change.

    # -- webhook-deliveries ------------------------------------------------------------------------
    WebhookDeliveryAttributes:
      type: object
      properties:
        eventId:
          type: [string, 'null']
          description: The dedupe key. A retried delivery of the same event carries the same id.
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        payloadSha256:
          type: [string, 'null']
          description: |
            The digest of the exact bytes we signed. The body itself is never published here.
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attemptNo:
          type: [integer, 'null']
          description: How many POSTs have been made, not how many failed.
        statusCode:
          type: [integer, 'null']
          description: What your server answered. Null when we never reached it.
        durationMs: { type: [integer, 'null'] }
        error:
          type: [string, 'null']
          description: Why we could not reach you, when that is the reason.
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        deliveredAt:
          type: [string, 'null']
          format: date-time
          description: |
            Always `null`. A delivery that lands leaves no row at all, so nothing sets this any
            more, and the rows that carried a value were removed when the old delivery engine was.
            The field is kept so a client generated against an older spec still parses. Do not treat
            a non-null `deliveredAt` as a status — `status` is `pending` or `dead` and nothing else.
        deadAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    WebhookDeliveryResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [webhook-deliveries] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/WebhookDeliveryAttributes'
        relationships:
          type: object
          properties:
            endpoint:
              $ref: '#/components/schemas/RelationshipToOne'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    WebhookDeliveryDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookDeliveryResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookDeliveryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'

    # -- The outbound webhook body -----------------------------------------------------------------
    FaxEventData:
      type: object
      description: |
        A SNAPSHOT of the fax, frozen when the transition happened — not a fresh read. A retry six
        hours later carries the same values, so a `fax.sending` event never says `delivered`.

        **No document content, no object keys and no URLs.** A webhook body travels to a third party
        over the public internet and is stored in their logs. Fetch the pages with your own
        credential at `GET /v1/faxes/{fax}/media`, which is also what records who looked.
      properties:
        id: { type: string, format: uuid }
        fax_account_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        customer_id: { type: [string, 'null'], format: uuid }
        direction:
          $ref: '#/components/schemas/FaxDirection'
        status:
          $ref: '#/components/schemas/FaxStatus'
        failure_code:
          $ref: '#/components/schemas/FaxFailureCode'
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        pages_total: { type: [integer, 'null'] }
        pages_transferred: { type: [integer, 'null'] }
        partial: { type: [boolean, 'null'] }
        attempt_count: { type: [integer, 'null'] }
        client_reference: { type: [string, 'null'] }
        tags:
          $ref: '#/components/schemas/Tags'
        created_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    FaxReceivedEventData:
      allOf:
        - $ref: '#/components/schemas/FaxEventData'
        - type: object
          properties:
            render_failed:
              type: boolean
              description: |
                Always present, never conditional. `true` means the fax is real and its metadata is
                complete, and only the rendered document is missing.
    WebhookEventEnvelope:
      type: object
      description: |
        The envelope every outbound webhook body shares. `data` is added by the event schema that
        uses it — see `FaxEvent`.

        ## Verify the signature before you trust it

        Every delivery carries a `Ringivo-Signature` header:

        ```
        Ringivo-Signature: t=1755331200,v1=9f86d0…,v1=2c26b4…
        ```

        `t` is the Unix second the delivery was signed. Each `v1` is
        `HMAC-SHA256(secret, "<t>.<raw body>")` in lowercase hex. To verify: recompute the MAC over
        `"<t>.<raw body>"` with your `whsec_` secret, compare it to each `v1` in **constant time**,
        and reject anything whose `t` is more than **300 seconds** from your own clock. Both halves
        must pass — a good MAC with an old `t` is a replay, and a fresh `t` with no matching MAC is
        a forgery.

        **Sign the RAW BODY, never a re-encoding.** Parsing the JSON and re-encoding it before
        verifying WILL fail, and correctly so: key order, unicode escaping and number formatting are
        free choices no two encoders make identically. This is the commonest mistake with
        signatures of this shape.

        **A second `v1` appears only during a rotation's 24-hour grace window**, signed with the
        previous secret, newest first — so a receiver that checks only the first one validates
        against the secret we want it to hold.

        ## Delivery is at-least-once

        Dedupe on `event_id`: a retried delivery of the same event carries the same id, and two
        genuine transitions never share one. A failed delivery is retried after **at least 10s, 1m,
        5m, 30m, 2h and 6h** — seven POSTs in all, the last about eight and three-quarter hours after
        the event — and then dead-lettered. Ask
        `GET /v1/webhook-deliveries?filter[status]=dead` for what you missed.

        **Those intervals are minimum waits, not a schedule.** A retry goes out on the first sweep at
        or after its due time, so each number is the earliest that attempt can arrive and never a
        clock to synchronise against.

        `event_id` is repeated in a `Ringivo-Event-Id` header, and `type` in a `Ringivo-Event-Type`
        header, so a proxy or a queue in front of your handler can dedupe and route before anything
        parses the body. They are a convenience, never the authority: the signature covers the body,
        not the headers.

        Answer any 2XX to accept. Redirects are never followed. We wait ten seconds; if your handler
        needs longer, answer 202 and do the work afterwards.

        ## Order is not guaranteed

        Events may arrive out of order, and nothing anywhere promises otherwise. A retry puts one
        event back on a ladder while later ones keep going, so a `fax.sending` that failed once can
        land after the `fax.delivered` that followed it. Dedupe on `event_id`, order by
        `occurred_at`, or refetch the resource and trust what it answers.
      required: [event_id, type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: The dedupe key.
        type:
          $ref: '#/components/schemas/WebhookEventType'
        occurred_at:
          type: string
          format: date-time
          description: |
            When the transition happened — captured at the event, not at delivery, so a retry does
            not claim the fax was delivered when we finally reached you.
    # The envelope and the payload are composed here rather than the envelope carrying a `data` of
    # its own that each event overrides. Two `properties: {data: …}` in one `allOf` are BOTH applied
    # — the narrower one does not replace the wider one — so `fax.received`'s extra member reads as
    # an unevaluated property of the base payload and lint reds on the example. Probed 2026-08-18.
    FaxEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxEventData'
    FaxReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxReceivedEventData'
    MessageReceivedEventData:
      type: object
      description: |
        A SNAPSHOT of the message as it arrived. An inbound message is a receipt and barely changes,
        but the rule is the one every event on this channel follows: a retry six hours later carries
        the values the event was built with.

        **No media bytes and no URL.** The parts are described and nothing more — we do not retain
        the file, so there is nothing here to fetch it with either.
      properties:
        id:
          type: string
          format: uuid
          description: The message's id in `GET /v1/inbound-messages`.
        tenant_id: { type: string, format: uuid }
        customer_id:
          type: [string, 'null']
          format: uuid
          description: |
            The customer who holds the number. Null while the number sits unassigned in your pool.
        kind:
          $ref: '#/components/schemas/InboundMessageKind'
        from: { type: string, description: 'The sending number, in E.164.', example: '+13025556789' }
        to: { type: string, description: 'Your number, in E.164.', example: '+14075550100' }
        body:
          type: [string, 'null']
          description: The text. Null for a picture message with no caption.
        media:
          type: array
          description: The described parts of a picture message. An empty list for a text message.
          items:
            $ref: '#/components/schemas/InboundMessageMediaPart'
        received_at:
          type: string
          format: date-time
          description: When the message was sent. The envelope's `occurred_at` is this same instant.
    PortOrderStatusChangedEventData:
      type: object
      description: |
        Both ends of one move, frozen when it happened. Nothing about the order's contents is here —
        read the order itself for those.
      properties:
        port_order_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        from:
          allOf:
            - $ref: '#/components/schemas/PortOrderStatus'
          description: Where the order stood before the move.
        to:
          allOf:
            - $ref: '#/components/schemas/PortOrderStatus'
          description: Where it stands now.
    PortOrderBillExtractionSettledEventData:
      type: object
      description: |
        How a bill reading ended, and nothing the bill said. Read the order for the values.
      properties:
        port_order_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        status:
          allOf:
            - $ref: '#/components/schemas/PortOrderBillExtractionStatus'
          description: |
            The settled state, frozen at the event: `done`, `skipped` or `failed`. Never `pending` —
            that is the start of the wait this event ends.
    CallRecordingAvailableEventData:
      type: object
      description: |
        A SNAPSHOT of the recording as we hold it, frozen when the event was built. The rule every
        event on this channel follows — a retry six hours later carries the values it was built with
        — and here it does a second job: a recording that has since been superseded sends its own
        event rather than rewriting this one.

        **No object key and no URL.** Ask `GET /v1/pbx/call-records/{id}/recordings` for a link, which
        is where authorization runs.
      properties:
        id:
          type: string
          format: uuid
          description: |
            The recording's id, and the `{id}` of the media request. It is derived from the switch's
            own `(call_id, ccc_id)`, so it is the same id in every region and never changes — a
            supersede reuses it.
        customer_id:
          type: [string, 'null']
          format: uuid
          description: |
            The customer whose recording this is. Null when the recorded domain resolves to none of
            your customers; only your tenant-scoped endpoints hear about that one.
        call_id:
          type: string
          description: The switch's own call identifier. Two captures of one call share it.
          example: 20260912101500000002-00112233445566778899aabbccddeeff
        ccc_id:
          type: string
          description: Which capture of that call this recording is.
          example: 00b1
        duration_seconds:
          type: [integer, 'null']
          description: |
            How long the recorded audio runs. A supersede changes this. NULL when the switch did not
            report a duration for the capture — the recording is still ours to serve, and
            `byte_size` still describes the bytes.
        byte_size:
          type: integer
          description: The size of the audio we hold. A supersede changes this.
        sha256:
          type: string
          description: |
            The SHA-256 of the audio, so you can check a download against what we recorded. A
            supersede changes this — see the operation description before treating a mismatch as
            corruption.
        superseded:
          type: boolean
          description: |
            False on the first event for a recording, true when a longer capture has replaced the
            audio behind the same `id`.
        recorded_at:
          type: [string, 'null']
          format: date-time
          description: When the recording started. Null when the switch did not report it.
        ended_at:
          type: [string, 'null']
          format: date-time
          description: When it stopped. Null when the switch did not report it.
    CallRecordingAvailableEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CallRecordingAvailableEventData'
    CallTranscriptAvailableEventData:
      type: object
      description: |
        WHICH call was transcribed — and deliberately not a word of what was said. The read endpoint
        that serves the text is not published yet; it arrives in a later release.
      properties:
        id:
          type: string
          format: uuid
          description: |
            The transcript's id. It is the recording's id — a transcript is keyed by the recording it
            is of — so it is the same id in every region and never changes.
        recording_id:
          type: string
          format: uuid
          description: |
            The recording this is a transcript of. Today it always equals `id`; it is named
            separately so that a future transcript with a key of its own does not change the meaning
            of a field you are already reading.
        customer_id:
          type: [string, 'null']
          format: uuid
          description: |
            The customer whose call this is — the same one `call-recording.available` carried. Null
            when the recorded domain resolves to none of your customers; only your tenant-scoped
            endpoints hear about that one.
        call_id:
          type: string
          description: The switch's own call identifier. Two captures of one call share it.
          example: 20260912101500000002-00112233445566778899aabbccddeeff
        ccc_id:
          type: string
          description: Which capture of that call was transcribed.
          example: 00b1
        language:
          type: string
          description: |
            The language of the transcript, as the transcription reported it, or as we asked for it
            when it reported none.
          example: en-US
        duration_seconds:
          type: [integer, 'null']
          description: |
            How long the transcribed audio runs, rounded up to whole seconds. Null when the
            transcription reported no duration.
    WebhookHeartbeatEventData:
      type: object
      description: |
        Which region beat, when, and which beat it was. There is nothing of yours in this body.
      properties:
        region:
          type: string
          description: |
            The region that emitted this beat. Each region counts its own `sequence`, so read the
            two together.
          example: usw1
        emitted_at:
          type: string
          format: date-time
          description: |
            When we published the beat — not when we reached you. A beat we could not deliver
            promptly is discarded rather than sent late, so this is always recent.
        sequence:
          type: integer
          description: |
            Counts up by one per beat within `region`, and never resets. A gap is an outage window;
            a repeat or a rewind is a fault on our side.
          example: 40213
        nonce:
          type: string
          description: |
            Unique to this beat and to you. It is what makes two beats two events — you do not need
            to read it, and `event_id` is what you dedupe on.
          example: 0199c1f0-1111-7000-8000-00000000000a
        origin:
          type: string
          enum: [scheduler, api]
          description: |
            What produced the beat. `scheduler` is our five-minute timer, which is the only thing
            that produces one today; `api` is reserved for a beat requested on demand.
          example: scheduler
    WebhookHeartbeatEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WebhookHeartbeatEventData'
    CallTranscriptAvailableEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/CallTranscriptAvailableEventData'
    MessageReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/MessageReceivedEventData'
    PortOrderStatusChangedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PortOrderStatusChangedEventData'
    PortOrderBillExtractionSettledEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PortOrderBillExtractionSettledEventData'
    PbxChangeEventData:
      type: object
      description: |
        Which change, against which row, and WHICH FIELDS it touched — never the values. A change
        intent's requested values are your own subscriber's details (caller IDs, e-mail addresses),
        and this body crosses the public internet, so the event is a nudge and the values stay
        behind your credential. Read the object back when you want them.

        One shape for both `pbx_change.confirmed` and `pbx_change.stalled`: the difference is the
        `type`, not the data.
      properties:
        intent_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        target_id:
          type: string
          format: uuid
          description: |
            The deterministic id of the phone-system row the change was aimed at. Stable, and the
            same id the platform's own read models use for that row.
        table:
          type: string
          description: |
            The phone-system table the row lives in, e.g. `sipbxdomain_subscriber_config`.
          example: sipbxdomain_subscriber_config
        fields:
          type: array
          description: The column names the change touched. Names only.
          items: { type: string }
          example: [firstname, lastname]
        submitted_at:
          type: string
          format: date-time
          description: When the change was accepted by the phone system, which is when the wait began.
    PbxChangeConfirmedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PbxChangeEventData'
    PbxChangeStalledEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/PbxChangeEventData'

    # -- Number lookups (one composite dip, nothing stored) ---------------------------------------
    #
    # No `type`/`id` and no `links` anywhere below, deliberately: a lookup is a computed answer with
    # no stored member behind it, so there is nothing for a `self` link to address. Giving it a
    # synthetic id would publish a URL a generated client is entitled to follow and nothing can
    # answer.
    NumberLookupRequest:
      type: object
      required: [number]
      properties:
        number:
          type: string
          maxLength: 32
          description: |
            The number to look up. 10 digits, or 11 beginning with `1`; punctuation and spaces are
            ignored, so `(650) 253-0000` and `+16502530000` are the same request.
      # There is no tenant field, and there is no way to add one: a lookup is always billed to the
      # account the credential belongs to.
      additionalProperties: false
    NumberLookupDipStatus:
      type: string
      description: |
        What one component did. `no_data` and `failed` both carry `data: null` and mean different
        things — see the operation description.
      enum: [answered, no_data, failed]
    DialedNumberGeography:
      type: object
      description: |
        Where the number you asked about is nominally from, from our own copy of LERG. **Not the
        LRN's** rate center, which is a different fact and lives under `components.lrn`.
      required: [rateCenter, state]
      properties:
        rateCenter:
          type: [string, 'null']
          description: Null for a toll-free number, which has no rate center. Absent, not missing.
        state:
          type: [string, 'null']
          description: Two-letter state or province code. Null for a toll-free number.
    LrnFacts:
      type: object
      description: The porting facts — who the number routes to now, and who owns its block.
      required:
        [lrn, spid, ocn, lata, lec, lineType, rateCenter, state, jurisdiction, local, portedAt]
      properties:
        lrn:
          type: string
          description: The location routing number, 11 digits.
        spid:
          type: [string, 'null']
          maxLength: 4
          description: |
            Who the number is ported to **now** — this is the one porting cares about. A string,
            never a number: values like `506J` exist.
        ocn:
          type: [string, 'null']
          maxLength: 4
          description: Who owns the number block. Often differs from `spid`. A string, never a number.
        lata:
          type: [string, 'null']
        lec:
          type: [string, 'null']
          description: The carrier's full name, as the source spells it.
        lineType:
          type: [string, 'null']
          description: |
            `CLEC`, `WIRELESS`, `ILEC`. This is what the **network** says. It is not what a losing
            carrier's bill says, and it must not be used to correct a port order's number type.
        rateCenter:
          type: [string, 'null']
          description: The **LRN's** rate center — not the dialed number's. The two often differ.
        state:
          type: [string, 'null']
          description: The **LRN's** state or province code.
        jurisdiction:
          type: [string, 'null']
          description: |
            A string, not a boolean — commonly the literal `INDETERMINATE`, which is not false.
        local:
          type: [string, 'null']
          description: A string, not a boolean, for the same reason as `jurisdiction`.
        portedAt:
          type: [string, 'null']
          format: date-time
          description: When the number last ported. Null if it never has.
    CallerNameFacts:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 15
          description: |
            The name the number presents, as the carrier spells it — uppercase, up to 15 characters.
    MessagingFacts:
      type: object
      description: Whether the number can carry text messages, and who carries them.
      required: [enabled, provider, country, countryCode]
      properties:
        enabled:
          type: boolean
          description: |
            Whether the number is enabled for messaging. **`false` means it cannot receive messages**
            — it never means "we do not know", which arrives as `status: no_data` with this whole
            object null.
        provider:
          type: [string, 'null']
          description: The messaging carrier's name.
        country:
          type: [string, 'null']
        countryCode:
          type: [string, 'null']
    NumberLookupLrnComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/LrnFacts'
            - type: 'null'
    NumberLookupCallerNameComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/CallerNameFacts'
            - type: 'null'
    NumberLookupMessagingComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/MessagingFacts'
            - type: 'null'
    NumberLookupComponents:
      type: object
      description: |
        The three paid components. Each reports its own outcome and they fail independently — a
        lookup with two answers and one failure is normal, and is billed in full.
      required: [lrn, callerName, messaging]
      properties:
        lrn:
          $ref: '#/components/schemas/NumberLookupLrnComponent'
        callerName:
          $ref: '#/components/schemas/NumberLookupCallerNameComponent'
        messaging:
          $ref: '#/components/schemas/NumberLookupMessagingComponent'
    NumberLookup:
      type: object
      required: [number, lookedUpAt, charged, dialedNumber, components]
      properties:
        number:
          type: string
          description: The number that was looked up, normalized to E.164.
        lookedUpAt:
          type: string
          format: date-time
          description: |
            When the components ran — so you can tell "we asked and learned nothing" from "we never
            asked".
        charged:
          type: boolean
          description: |
            Whether this lookup was billed. True when any component answered; false only when every
            one of them failed.
        dialedNumber:
          $ref: '#/components/schemas/DialedNumberGeography'
        components:
          $ref: '#/components/schemas/NumberLookupComponents'
    NumberLookupResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NumberLookup'
    # -- ztp-devices -------------------------------------------------------------------------------
    ProvisioningState:
      type: string
      enum: [pending, provisioning, active, failed]
      description: |
        Where a queued write against somebody else's system stands. `pending` — we have recorded what
        you asked for and have not called yet; `provisioning` — a call is in flight; `active` — the
        far end matches; `failed` — we gave up, and the row says why.
    ZtpVendor:
      type: string
      enum: [yealink]
      description: Which vendor's zero-touch redirect service the MAC is registered with.
    # -- text messaging (console ADR-0094) ----------------------------------------------------------
    #
    # `remoteStatus` IS ABSENT ON PURPOSE and is not an omission to be filled in later. The provider's
    # own word for where a request stands is an open vocabulary that changes without notice, and it
    # identifies the supplier — which this API never does. `stage` and `stageWord` below are the
    # stable reading of it.
    MessagingEnablementStatus:
      type: string
      enum: [awaiting_signature, scheduled, submitted, completed, failed]
      description: |
        Where the request stands.

        `awaiting_signature` the number's own end user has not signed the authorization yet, so
        nothing has been sent and nothing will be until they do · `scheduled` it has not been sent
        yet · `submitted` it is with the provider · `completed` the number can text · `failed` it
        ended without messaging being turned on. The two terminal values are final: a failed request
        is never revived, it is retried, and a retry is a new request.

        `awaiting_signature` appears only on a request created by a hosted messaging order, where the
        number's calls are carried by another provider: the subscriber of record is then the end user
        rather than you, so they sign, and the request waits for a person outside the console.
    MessagingEnablementFailureCause:
      type: string
      enum: [provider_rejected, withdrawn, submission_error, poll_gave_up]
      description: |
        Why a failed request ended, in four words.

        `provider_rejected` somebody refused the authorization · `withdrawn` it was taken off before
        it was ever sent, which includes a number leaving a port · `submission_error` we could not
        send it · `poll_gave_up` we stopped waiting for an answer. Only the first means anybody said
        no; `detail` carries the sentence to show a person.
    MessagingEnablementAttributes:
      type: object
      properties:
        e164:
          type: string
          description: |
            The number this request is about. It is held as digits rather than as a link, so it
            still says which number it was for after that number is released.
          example: '+13215550101'
        status:
          $ref: '#/components/schemas/MessagingEnablementStatus'
        stage:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            How far the request got, as 0-4 — **this is the field to branch on**.

            It is a HIGH-WATER MARK and not a current position: a failed request keeps the stage it
            reached, so `3` on a failed row means the number's current provider had the authorization
            in front of them and `2` means it never reached them. `0` means nothing was ever sent.
        stageWord:
          type: string
          description: |
            The one word to print beneath a progress meter — `Scheduled`, `Submitted`, `In review`,
            `Active`, `Removed` or `Failed`.

            **Display copy, not a vocabulary to branch on**; use `stage` and `status` for that. It is
            deliberately not an enum here, because it is wording we may improve.
          example: In review
        detail:
          type: [string, 'null']
          description: |
            One sentence you can show a person, or null when the status already says everything —
            a scheduled request and a plain submitted one have nothing to add.
          example: 'Submitted 2026-09-01. The losing provider is reviewing the authorization.'
        failedCause:
          oneOf:
            - $ref: '#/components/schemas/MessagingEnablementFailureCause'
            - type: 'null'
        scheduledFor:
          type: [string, 'null']
          format: date-time
          description: |
            When the request was due to be sent. Null means "as soon as possible", which is a real
            answer on a request that rides a port order rather than a missing value.
        submittedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        retryAllowedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When a failed request may be tried again — null unless it failed. It is the same instant
            a too-early retry returns in `meta.retryAllowedAt`, so a button drawn from this field
            cannot offer a retry the endpoint would refuse.
        createdAt: { type: [string, 'null'], format: date-time }
    MessagingEnablementRelationships:
      type: object
      properties:
        phoneNumber:
          allOf:
            - $ref: '#/components/schemas/RelationshipToOne'
          description: |
            The number, while you still hold it. Null once the number has been released — the
            request outlives it, and `e164` is what still names it.
        portOrder:
          allOf:
            - $ref: '#/components/schemas/RelationshipToOne'
          description: |
            The port order this request rides, or null when it was made directly against a number
            already in your inventory. This is what tells the two kinds apart.
    InboundMessageKind:
      type: string
      description: |
        Which family the message came from. NOT derivable from `media`: an MMS carrying only a
        caption and an SMS both arrive with a body and no attachment.
      enum:
        - sms
        - mms
    InboundMessageMediaPart:
      type: object
      description: |
        One part of a picture message, DESCRIBED. There is no image and no URL — we do not keep the
        bytes. If you need the file, ask your messaging provider.
      properties:
        content_type: { type: string, example: image/jpeg }
        filename: { type: [string, 'null'], description: 'The part''s filename, when it named one.', example: photo.jpg }
        encoding: { type: string, example: base64 }
        bytes: { type: integer, description: 'The part''s decoded size, in bytes.', example: 40213 }
    InboundMessageAttributes:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/InboundMessageKind'
        from: { type: string, description: 'The sending number, in E.164.', example: '+12003004000' }
        to: { type: string, description: 'Your number, in E.164.', example: '+13215550101' }
        body:
          type: [string, 'null']
          description: The text. Null for a picture message with no caption.
        media:
          type: array
          description: The described parts of a picture message. Empty for a text message.
          items:
            $ref: '#/components/schemas/InboundMessageMediaPart'
        receivedAt:
          type: string
          format: date-time
          description: When the message was SENT — filter on this one.
        createdAt: { type: string, format: date-time, description: When we stored it. }
        updatedAt: { type: string, format: date-time }
    InboundMessageResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [inbound-messages] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/InboundMessageAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    InboundMessageDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InboundMessageResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    InboundMessageCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InboundMessageResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    MessagingEnablementResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [messaging-enablements] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/MessagingEnablementAttributes'
        relationships:
          $ref: '#/components/schemas/MessagingEnablementRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    MessagingEnablementDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MessagingEnablementResource'
        included:
          type: array
          items: { type: object }
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    MessagingEnablementCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MessagingEnablementResource'
        included:
          type: array
          items: { type: object }
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    MessagingEnablementCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, relationships]
          properties:
            type: { type: string, enum: [messaging-enablements] }
            relationships:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    HostedMessagingOrderStatus:
      type: string
      enum: [claimed, awaiting_signature, submitted, failed]
      description: |
        How far the order got.

        `claimed` the number was already text-enabled where it lives and we recorded it ·
        `awaiting_signature` the authorization is out and your end user has not signed it yet ·
        `submitted` the signed request reached the provider · `failed` the order was abandoned and
        will never be fulfilled.

        `claimed` is FINAL the moment the order exists: nothing was ordered, nothing was signed and
        nothing is owed. `submitted` will not move either — what is still outstanding is outstanding
        on the request, and `messagingEnablement` is what you follow for it. This is deliberately not
        a second progress meter.

        `failed` is also FINAL, and it is not the same fact as a failed `messagingEnablement`. One
        failed request is one attempt that ended; this says nobody will submit for this number again
        under this order, the authorization ceremony is shut and its link no longer opens. It is
        written only by a deliberate act of ours, never by a provider's answer, so an integrator
        reading it back can treat it as settled.
    HostedMessagingMechanism:
      type: string
      enum: [claimed, enabled]
      description: |
        Which door the order took. Decided by us from what the number already had, never chosen by
        the caller, and never changed afterwards.

        `claimed` the number could already text where it lives, so we recorded it and asked its
        provider for nothing · `enabled` we asked its provider to turn text messaging on, and
        `messagingEnablement` is the request.
    HostedMessagingOrderAttributes:
      type: object
      properties:
        e164:
          type: string
          description: |
            The number this order is about. It is held as digits rather than only as a link, so it
            still says which number it was for after that number is disconnected.
          example: '+13215550101'
        status:
          $ref: '#/components/schemas/HostedMessagingOrderStatus'
        mechanism:
          $ref: '#/components/schemas/HostedMessagingMechanism'
        createdAt:
          type: [string, 'null']
          format: date-time
          description: When the order was placed.
    HostedMessagingOrderRelationships:
      type: object
      properties:
        phoneNumber:
          allOf:
            - $ref: '#/components/schemas/RelationshipToOne'
          description: |
            The number the order put in your inventory. Always set when the order is made; null once
            that number has been disconnected — the order outlives it, and `e164` is what still
            names it.
        messagingEnablement:
          allOf:
            - $ref: '#/components/schemas/RelationshipToOne'
          description: |
            The text-messaging request this order raised, or null on the claim path, where nothing
            was ever sent. This is what tells the two mechanisms apart, and what you follow for live
            progress on the enable path.
        customer:
          allOf:
            - $ref: '#/components/schemas/RelationshipToOne'
          description: The customer the number is for, or null when it stays in your own pool.
    HostedMessagingOrderResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [hosted-messaging-orders] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/HostedMessagingOrderAttributes'
        relationships:
          $ref: '#/components/schemas/HostedMessagingOrderRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    HostedMessagingOrderDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HostedMessagingOrderResource'
        included:
          type: array
          items: { type: object }
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    HostedMessagingOrderCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HostedMessagingOrderResource'
        included:
          type: array
          items: { type: object }
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    HostedMessagingOrderCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [hosted-messaging-orders] }
            attributes:
              type: object
              required: [e164, endUser]
              properties:
                e164:
                  type: string
                  description: |
                    The number to bring in, in full and with the country code. It must not already
                    be in anybody's inventory here.
                  example: '+13215550101'
                endUser:
                  type: object
                  description: |
                    Who will authorize text messaging on the number, and where to email them. The
                    number's calls are carried by another provider, so the authorization has to come
                    from whoever that provider bills — not from you — and we email them a secure link
                    to read and sign it.

                    Required on every create. It is stored only when the number takes the `enabled`
                    path: which path a number takes is decided from what the number already has, so
                    it cannot be known when you send this. An order that comes back `claimed` needed
                    no authorization and keeps none of these details.

                    Write-only. These are the ceremony's contact details rather than the order's, so
                    they are never returned.
                  required: [name, email]
                  properties:
                    name:
                      type: string
                      maxLength: 120
                      description: The person or business the phone company bills for this number.
                      example: Dana Okonkwo
                    email:
                      type: string
                      format: email
                      maxLength: 254
                      description: Where the signing link is sent.
                      example: dana@okonkwovet.test
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    ZtpDeviceAttributes:
      type: object
      properties:
        mac:
          type: string
          description: |
            12 lowercase hexadecimal characters — always, on the way out. On the way in, any of
            `001565f0517a`, `00:15:65:f0:51:7a` or `00-15-65-f0-51-7a`, upper or lower case.
          example: 001565f0517a
        vendor:
          $ref: '#/components/schemas/ZtpVendor'
        label:
          type: [string, 'null']
          maxLength: 64
          description: Your own caption for the phone. It is never sent to the vendor.
        state:
          $ref: '#/components/schemas/ProvisioningState'
        stateDetail:
          type: [string, 'null']
          description: |
            While provisioning, the step we reached; after a failure, the reason — the vendor's own
            sentence where there is one, because it is what names the fix.
        stateChangedAt: { type: [string, 'null'], format: date-time }
        registeredAt:
          type: [string, 'null']
          format: date-time
          description: When the vendor's redirect service first accepted this MAC.
        lastConnectedAt:
          type: [string, 'null']
          format: date-time
          description: When the phone last checked in with the redirect service.
        lastIp:
          type: [string, 'null']
          description: The address the phone last checked in from.
        observedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the four fields above were last read from the vendor. They refresh hourly, so this
            is how stale a `lastConnectedAt` may be.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    ZtpDeviceRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
    ZtpDeviceResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [ztp-devices] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/ZtpDeviceAttributes'
        relationships:
          $ref: '#/components/schemas/ZtpDeviceRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    ZtpDeviceDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ZtpDeviceResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    ZtpDeviceCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ZtpDeviceResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    ZtpDeviceCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [ztp-devices] }
            attributes:
              type: object
              required: [mac]
              properties:
                mac: { type: string }
                label: { type: [string, 'null'], maxLength: 64 }
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      oneOf:
                        - $ref: '#/components/schemas/ResourceIdentifier'
                        - type: 'null'
    ZtpDeviceUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [ztp-devices] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              properties:
                label: { type: [string, 'null'], maxLength: 64 }
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      oneOf:
                        - $ref: '#/components/schemas/ResourceIdentifier'
                        - type: 'null'

    # -- port-orders -------------------------------------------------------------------------------
    # THREE NAMED VOCABULARIES AND NO MORE. A named enum here is one a PHP declaration owns and
    # `OpenApiConformanceTest`'s ENUM_MIRRORS holds it to. The smaller vocabularies below —
    # `portType`, a number's `numberType`, the two task words, the bill-reading states, the mail
    # `kind` — are spelled INLINE on the property that takes them, because each is one property's
    # business and there is no single PHP list for a mirror to compare against.
    PortOrderStatus:
      type: string
      description: |
        Where an order stands. `draft` is yours to edit; `awaiting_signature` is the same order
        locked while your customer signs the Letter of Authorization, and an edit returns it to
        `draft`; `awaiting_review` is with our desk; `submitted` means the paperwork went to a
        carrier; `foc_assigned` means one committed to a cutover date; `completed` and `failed` are
        the two ends.

        **The order and each of its numbers share this vocabulary, except `awaiting_signature`.**
        That one is the order's alone: it is a fact about the paperwork, and a number has none of
        its own — so a number stays `draft` until the order enters review.
      enum:
        - draft
        - awaiting_signature
        - awaiting_review
        - submitted
        - foc_assigned
        - completed
        - failed
    PortNumberFailureCause:
      type: [string, 'null']
      description: |
        Why ONE number left the port, beside the `failed` status it shares with every other way of
        ending. `withdrawn` — it was taken off the order before it moved, and nothing refused it.
        `carrier_refused` — a carrier declined this number while committing to the rest.

        **`null` is a third reading and not a missing value:** nobody stated a cause. It is what
        every number carries when the whole ORDER failed, whose own status says what happened.

        It names no carrier: `carrier_refused` says a carrier refused, never which one.
      enum:
        - withdrawn
        - carrier_refused
        - null
    PortDocumentKind:
      type: string
      description: |
        The two slots an order has, and the whole vocabulary of an upload's `kind`. The generated
        letter is not one of them — nobody uploads a letter we write.
      enum: [loa, bill]
    PortType:
      type: [string, 'null']
      description: |
        Whether the whole account moves or some lines stay behind. There is no default: a draft that
        has never been asked must not read like one that answered `full`.

        **`null` is a third reading and not a missing value:** nobody has said yet. A `partial` port
        is the one that needs `newBillingNumber`, because the losing account lives on.
      enum: [full, partial, null]
    PortNumberType:
      type: [string, 'null']
      description: |
        What the BILL says one line is. It is deliberately not corrected from what the network says —
        the two disagree often, and a carrier works from the bill.

        **`null` is a third reading and not a missing value:** the bill did not say.
      enum: [landline, wireless, voip, null]
    PortOrderTaskBillState:
      type: string
      description: '`missing` until the bill is in its slot, `received` afterwards.'
      enum: [missing, received]
    PortOrderTaskDateState:
      type: string
      description: |
        `missing` until somebody has said when the numbers should move, `chosen` once they have.

        `chosen` with a null `requestedFocDate` is an ordinary answer and not a half-finished one:
        "the first available date" is an answer that names no day, and the day is stamped when the
        order enters review, against the calendar as it stands then.
      enum: [missing, chosen]
    PortOrderTaskSignatureState:
      type: string
      description: |
        `not_ready` — no letter has been generated, so there is nothing to sign. `ready` — a letter
        is waiting and the signed slot is empty. `signed` — the slot is filled, by the signing
        ceremony or by a wet-signed scan you uploaded yourself; either way your customer is finished.
      enum: [not_ready, ready, signed]
    PortOrderBillExtractionStatus:
      type: string
      description: |
        `pending` — a bill has just been uploaded and the reading has not answered yet.
        `done` — a model answered and the blank columns were filled. `failed` — nobody could read
        it, which blocks nothing; you type the fields. `skipped` — the order left `draft` before the
        answer arrived, so nothing was applied.
      enum: [pending, done, failed, skipped]
    PortOrderRequestLinkMailKind:
      type: string
      description: |
        Which mail to send. `bill` asks for the phone bill; `signature` asks for a signature and
        needs a generated letter to point at. Both carry the SAME link — one durable link per order
        carries every task — so a kind is different words around one URL and never a second URL.
      enum: [bill, signature]
    PortOrderNumberState:
      type: object
      description: |
        Where ONE number stands. A port splits, so this is the only honest answer to "where is my
        port?" on an order a carrier has answered unevenly.
      properties:
        e164:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PortOrderStatus'
        cause:
          $ref: '#/components/schemas/PortNumberFailureCause'
        focDate:
          type: [string, 'null']
          format: date
          description: |
            The carrier's firm commitment for THIS number, as a plain `YYYY-MM-DD` day. Null until
            there is one, which is most of an order's life.
        stopped:
          type: boolean
          description: |
            Whether a carrier is currently holding this number pending a correction. It is the
            MARKER and never the carrier's own words: a losing carrier's sentence about your account
            does not cross to this plane.
        stoppedSince:
          type: [string, 'null']
          format: date-time
          description: Since when, or null while nothing is held.
    PortOrderDocumentSlot:
      type: [object, 'null']
      description: |
        One uploaded document, as a digest and a date — **never a handle**. These documents are
        fetched unauthenticated by a losing carrier's LNP desk, so their identifiers are bearer
        capabilities and no surface here publishes one. `null` is a draft's ordinary condition: an
        order is opened days before the bill it is transcribed from exists.
      properties:
        sha256:
          type: string
          description: |
            The digest of the bytes as we hold them, read back off storage rather than computed from
            what was sent. Hash your own copy and compare.
        uploadedAt:
          type: [string, 'null']
          format: date-time
    PortOrderDocuments:
      type: object
      description: The two slots, keyed by kind. Both keys are always present; either may be null.
      properties:
        loa:
          $ref: '#/components/schemas/PortOrderDocumentSlot'
        bill:
          $ref: '#/components/schemas/PortOrderDocumentSlot'
    PortOrderUnsignedLoa:
      type: [object, 'null']
      description: |
        The letter we generated for your customer to sign, or `null` before one has ever been built
        — and again after any edit that moves a field it prints.
      properties:
        sha256: { type: string }
        generatedAt: { type: [string, 'null'], format: date-time }
    PortOrderRequestLinkState:
      type: object
      description: |
        Whether your customer's door is open, and nothing that would let anyone walk through it. The
        URL exists in plaintext exactly once, in the response to the call that minted it.
      properties:
        active:
          type: boolean
          description: |
            True while a link is live. Revoked, expired and never-issued are one answer here, as
            they are everywhere else on this surface.
    PortOrderTasks:
      type: object
      description: |
        What is left for your customer to do, in their three steps: hand us the bill, say when the
        numbers should move, then sign the transfer form. Poll this to know whether to chase them —
        it is progress and names no document, no digest and no identifier.

        Each task has its OWN vocabulary; they are not one list. Read them per key.
      properties:
        bill:
          $ref: '#/components/schemas/PortOrderTaskBillState'
        date:
          $ref: '#/components/schemas/PortOrderTaskDateState'
        signature:
          $ref: '#/components/schemas/PortOrderTaskSignatureState'
    PortOrderBillExtraction:
      type: [object, 'null']
      description: |
        Whether a model read the bill, and which fields it answered for — **never what it said**.
        `null` until a bill has been uploaded at all.

        The values are already this order's own attributes wherever the reading was applied, so a
        second copy here would be one that can disagree with the fields beside it. The NAMES answer
        the question you actually have: which of these did we not have to type?
      properties:
        status:
          $ref: '#/components/schemas/PortOrderBillExtractionStatus'
        fields:
          type: array
          description: |
            The columns the reading carried a value for, in the snake_case the extractor names them
            by. `done` with an empty list is real and ordinary: the bill was read and every column
            it could have filled was already filled.
          items: { type: string }
        extractedAt:
          type: [string, 'null']
          format: date-time
    PortOrderAttributes:
      type: object
      properties:
        label:
          type: string
          maxLength: 255
          description: |
            Your own working title for the order, and the one field editable in any live state. It
            is never sent to a carrier and never printed on the letter, which is exactly why a
            rename is allowed after the rest of the order has frozen.
        country:
          type: string
          maxLength: 2
          description: Declared once at create and immutable after. Defaults to `US`.
        status:
          $ref: '#/components/schemas/PortOrderStatus'
        endUserName:
          type: [string, 'null']
          description: |
            The LEGAL name on the losing account, exactly as the bill prints it — not a contact's
            personal name, and not your own label for them. A carrier matches on this.
        endUserAddress:
          type: [string, 'null']
          description: |
            The service address as one verbatim block, which is what a losing carrier receives and
            what the letter prints. **RENDERED from the five parts below** on every edit that
            touches one, so send the parts. It stays writable because an order transcribed before
            the parts existed carries a hand-typed block and nothing else.
        loaSigner:
          type: [string, 'null']
          description: Who signs the Letter of Authorization.
        loaDate:
          type: [string, 'null']
          format: date
          description: |
            The day they sign it, as a plain `YYYY-MM-DD` — a day and not an instant, so nothing
            here invents a time nobody stored.
        currentProvider:
          type: [string, 'null']
          description: Who carries the numbers today.
        accountNumber:
          type: [string, 'null']
          description: The account number with them, as their bill prints it.
        monthlyMou:
          type: integer
          description: |
            Monthly minutes of use on the losing account. Nobody is asked for one — it rides the
            wire at its stored value, `0` unless somebody set it — and it is kept writable because
            it is a real column a carrier is told about.
        accountPin:
          type: 'null'
          description: |
            **Write-only. Every read answers `null`.** The port-out PIN is a credential on somebody
            else's account: it is stored encrypted, and a response cannot tell you whether one is on
            file. Read `accountPinAttestedNone` instead — it is the other answer to the same
            question.
        accountPinAttestedNone:
          type: boolean
          description: |
            Your own word that the losing account has NO port-out PIN. It round-trips freely — it is
            a fact about the account rather than a credential.

            A row may hold this or a PIN and never both: typing a PIN clears this for you, and
            setting this while a PIN is stored is refused. The submit gate asks for one of the two.
        billingPhone:
          type: [string, 'null']
          description: |
            The billing telephone number the losing account bills under — the BTN a carrier finds
            the customer service record by. Bill data, not a credential.
        portType:
          $ref: '#/components/schemas/PortType'
        newBillingNumber:
          type: [string, 'null']
          description: |
            The number the surviving account will bill under — asked only on a `partial` port, where
            the losing account lives on. On a full port it closes and the question has no answer.
        serviceStreetNumber: { type: [string, 'null'] }
        serviceStreetName: { type: [string, 'null'] }
        serviceCity: { type: [string, 'null'] }
        serviceState:
          type: [string, 'null']
          description: A two-letter state or province code.
        serviceZip: { type: [string, 'null'] }
        requestedFocDate:
          type: [string, 'null']
          format: date-time
          description: |
            The cutover you are asking a carrier for — an INSTANT, unlike `loaDate`, because both
            carriers are told a time of day. Optional while the order is a draft and never null
            afterwards: the submit gate stamps 11:00 Eastern on the tenth United States business day
            out when you named none, and keeps yours exactly when you did.
        contactName: { type: [string, 'null'] }
        contactTitle: { type: [string, 'null'] }
        contactEmail: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        numbersNotTransferring:
          type: [string, 'null']
          description: |
            Free text for the lines staying behind on a partial port — a note for the desk, never a
            second number list.
        numbers:
          type: array
          description: |
            The whole set to move, as bare E.164 strings. This is the WRITABLE set and it is
            replaced wholesale on every edit; where each of them STANDS is `numberStates` below.
          items: { type: string }
        correctionsRequired:
          type: boolean
          description: |
            **Is this port waiting on you?** True while a carrier is holding a number pending a
            correction, or our desk has asked you for one. Derived on every read from those markers,
            so it un-sets itself the moment a carrier withdraws its objection — which is exactly why
            it is a flag beside `status` and not an eighth state.
        correctionsNote:
          type: [string, 'null']
          description: |
            What we said to fix, in our desk's own sentence, written for you. Null wherever nobody
            has said anything — including every purely derived `correctionsRequired`, because the
            remedy for a carrier's stop lives in that carrier's own prose and that does not cross to
            this plane.
        numberStates:
          type: array
          description: |
            Where each number stands, one entry per number. A port splits, so this and not the
            order's own `status` is what answers "which of my lines have moved?".
          items:
            $ref: '#/components/schemas/PortOrderNumberState'
        documents:
          $ref: '#/components/schemas/PortOrderDocuments'
        unsignedLoa:
          $ref: '#/components/schemas/PortOrderUnsignedLoa'
        requestLink:
          $ref: '#/components/schemas/PortOrderRequestLinkState'
        tasks:
          $ref: '#/components/schemas/PortOrderTasks'
        detailsConfirmedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When a person vouched that the transcribed fields match the bill. It CLEARS on any edit
            that touches them, so it is a live fact rather than a milestone.
        signatureRequestedAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the letter went to your customer. Not the request link's own age — a link is minted
            for the bill task days earlier and survives a reopen.
        billExtraction:
          $ref: '#/components/schemas/PortOrderBillExtraction'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    PortOrderResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [port-orders] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/PortOrderAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    # `Document` here is the JSON:API sense — one resource in an envelope. The PDFs an order carries
    # are `PortOrderDocuments` above and the upload pair below.
    PortOrderDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PortOrderResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PortOrderCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortOrderResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PortOrderCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [port-orders] }
            attributes:
              type: object
              # TWO MEMBERS AND NO MORE, which is the create arm's whole contract: everything else
              # this resource declares is refused with a 422 rather than dropped. See the operation.
              required: [label]
              properties:
                label: { type: string, maxLength: 255 }
                country: { type: string, maxLength: 2 }
    PortOrderNumberInput:
      description: |
        One number to move: a bare E.164 string, or an object naming what the bill says the line is.
      oneOf:
        - type: string
        - type: object
          required: [e164]
          properties:
            e164: { type: string }
            numberType:
              $ref: '#/components/schemas/PortNumberType'
    PortOrderUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [port-orders] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              description: |
                Send what you are changing. An omitted attribute is left alone; an explicit `null`
                clears the field. `numbers` is replaced wholesale. `country`, `status`, the
                timestamps and every derived attribute may be echoed back unchanged and are a 422
                with a different value.
              properties:
                label: { type: [string, 'null'], maxLength: 255 }
                endUserName: { type: [string, 'null'] }
                endUserAddress: { type: [string, 'null'] }
                loaSigner: { type: [string, 'null'] }
                loaDate: { type: [string, 'null'], format: date }
                currentProvider: { type: [string, 'null'] }
                accountNumber: { type: [string, 'null'] }
                monthlyMou: { type: [integer, 'null'] }
                accountPin:
                  type: [string, 'null']
                  description: Write-only — see the attribute of the same name on the resource.
                accountPinAttestedNone: { type: boolean }
                billingPhone: { type: [string, 'null'] }
                portType:
                  $ref: '#/components/schemas/PortType'
                newBillingNumber: { type: [string, 'null'] }
                serviceStreetNumber: { type: [string, 'null'] }
                serviceStreetName: { type: [string, 'null'] }
                serviceCity: { type: [string, 'null'] }
                serviceState: { type: [string, 'null'] }
                serviceZip: { type: [string, 'null'] }
                requestedFocDate: { type: [string, 'null'], format: date-time }
                contactName: { type: [string, 'null'] }
                contactTitle: { type: [string, 'null'] }
                contactEmail: { type: [string, 'null'] }
                contactPhone: { type: [string, 'null'] }
                numbersNotTransferring: { type: [string, 'null'] }
                numbers:
                  type: [array, 'null']
                  items:
                    $ref: '#/components/schemas/PortOrderNumberInput'
              additionalProperties: true

    # -- the port-orders process endpoints — flat JSON, not JSON:API documents ----------------------
    PortOrderDocumentUploadRequest:
      type: object
      description: |
        The parts an upload is made of. PDF only, decided on the file's own first five bytes, and at
        most 20 MB.

        `signed_on` and `signer` are REQUIRED on the `loa` slot and accepted on no other — a signed
        letter carries two facts the PDF cannot, and they are stored in the same transaction as the
        document. They are named as parts rather than as the `loaDate`/`loaSigner` attributes the
        JSON:API document uses, because this body is a form and has no `data.attributes`.
      required: [kind, file]
      properties:
        kind:
          $ref: '#/components/schemas/PortDocumentKind'
        file:
          type: string
          format: binary
          description: The PDF itself, as one file part.
        signed_on:
          type: string
          format: date
          description: |
            **`loa` only, and required there.** The day your customer signed, as `YYYY-MM-DD`. Never
            a day that has not happened — an LOA dated after the day a carrier reads it authorizes
            nothing yet. Today is decided in UTC.
          example: '2026-08-20'
        signer:
          type: string
          maxLength: 255
          description: |
            **`loa` only, and required there.** The name in the signature block — who actually
            signed, which is not always who `loaSigner` said would. It OVERWRITES that attribute,
            because what a carrier is told has to be what happened.
          example: Bea Whitfield
    PortOrderSubmitted:
      type: object
      description: |
        A flat acknowledgement, not a JSON:API document. Read the whole order back at
        `GET /v1/port-orders/{portOrder}`.
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/PortOrderStatus'
            numbers:
              type: array
              description: The set the order went in with, as it now stands.
              items: { type: string }
    PortOrderDocumentStored:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            kind:
              $ref: '#/components/schemas/PortDocumentKind'
            sha256:
              type: [string, 'null']
              description: |
                The digest of the bytes as stored — the handle-free way to check we hold the file
                you sent.
    PortOrderLoaGenerated:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            sha256:
              type: [string, 'null']
              description: The digest of the letter now waiting to be signed.
    PortOrderRequestLinkIssued:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            url:
              type: string
              format: uri
              description: |
                Your customer's link, on your own branded portal host. **Ask again whenever you need
                it** — `POST /v1/port-orders/{portOrder}/request-link` answers with the same URL for
                as long as the link is live, so you need not store it. It was the only copy until
                2026-09-01, when the token stopped being stored hashed-only.
    PortOrderRequestLinkRevoked:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            revoked:
              type: boolean
              description: |
                Whether anything was live to revoke. `false` is an ordinary answer — most orders
                never have a link at all — and not an error.
    PortOrderRequestLinkSendRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email
          description: Your customer's address.
        kind:
          $ref: '#/components/schemas/PortOrderRequestLinkMailKind'
          default: bill
        note:
          type: [string, 'null']
          maxLength: 500
          description: Your own sentence to your customer, carried in the mail.
    PortOrderRequestLinkSent:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            sent_to:
              type: string
              format: email
              description: The address the mail went to, echoed back.

    # -- customers (the reads; console ADR-0023's pattern resource) --------------------------------
    CustomerRegionPreference:
      type: string
      description: |
        The primary region chosen for this customer. `partner_default` follows your account's default
        region, so changing that default moves every customer that chose it; `use1` and `usw1` pin
        the customer to one region.
      enum: [partner_default, use1, usw1]
    CustomerTransport:
      type: string
      description: A SIP transport this customer's phone system offers.
      enum: [udp, tcp, tls]
    CustomerAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        code:
          type: [string, 'null']
          description: |
            The short code the platform assigns a customer: five characters, lowercase letters and
            digits. It never changes.
          example: jpz3k
        country:
          type: [string, 'null']
          description: The service address's country, ISO 3166-1 alpha-2.
          example: US
        addressLines:
          type: array
          items: { type: string }
          description: The service address's street lines, as the address was validated.
        city: { type: [string, 'null'] }
        region: { type: [string, 'null'], description: 'The state or province.' }
        postalCode: { type: [string, 'null'] }
        timeZone:
          type: [string, 'null']
          description: An IANA time zone name.
          example: America/Chicago
        dataResidencyCountry:
          type: string
          description: |
            The country this customer's data is kept in, ISO 3166-1 alpha-2. Set when the customer
            is created, and never changed.
          example: US
        regionPreference:
          $ref: '#/components/schemas/CustomerRegionPreference'
        effectiveRegion:
          type: string
          description: |
            The region `regionPreference` resolves to now. For `partner_default` that is your
            account's current default.
          example: use1
        pbx:
          type: boolean
          description: Whether this customer has a phone system. The five fields after this one are null when it does not.
        residential:
          type: [boolean, 'null']
          description: The phone system's residential setting.
        callLimit:
          type: [integer, 'null']
          description: The most calls the phone system allows at once.
        callLimitExternal:
          type: [integer, 'null']
          description: The most external calls the phone system allows at once.
        transports:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/CustomerTransport'
          description: |
            The SIP transports the phone system offers. The ORDER is data: it is the order the
            transports are offered in DNS, first preferred.
          example: [tls, udp]
        provisioningState:
          description: Where building the phone system on the switch stands.
          oneOf:
            - $ref: '#/components/schemas/ProvisioningState'
            - type: 'null'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    CustomerResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [customers] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/CustomerAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    CustomerDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CustomerResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    CustomerCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'

    # -- tenants (the credential's own view of itself, ADR-0029) -----------------------------------
    TenantStatus:
      type: string
      description: |
        The reseller onboarding lifecycle (console ADR-0006). Only `active` opens the portal;
        `suspended` is a staff action reachable from any other state.
      enum:
        - pending_email
        - pending_kyc
        - kyc_in_progress
        - kyc_in_review
        - active
        - kyc_declined
        - suspended
    TenantAttributes:
      type: object
      properties:
        brandName: { type: [string, 'null'] }
        legalName: { type: [string, 'null'] }
        status:
          $ref: '#/components/schemas/TenantStatus'
        createdAt: { type: [string, 'null'], format: date-time }
        onboardingRequirements:
          type: array
          items: { type: string }
          description: |
            Stable machine identifiers for what this account still owes before it may write on this
            surface — `[]` means nothing is outstanding. `company_address` is the only code today.
        brandColorPrimary:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Six-digit hex, like `#0057b8`. Null clears the override.
        brandColorAccent:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Six-digit hex, like `#0057b8`. Null clears the override.
        supportEmail:
          type: [string, 'null']
          format: email
          maxLength: 255
        supportPhone:
          type: [string, 'null']
          maxLength: 20
          description: E.164, like +14155550100.
        includedDomain:
          type: [string, 'null']
          description: |
            The platform-issued host this tenant always answers on, under the shared base domain.
            Read-only.
        whiteLabelDomain:
          type: [object, 'null']
          description: |
            The tenant's own connected domain, once one exists — null until it does. Read-only:
            there is no API write path for a domain or a DNS zone yet (console ADR-0096).
          properties:
            registrableDomain: { type: string }
            consoleHost: { type: string }
            apiHost: { type: string }
            status:
              type: string
              enum: [pending_dns, provisioning, verifying, active, failed, disabled]
            isPrimary:
              type: boolean
              description: Whether the console host above is this tenant's canonical login surface.
        sendingIdentity:
          type: [object, 'null']
          description: |
            The address this tenant's outbound mail sends from, once one is provisioned — null until
            it is. Read-only: there is no API write path yet (console ADR-0097).
          properties:
            address: { type: string, format: email }
            status:
              type: string
              enum: [pending, dns_pending, verifying, active, failed, disabled]
    TenantResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [tenants] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/TenantAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    TenantDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TenantResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    TenantWritableAttributes:
      type: object
      properties:
        brandColorPrimary:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Six-digit hex, like `#0057b8`. Null clears the override.
        brandColorAccent:
          type: [string, 'null']
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Six-digit hex, like `#0057b8`. Null clears the override.
        supportEmail:
          type: [string, 'null']
          format: email
          maxLength: 255
        supportPhone:
          type: [string, 'null']
          maxLength: 20
          description: E.164, like +14155550100.
    TenantUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [tenants] }
            id: { type: string, format: uuid }
            attributes:
              $ref: '#/components/schemas/TenantWritableAttributes'

    # -- sip-trunks --------------------------------------------------------------------------------
    SipTrunkMode:
      type: string
      description: |
        `register` — the phone system signs in to the trunk hostname and we deliver inbound calls
        wherever it registered from, so it works behind NAT and on a dynamic address.
        `static` — the phone system never signs in; you list the addresses it calls from and the
        hosts we send its calls to.
      enum: [static, register]
    SipTrunkRegistrationMode:
      type: string
      description: |
        `replace` — one binding, replaced on every sign-in, which is what every mainstream phone
        system does. `additive` — several bindings held at once, for a system that registers more
        than one contact.
      enum: [replace, additive]
    SipTrunkLocalization:
      type: string
      description: The dial-plan country a trunk's numbers are read against.
      enum: [US, CA, MX, GB]
    SipTrunkAniFormat:
      type: string
      description: How the CALLING number is presented to the phone system.
      enum: [plus_e164, e164, national, plus_e164_national, e164_national]
    SipTrunkDnisFormat:
      type: string
      description: |
        How the CALLED number is presented to the phone system. `sip_username` sends the trunk's own
        username instead of the number, and is refused on a `static` trunk.
      enum: [plus_e164, e164, national, sip_username]
    SipTrunkDialPolicy:
      type: string
      description: |
        Which destinations the trunk may call. `us_canada` and `nanp` are the two guarded settings;
        `permit_all` opens international dialling.
      enum: [us_canada, nanp, permit_all]
    SipTrunkMediaMode:
      type: string
      description: |
        `anchored` keeps the audio on our edge, which is what makes recording and mid-call features
        possible. `direct` lets the audio flow end to end.
      enum: [anchored, direct]
    SipTrunkTransport:
      type: string
      description: The transport a destination is reached over.
      enum: [udp, tcp, tls]
    SipTrunkRegistration:
      type: [object, 'null']
      readOnly: true
      description: |
        Whether the phone system is currently signed in — a **recent observation**, not a record. The
        edge is the authority; the console is told about a registration and cannot create, move or
        revoke one.

        **`null` on a `static` trunk**, which never registers and never will. Reading `not_registered`
        there would be a fault report about a working trunk.

        **STATED LIMIT.** This object reports the cache's answer alone. It carries **no `unknown`
        state and no freshness member**, so a client reading `not_registered` while our feed is down
        is reading a cache nobody has corrected. Adding a freshness member later is additive and
        breaks no client; nothing in v1 carries one, and nothing here should be read as implying one.
      properties:
        state:
          type: string
          enum: [registered, not_registered]
        contacts:
          type: integer
          description: |
            How many bindings the edges hold, summed — a trunk may be signed in against more than one
            access edge at a time, and this is the total. Always an integer, `0` when nothing is
            registered, so a client can add it up without a null check.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the current binding lapses unless the phone system refreshes it.
      example:
        state: registered
        contacts: 1
        expires_at: '2026-09-10T18:31:00Z'
    SipTrunkAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        domainLabel:
          type: string
          description: |
            The hostname label the phone system signs in to — `<domainLabel>.trunk.signlar.com`.
            Unique across the whole platform. Changing it MOVES that hostname and ends every current
            registration.
          pattern: '^[a-z][a-z0-9-]{2,62}$'
        primaryRegion:
          type: string
          description: Which region carries this trunk's edge.
          enum: [use1, usw1]
        enabled:
          type: boolean
          description: |
            A disabled trunk refuses registration, answers inbound calls 480 and outbound 403. It is
            how you stop calls without deleting anything.
        mode:
          $ref: '#/components/schemas/SipTrunkMode'
        username:
          type: [string, 'null']
          description: |
            The SIP identity. Required on a `register` trunk; a `static` trunk may carry none. Two
            trunks may hold the same username — the hostname is what selects the trunk.
        password:
          type: [string, 'null']
          minLength: 8
          description: |
            Sent on create and update. **Every ordinary read answers `null`** — the member is always
            present and never carries the stored credential, so a client can send the same document
            shape back without stripping it.

            The live value comes from `POST /v1/sip-trunks/{id}/reveal-password` and
            `POST /v1/sip-trunks/{id}/regenerate-password` alone, which answer this same document
            with the plaintext in this member. Both are audited. It is NOT marked `writeOnly`, and
            that is deliberate: those two responses carry it, so a generated response model that
            omitted it could not describe them.
        registrationMode:
          $ref: '#/components/schemas/SipTrunkRegistrationMode'
        registrationExpires:
          type: integer
          minimum: 60
          maximum: 300
          description: How long a binding lasts, in seconds, before the phone system must refresh it.
        localization:
          $ref: '#/components/schemas/SipTrunkLocalization'
        aniFormat:
          $ref: '#/components/schemas/SipTrunkAniFormat'
        dnisFormat:
          $ref: '#/components/schemas/SipTrunkDnisFormat'
        dialPolicy:
          $ref: '#/components/schemas/SipTrunkDialPolicy'
        mediaMode:
          $ref: '#/components/schemas/SipTrunkMediaMode'
        codecs:
          type: array
          minItems: 1
          description: |
            The codecs the trunk offers, **in preference order**. The order is the field's meaning,
            so nothing sorts or de-duplicates it.
          items:
            type: string
            enum: [PCMU, PCMA, G722]
        registration:
          $ref: '#/components/schemas/SipTrunkRegistration'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    SipTrunkRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
        callerIdOverride:
          $ref: '#/components/schemas/RelationshipToOne'
        emergencyCallerId:
          $ref: '#/components/schemas/RelationshipToOne'
        sipTrunkIps:
          $ref: '#/components/schemas/RelationshipToMany'
        sipTrunkTargets:
          $ref: '#/components/schemas/RelationshipToMany'
    SipTrunkResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [sip-trunks] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/SipTrunkAttributes'
        relationships:
          $ref: '#/components/schemas/SipTrunkRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    SipTrunkDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SipTrunkResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SipTrunkResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkWritableAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        domainLabel: { type: string, pattern: '^[a-z][a-z0-9-]{2,62}$' }
        primaryRegion: { type: string, enum: [use1, usw1] }
        enabled: { type: boolean }
        mode:
          $ref: '#/components/schemas/SipTrunkMode'
        username: { type: [string, 'null'] }
        password: { type: [string, 'null'], minLength: 8 }
        registrationMode:
          $ref: '#/components/schemas/SipTrunkRegistrationMode'
        registrationExpires: { type: integer, minimum: 60, maximum: 300 }
        localization:
          $ref: '#/components/schemas/SipTrunkLocalization'
        aniFormat:
          $ref: '#/components/schemas/SipTrunkAniFormat'
        dnisFormat:
          $ref: '#/components/schemas/SipTrunkDnisFormat'
        dialPolicy:
          $ref: '#/components/schemas/SipTrunkDialPolicy'
        mediaMode:
          $ref: '#/components/schemas/SipTrunkMediaMode'
        codecs:
          type: array
          minItems: 1
          items: { type: string, enum: [PCMU, PCMA, G722] }
    # A FLAT OBJECT, NOT AN `allOf` OVER THE WRITABLE SCHEMA: a TypedDict cannot re-require an
    # inherited key; both generators want a flat object here.
    SipTrunkCreateAttributes:
      type: object
      required: [name, domainLabel, primaryRegion, mode]
      properties:
        name: { type: string, maxLength: 64 }
        domainLabel: { type: string, pattern: '^[a-z][a-z0-9-]{2,62}$' }
        primaryRegion: { type: string, enum: [use1, usw1] }
        enabled: { type: boolean }
        mode:
          $ref: '#/components/schemas/SipTrunkMode'
        username: { type: [string, 'null'] }
        password: { type: [string, 'null'], minLength: 8 }
        registrationMode:
          $ref: '#/components/schemas/SipTrunkRegistrationMode'
        registrationExpires: { type: integer, minimum: 60, maximum: 300 }
        localization:
          $ref: '#/components/schemas/SipTrunkLocalization'
        aniFormat:
          $ref: '#/components/schemas/SipTrunkAniFormat'
        dnisFormat:
          $ref: '#/components/schemas/SipTrunkDnisFormat'
        dialPolicy:
          $ref: '#/components/schemas/SipTrunkDialPolicy'
        mediaMode:
          $ref: '#/components/schemas/SipTrunkMediaMode'
        codecs:
          type: array
          minItems: 1
          items: { type: string, enum: [PCMU, PCMA, G722] }
    SipTrunkCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { type: string, enum: [sip-trunks] }
            attributes:
              $ref: '#/components/schemas/SipTrunkCreateAttributes'
            relationships:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    SipTrunkUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [sip-trunks] }
            id: { type: string, format: uuid }
            attributes:
              $ref: '#/components/schemas/SipTrunkWritableAttributes'

    # -- sip-trunk-ips -----------------------------------------------------------------------------
    SipTrunkIpAttributes:
      type: object
      properties:
        cidr:
          type: string
          description: |
            An IPv4 address or a CIDR block from /8 to /32. A bare address is stored, and read back,
            as its /32.
        description:
          type: [string, 'null']
          maxLength: 64
          description: Your own note about the address — "Dallas office".
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    SipTrunkIpRelationships:
      type: object
      properties:
        sipTrunk:
          $ref: '#/components/schemas/RelationshipToOne'
    SipTrunkIpResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [sip-trunk-ips] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/SipTrunkIpAttributes'
        relationships:
          $ref: '#/components/schemas/SipTrunkIpRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    SipTrunkIpDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SipTrunkIpResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkIpCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SipTrunkIpResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkIpWritableAttributes:
      type: object
      properties:
        cidr: { type: string }
        description: { type: [string, 'null'], maxLength: 64 }
    SipTrunkIpCreateAttributes:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string }
        description: { type: [string, 'null'], maxLength: 64 }
    SipTrunkIpCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { type: string, enum: [sip-trunk-ips] }
            attributes:
              $ref: '#/components/schemas/SipTrunkIpCreateAttributes'
            relationships:
              type: object
              required: [sipTrunk]
              properties:
                sipTrunk:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    SipTrunkIpUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [sip-trunk-ips] }
            id: { type: string, format: uuid }
            attributes:
              $ref: '#/components/schemas/SipTrunkIpWritableAttributes'

    # -- sip-trunk-targets -------------------------------------------------------------------------
    SipTrunkTargetAttributes:
      type: object
      properties:
        host:
          type: string
          maxLength: 253
          description: An IPv4 literal or a hostname.
        port:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
          description: |
            **Blank is a meaning, not a missing value**: `null` resolves the host through DNS SRV, and
            naming a port disables that lookup.
        transport:
          $ref: '#/components/schemas/SipTrunkTransport'
        preference:
          type: integer
          minimum: 0
          maximum: 1000
          description: |
            Ascending — the lowest is tried first, and destinations sharing a preference ring at the
            same time.
        enabled:
          type: boolean
          description: |
            A parked destination stays in the list and out of the failover set, which is how a
            maintenance window is expressed.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    SipTrunkTargetRelationships:
      type: object
      properties:
        sipTrunk:
          $ref: '#/components/schemas/RelationshipToOne'
    SipTrunkTargetResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [sip-trunk-targets] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/SipTrunkTargetAttributes'
        relationships:
          $ref: '#/components/schemas/SipTrunkTargetRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    SipTrunkTargetDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SipTrunkTargetResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkTargetCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SipTrunkTargetResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    SipTrunkTargetWritableAttributes:
      type: object
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        transport:
          $ref: '#/components/schemas/SipTrunkTransport'
        preference: { type: integer, minimum: 0, maximum: 1000 }
        enabled: { type: boolean }
    SipTrunkTargetCreateAttributes:
      type: object
      required: [host, transport, preference, enabled]
      properties:
        host: { type: string, maxLength: 253 }
        port: { type: [integer, 'null'], minimum: 1, maximum: 65535 }
        transport:
          $ref: '#/components/schemas/SipTrunkTransport'
        preference: { type: integer, minimum: 0, maximum: 1000 }
        enabled: { type: boolean }
    SipTrunkTargetCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { type: string, enum: [sip-trunk-targets] }
            attributes:
              $ref: '#/components/schemas/SipTrunkTargetCreateAttributes'
            relationships:
              type: object
              required: [sipTrunk]
              properties:
                sipTrunk:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    SipTrunkTargetUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [sip-trunk-targets] }
            id: { type: string, format: uuid }
            attributes:
              $ref: '#/components/schemas/SipTrunkTargetWritableAttributes'
    CallDirection:
      type: [string, 'null']
      description: |
        Which way the call went. `inbound` covers both an answered and a missed inbound call — read
        `disposition` for that half. `internal` is a call that stayed inside one domain: extension
        to extension, a call to voicemail, or a call into a conference. A call between two of your
        customers' domains is not `internal` — it is recorded twice, `outbound` on the caller's side
        and `inbound` on the called side.

        The phone system records ONE integer carrying both this and `disposition`; an integer we have
        no word for is published as its own digits rather than as null, so a vocabulary that grows at
        the switch's end never erases a call.
      enum: [inbound, outbound, internal]
    CallDisposition:
      type: [string, 'null']
      description: Whether anybody answered. Derived from the same integer as `direction`.
      enum: [answered, missed]
    # -- Click-to-dial (POST /v1/pbx/subscribers/{subscriber}/calls) -------------------------------
    PbxCallRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [calls] }
            attributes:
              $ref: '#/components/schemas/PbxCallRequestAttributes'
    PbxCallRequestAttributes:
      type: object
      required: [destination]
      properties:
        destination:
          type: string
          description: |
            Who to call: an E.164 number with its `+`, or an extension of 2 to 7 digits on the
            user's own domain. The phone system completes an extension against that domain itself.
          examples: ['+13025046250', '2002']
        callerId:
          type: [string, 'null']
          description: |
            The number the called party sees. E.164, with or without the `+`; a ten-digit North
            American number is also accepted and answered with its country code, because this
            platform stores every caller ID as E.164 **without** the plus. A value that is not a
            telephone number is refused rather than ignored. Omit it to use the user's own caller ID.
          examples: ['+14074366118', '4074366118']
        autoAnswer:
          type: boolean
          default: false
          description: Ask the user's own phone to go off-hook by itself instead of ringing.
        device:
          type: [string, 'null']
          description: |
            Which of the user's registered devices to call from — a `devices` id. It MUST belong to
            this user; one that does not is a 422 pointing at `/data/attributes/device`. Omit it to
            let the phone system ring the user's devices as it normally would.
          format: uuid
    PbxCallAttributes:
      type: object
      description: |
        The call as it was requested. Every value is what was actually sent to the phone system,
        which is not always what was typed: `callerId` comes back in the spelling the called party
        will see.
      properties:
        destination: { type: string, description: 'Who was called, as sent.' }
        callerId:
          type: [string, 'null']
          description: 'The number presented, E.164 without the `+`. Null when the user''s own was used.'
        autoAnswer: { type: boolean }
        device:
          type: [string, 'null']
          description: 'The `devices` id the call originates from, as sent. Null when none was named.'
        status:
          type: string
          enum: [requested]
          description: |
            Always `requested` from this endpoint: it is the REQUEST's state, not the call's, because
            the phone system has taken the command and nothing about the call is knowable yet. Find
            the call's records with `filter[callId]` on `/v1/pbx/call-records`.
        requestedAt: { type: string, format: date-time }
    PbxCallResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [calls] }
        id:
          type: string
          format: uuid
          description: |
            Minted by this API before the call was placed, and handed to the phone system as the SIP
            Call-ID it places the call under. It names the call on the PHONE SYSTEM, and
            `filter[callId]` on `/v1/pbx/call-records` finds the records the call wrote — whose own
            ids come from the CDR row instead.
        attributes:
          $ref: '#/components/schemas/PbxCallAttributes'
    PbxCallDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PbxCallResource'
    PbxSubscriberAttributes:
      type: object
      description: |
        A subscriber on a customer's phone system — a person or a machine; `kind` says which. Every
        field is read-only: this API does not write the phone system, and the write surface answers
        with a change INTENT rather than an update.
      properties:
        user: { type: [string, 'null'], description: 'The extension.' }
        domain: { type: [string, 'null'], description: 'The customer''s PBX domain.' }
        displayName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        scope: { type: [string, 'null'], description: 'The phone system''s own permission tier for this person.' }
        group: { type: [string, 'null'] }
        site: { type: [string, 'null'] }
        presence:
          type: [string, 'null']
          description: |
            The phone system's own presence word, verbatim. There is deliberately no derived
            `online` flag: the vocabulary is longer than two states and which words mean "available"
            is yours to decide, not ours to freeze into this contract.
        callerIdNumber: { type: [string, 'null'] }
        callerIdName: { type: [string, 'null'] }
        timeZone: { type: [string, 'null'] }
        createdAt:
          type: [string, 'null']
          description: |
            As the phone system stores it — TEXT, not RFC 3339. It is served unparsed because the
            switch has never published the format, and a mis-parse would be silent.
        updatedAt: { type: [string, 'null'], description: 'As the phone system stores it.' }
        kind:
          $ref: '#/components/schemas/PbxSubscriberKind'
    PbxSubscriberKind:
      type: string
      description: |
        What this subscriber is, derived on every read from the phone system's own markers. `user`
        is a person. `domain` is the domain's settings template, never a phone. `system` is any
        machine this API has no word for yet: an unknown marker is never read as `user`, so a
        `filter[kind]=user` list cannot gain a machine. New words may be added; read an unknown word
        as `system`.
      enum: [user, autoAttendant, callQueue, aiAgent, conference, department, site, ringGroup, trunk, timeOfDay, domain, system]
    PbxSubscriberRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
        devices:
          $ref: '#/components/schemas/RelationshipToMany'
    PbxSubscriberResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [subscribers] }
        id:
          type: string
          format: uuid
          description: |
            Stable for the life of the subscriber: it is computed from the extension and the domain,
            so it is the same id in every region and will not change when this data moves to its
            permanent home.
        attributes:
          $ref: '#/components/schemas/PbxSubscriberAttributes'
        relationships:
          $ref: '#/components/schemas/PbxSubscriberRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    PbxSubscriberDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PbxSubscriberResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PbxSubscriberCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PbxSubscriberResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PbxDeviceAttributes:
      type: object
      description: |
        One REGISTRATION, not one handset: the row exists because something sent a SIP REGISTER, and
        it disappears when nothing does.
      properties:
        aor: { type: [string, 'null'], description: 'The address of record that registered.' }
        user: { type: [string, 'null'], description: 'The subscriber''s extension.' }
        domain: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        userAgent: { type: [string, 'null'], description: 'What the phone said it is.' }
        contact: { type: [string, 'null'] }
        transport: { type: [string, 'null'] }
        receivedFrom: { type: [string, 'null'], description: 'The address the registration arrived from.' }
        registeredAt: { type: [string, 'null'], description: 'As the phone system stores it — text, not RFC 3339.' }
        registrationExpiresAt: { type: [string, 'null'], description: 'As the phone system stores it.' }
        registered:
          type: boolean
          description: Derived — is `registrationExpiresAt` still in the future?
        autoAnswer: { type: boolean }
        createdAt: { type: [string, 'null'], description: 'As the phone system stores it.' }
    PbxDeviceRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
        subscriber:
          $ref: '#/components/schemas/RelationshipToOne'
    PbxDeviceResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [devices] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/PbxDeviceAttributes'
        relationships:
          $ref: '#/components/schemas/PbxDeviceRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    PbxDeviceDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PbxDeviceResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    PbxDeviceCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PbxDeviceResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    CallRecordAttributes:
      type: object
      description: |
        One call, as the phone system recorded it.

        **Two tiers.** Everything down to `hidden` is the STANDARD set and is on every response. The
        fields after it are EXTENDED — the phone system's own raw values — and are served only when
        you name them in `fields[call-records]`. See that parameter for the syntax.

        **The three instants are RFC 3339 in UTC**, ending in `Z`. The switch stores them as Unix
        epochs, which is the one timestamp shape that carries no zone ambiguity.

        **A field that does not apply is `null`, never an empty string.** A missed call has a null
        `answeredAt`; a call with no caller ID has a null `fromNumber`.

        **A `*Number` field is E.164 or nothing.** `fromNumber`, `toNumber` and `dialedNumber` carry
        `+14075550101` or null — never an extension, a dial code or a star code. Those are not
        telephone numbers, and a field named for a number must not carry one. An extension is in
        `fromExtension`, `routedByExtension` or `answeringExtension`; the raw value the switch wrote
        is in the extended tier. So you can group, join and de-duplicate on these three without
        checking their shape first.
      properties:
        direction:
          $ref: '#/components/schemas/CallDirection'
        disposition:
          $ref: '#/components/schemas/CallDisposition'
        tenantId:
          type: [string, 'null']
          format: uuid
          description: The reseller this call log was read as.
        domain: { type: [string, 'null'], description: "The phone system domain the call is on." }
        territory: { type: [string, 'null'], description: "The phone system territory the domain belongs to." }
        fromNumber:
          type: [string, 'null']
          description: |
            **Who called**, in E.164. Read `direction` to know what it names:

            - `inbound` — the **outside caller's** number.
            - `outbound` and `internal` — the **caller ID your customer sent**.

            Null when the calling party had no telephone number at all, which is the ordinary case on
            an extension-to-extension call and on an extension with no caller ID configured. The
            extension itself is `fromExtension`.
          example: '+17406495415'
        fromExtension:
          type: [string, 'null']
          description: |
            The extension that placed the call. Null on every inbound call — an outside caller is not
            a subscriber of the phone system.
          example: '101'
        fromName: { type: [string, 'null'], description: "The caller-ID name, as the switch recorded it." }
        toNumber:
          type: [string, 'null']
          description: |
            **The number the call was placed to**, in E.164 — on an inbound call the DID the outside
            caller dialled, on an outbound call the number your customer rang.

            It is what the caller **asked for**, not where the call ended up. Where it finally landed
            after forwarding, hunting or voicemail is `terminatedTo` in the extended tier, and on a
            forwarded call the two differ. Null when nothing telephone-shaped was dialled.
          example: '+17402084385'
        dialedNumber:
          type: [string, 'null']
          description: |
            **What was actually dialled**, in E.164 — kept beside `toNumber` because the dial plan
            rewrites what a user types. Seven-digit and ten-digit dialling both reach the same
            destination as an eleven-digit one, so the two fields agree on most calls and differ on
            those.

            Null when what was typed cannot be read as a telephone number with certainty — a
            seven-digit local dial names no area code, so it has no E.164 spelling we can be sure
            of. `rawRequestUser` in the extended tier has the digits as typed.
          example: '+14075550101'
        routedByExtension:
          type: [string, 'null']
          description: |
            The first extension the call landed on — the queue, hunt group or forwarding extension
            whose rule fired. Null when the call simply rang its destination.
          example: '500'
        answeringExtension:
          type: [string, 'null']
          description: |
            The extension the call terminated at. On a queue dispatch this is the agent who answered,
            not the queue. On a forwarded call it stays the forwarding extension, and `terminatedTo`
            is where the call actually went.
          example: '101'
        startedAt: { type: [string, 'null'], format: date-time, example: '2026-09-12T14:00:00Z' }
        answeredAt:
          type: [string, 'null']
          format: date-time
          description: Null when nobody answered.
          example: '2026-09-12T14:00:04Z'
        releasedAt: { type: [string, 'null'], format: date-time, example: '2026-09-12T14:01:04Z' }
        durationSeconds: { type: [integer, 'null'], description: 'Seconds, end to end.' }
        talkSeconds: { type: [integer, 'null'], description: 'Seconds anybody was actually talking.' }
        releaseCode:
          type: [string, 'null']
          description: The phone system's own code for how the call ended.
          example: end
        releaseText:
          type: [string, 'null']
          description: The phone system's own sentence for how the call ended.
          example: 'Orig: Bye'
        hasRecording:
          type: boolean
          description: |
            Is a recording held for this call? Existence only in this release — the media endpoint
            that hands the audio back is a later one.
        hidden: { type: boolean, description: 'Does the phone system hide this record from its own call log?' }
        vendorId:
          type: [string, 'null']
          description: |
            EXTENDED. The phone system's own id for the call — the first thing a support desk asks
            you to quote.
          example: 20260912000000000001c0ffee0123456789abcdef
        origCallId:
          type: [string, 'null']
          description: EXTENDED. The SIP Call-ID of the originating leg.
        termCallId:
          type: [string, 'null']
          description: EXTENDED. The SIP Call-ID of the terminating leg.
        byAction:
          type: [string, 'null']
          description: |
            EXTENDED. Which feature produced `routedByExtension` — for example `QueueSDispatch`,
            `ForwardAlways` or `ForwardNoAns`.
          example: ForwardNoAns
        terminatedTo:
          type: [string, 'null']
          description: |
            EXTENDED. Where the call LANDED after the dial plan, exactly as the switch wrote it. Often
            not a telephone number: an internal `sip:106@acme.example`, a carrier URI for a forward
            off-net, or the literal `VMail` when the call dropped to voicemail.
          example: sip:106@acme.example
        codec: { type: [string, 'null'], description: 'EXTENDED. The audio codec.', example: PCMU }
        hostname:
          type: [string, 'null']
          description: EXTENDED. The switch host that wrote the record.
        rawFromUri:
          type: [string, 'null']
          description: EXTENDED. The originating SIP URI, as the switch recorded it.
          example: sip:+17406495415@carrier.example
        rawFromUser:
          type: [string, 'null']
          description: EXTENDED. The originating user part, as the switch recorded it.
          example: '17406495415'
        rawToUser:
          type: [string, 'null']
          description: |
            EXTENDED. The dialled user part, in whichever spelling the switch recorded — the same
            switch writes both `5132935243` and `18884339987` here. Use `toNumber` to compare calls.
          example: '17402084385'
        rawRequestUser:
          type: [string, 'null']
          description: EXTENDED. What was dialled, as the switch recorded it.
          example: '17402084385'
    CallRecordRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
        fromSubscriber:
          $ref: '#/components/schemas/RelationshipToOne'
        toSubscriber:
          $ref: '#/components/schemas/RelationshipToOne'
    CallRecordResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [call-records] }
        id:
          type: string
          format: uuid
          description: |
            Computed from the month, the domain and the switch's own call id, so two calls in two
            months can never share one even if the switch reuses its id.
        attributes:
          $ref: '#/components/schemas/CallRecordAttributes'
        relationships:
          $ref: '#/components/schemas/CallRecordRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    RecordingAttributes:
      type: object
      properties:
        ccc-id:
          type: string
          description: Which capture of the call this is — the phone system's own capture id.
          example: 00b1
        duration:
          type: [integer, 'null']
          description: |
            How long the audio runs, in seconds. NULL when the phone system did not report a
            duration for the capture — the recording is still ours to serve, and `byte-size` still
            describes the bytes. Do not read a null as a missing recording.
        byte-size:
          type: integer
          description: The size of the audio behind `content-url`.
        sha256:
          type: string
          description: |
            The SHA-256 of the audio, so you can check a download against what we recorded. A
            supersede changes it — see `superseded` before treating a mismatch as corruption.
        superseded:
          type: boolean
          description: |
            False on a first capture, true once a longer capture of the same call has replaced the
            audio behind this id. The id does not change; the duration, size and digest do.
        content-url:
          type: string
          format: uri
          description: |
            A time-limited download URL on your own API host. Fetch it with a plain `GET` and no
            `Authorization` header — the signature it carries is the authorization. Opaque: the
            signature covers the whole address, so any edit invalidates it. Short-lived — do not
            cache it past `expires-at` or share it.
        expires-at:
          type: string
          format: date-time
          description: When `content-url` stops working. Ask for the list again to mint a fresh one.
    RecordingResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [recordings] }
        id:
          type: string
          format: uuid
          description: |
            Derived from the phone system's own `(call id, capture id)`, so it is the same id in
            every region and never changes — a supersede reuses it.
        attributes:
          $ref: '#/components/schemas/RecordingAttributes'
    RecordingCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: |
            One item per capture of the call, in vendor key order `(call_id, ccc_id)` — the phone
            system's own primary key, which is total, and NOT chronological across legs. NOT PAGED —
            this is the captures of one call rather than a walk over a table, so there are no page
            parameters and no `meta.page`.
          items:
            $ref: '#/components/schemas/RecordingResource'
    TranscriptSegment:
      type: object
      required: [speaker, start, end, text]
      properties:
        speaker:
          type: string
          description: |
            Who was speaking, as a label rather than an identity: `Speaker 1`, `Speaker 2`, and so
            on. It comes from the speech-to-text provider's own separation of voices (or of the two
            sides of a stereo capture), so it is stable WITHIN one transcript and means nothing
            across two — `Speaker 1` on one call is not `Speaker 1` on another.
          example: Speaker 1
        start:
          type: number
          format: double
          description: When this turn begins, in seconds from the start of the recording.
        end:
          type: number
          format: double
          description: When this turn ends, in seconds from the start of the recording.
        text:
          type: string
          description: What was said in this turn.
    TranscriptAttributes:
      type: object
      # NOT A CLOSED SET, and the one member that proves it is `segments`: the single-transcript
      # endpoint composes this schema with it (`TranscriptWithSegmentsAttributes`), so a validator
      # that treated these ten as the whole of a transcript's attributes would reject that
      # endpoint's own response. Redocly's example check is such a validator.
      unevaluatedProperties: true
      properties:
        ccc-id:
          type: string
          description: Which capture of the call this transcript is of — the phone system's own capture id.
          example: 00b1
        status:
          type: string
          enum: [ready, pending]
          description: |
            `ready` when we hold the words, `pending` when that capture has no transcript yet — in
            which case every member below is null. Transcription runs after the audio has finished
            uploading, so a call recorded a moment ago is normally `pending` for a few minutes. There
            is no `failed` here: telling a permanent failure from a wait costs a lookup, so only the
            single-transcript endpoint pays for it, and it reports it as a 404 with
            `code: transcript_failed`.
        language:
          type: [string, 'null']
          description: The language the audio was transcribed as. Null while `status` is `pending`.
          example: en-US
        duration:
          type: [integer, 'null']
          description: |
            How long the AUDIO runs, in seconds — not how long the text is. Null while `status` is
            `pending`, and null when the phone system never reported a duration for the capture.
        byte-size:
          type: [integer, 'null']
          description: |
            The size of the document behind `content-url`, which is the speech-to-text provider's
            gzipped response — NOT the audio. Not comparable with `byte-size` on the recordings list.
            Null while `status` is `pending`.
        sha256:
          type: [string, 'null']
          description: |
            The SHA-256 of that same document, so you can check a download against what we stored.
            Null while `status` is `pending`.
        provider:
          type: [string, 'null']
          description: Which speech-to-text service produced this transcript. Null while `status` is `pending`.
          example: deepgram
        model:
          type: [string, 'null']
          description: Which of that service's models produced it. Null while `status` is `pending`.
          example: nova-3
        content-url:
          type: [string, 'null']
          format: uri
          description: |
            A time-limited download URL on your own API host for the provider's own response
            document. Fetch it with a plain `GET` and no `Authorization` header — the signature it
            carries is the authorization. Opaque: the signature covers the whole address, so any edit
            invalidates it. Short-lived — do not cache it past `expires-at` or share it. Null while
            `status` is `pending`.
        expires-at:
          type: [string, 'null']
          format: date-time
          description: When `content-url` stops working. Ask for the list again to mint a fresh one.
    TranscriptResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [transcripts] }
        id:
          type: string
          format: uuid
          description: |
            The RECORDING's id — a transcript is keyed by the capture it is of, one to one — so it is
            the same id the recordings list publishes and the same id in every region.
        attributes:
          $ref: '#/components/schemas/TranscriptAttributes'
    TranscriptWithSegmentsAttributes:
      description: |
        Everything `TranscriptAttributes` carries, plus the turns.
      # COMPOSED HERE, INSIDE `attributes`, and never by overriding the `attributes` PROPERTY on a
      # resource that already declares it — see `TranscriptWithSegmentsResource` below for what that
      # cost. This `allOf` only ADDS a member to the set, which every generator models as an
      # ordinary extension.
      allOf:
        - $ref: '#/components/schemas/TranscriptAttributes'
        - type: object
          properties:
            segments:
              type: array
              description: |
                The turns of the conversation, in the order they were spoken. An EMPTY array is a
                real answer: nobody spoke, or the provider heard nothing it could separate into
                turns.
              items:
                $ref: '#/components/schemas/TranscriptSegment'
    TranscriptWithSegmentsResource:
      description: |
        A transcript as the single-transcript endpoint serves it: everything the list carries, plus
        the turns. `segments` is the one member the list leaves out, because deriving the turns means
        reading the stored document and the list would pay that per capture.
      # THIS COMPOSES TWO ANONYMOUS PARTS, and it does NOT `allOf` `TranscriptResource`, which is
      # what it used to do. Both halves of that shape are load-bearing, and each is owed to a gate
      # that the other one breaks:
      #
      # NOT `allOf: [TranscriptResource, {attributes: …}]`, because that narrows the INHERITED
      # `attributes` property to a different type. A generator models it as a subclass re-declaring
      # a mutable member, and a mutable member's type is invariant — so it reached the Ringivo
      # Python SDK as `"attributes" overrides symbol of same name in class "TranscriptResource"`
      # and red CI, while this repo's own generator smokes stayed green and could not see it
      # (Ringivo/ringivo-python #77, 2026-09-22).
      #
      # NOT a plain `type: object` spelling it all out either, however much cleaner that reads: a
      # top-level `properties.type.enum` is exactly how `openApiResourceAttributes()` recognises a
      # resource schema, so a second one pinning `transcripts` trips its "two schemas pin the
      # resource type" guard — the guard that stops layer 3 comparing a request against whichever
      # attribute set was written last. Under `allOf` this schema has no top-level `properties`, so
      # it stays what it has always been to that check: invisible, with `TranscriptResource` the one
      # schema that pins the type.
      #
      # NOTHING ON THE WIRE CHANGED. The old and new spellings were fully dereferenced and
      # allOf-merged and the normalised documents are byte-identical. Keep `type` and `id` below in
      # step with `TranscriptResource` by hand — they are one contract in two places, which is the
      # price of the composition that satisfies both gates.
      allOf:
        - type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [transcripts] }
            id:
              type: string
              format: uuid
              description: |
                The RECORDING's id — a transcript is keyed by the capture it is of, one to one — so
                it is the same id the recordings list publishes and the same id in every region.
        - type: object
          properties:
            attributes:
              $ref: '#/components/schemas/TranscriptWithSegmentsAttributes'
    TranscriptCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: |
            One item per capture of the call, in vendor key order `(call_id, ccc_id)` — the phone
            system's own primary key, which is total, and NOT chronological across legs. NOT PAGED —
            this is the captures of one call rather than a walk over a table, so there are no page
            parameters and no `meta.page`.
          items:
            $ref: '#/components/schemas/TranscriptResource'
    TranscriptDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TranscriptWithSegmentsResource'
    CallRecordDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CallRecordResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    CallRecordCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CallRecordResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
