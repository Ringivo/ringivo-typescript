    # -- The outbound webhook body -----------------------------------------------------------------
    FaxEventData:
      type: object
      description: |
        A SNAPSHOT of the fax, frozen when the transition happened — not a fresh read. A retry six
        hours later carries the same values, so a `fax.sending` event never says `delivered`.

        **No document content, no object keys and no URLs.** A webhook body travels to a third party
        over the public internet and is stored in their logs. Fetch the pages with your own
        credential at `GET /v1/faxes/{fax}/media`, which is also what records who looked.
      properties:
        id: { type: string, format: uuid }
        fax_account_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        customer_id: { type: [string, 'null'], format: uuid }
        direction:
          $ref: '#/components/schemas/FaxDirection'
        status:
          $ref: '#/components/schemas/FaxStatus'
        failure_code:
          $ref: '#/components/schemas/FaxFailureCode'
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        pages_total: { type: [integer, 'null'] }
        pages_transferred: { type: [integer, 'null'] }
        partial: { type: [boolean, 'null'] }
        attempt_count: { type: [integer, 'null'] }
        client_reference: { type: [string, 'null'] }
        tags:
          $ref: '#/components/schemas/Tags'
        created_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    FaxReceivedEventData:
      allOf:
        - $ref: '#/components/schemas/FaxEventData'
        - type: object
          properties:
            render_failed:
              type: boolean
              description: |
                Always present, never conditional. `true` means the fax is real and its metadata is
                complete, and only the rendered document is missing.
    WebhookEventEnvelope:
      type: object
      description: |
        The envelope every outbound webhook body shares. `data` is added by the event schema that
        uses it — see `FaxEvent`.

        ## Verify the signature before you trust it

        Every delivery carries a `Ringivo-Signature` header:

        ```
        Ringivo-Signature: t=1755331200,v1=9f86d0…,v1=2c26b4…
        ```

        `t` is the Unix second the delivery was signed. Each `v1` is
        `HMAC-SHA256(secret, "<t>.<raw body>")` in lowercase hex. To verify: recompute the MAC over
        `"<t>.<raw body>"` with your `whsec_` secret, compare it to each `v1` in **constant time**,
        and reject anything whose `t` is more than **300 seconds** from your own clock. Both halves
        must pass — a good MAC with an old `t` is a replay, and a fresh `t` with no matching MAC is
        a forgery.

        **Sign the RAW BODY, never a re-encoding.** Parsing the JSON and re-encoding it before
        verifying WILL fail, and correctly so: key order, unicode escaping and number formatting are
        free choices no two encoders make identically. This is the commonest mistake with
        signatures of this shape.

        **A second `v1` appears only during a rotation's 24-hour grace window**, signed with the
        previous secret, newest first — so a receiver that checks only the first one validates
        against the secret we want it to hold.

        ## Delivery is at-least-once

        Dedupe on `event_id`: a retried delivery of the same event carries the same id, and two
        genuine transitions never share one. A failed delivery is retried after **10s, 1m, 5m, 30m,
        2h and 6h** — seven POSTs in all, the last about eight and three-quarter hours after the
        event — and then dead-lettered. Ask
        `GET /v1/webhook-deliveries?filter[status]=dead` for what you missed.

        Answer any 2XX to accept. Redirects are never followed. We wait ten seconds; if your handler
        needs longer, answer 202 and do the work afterwards.
      required: [event_id, type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: The dedupe key.
        type:
          $ref: '#/components/schemas/WebhookEventType'
        occurred_at:
          type: string
          format: date-time
          description: |
            When the transition happened — captured at the event, not at delivery, so a retry does
            not claim the fax was delivered when we finally reached you.
    # The envelope and the payload are composed here rather than the envelope carrying a `data` of
    # its own that each event overrides. Two `properties: {data: …}` in one `allOf` are BOTH applied
    # — the narrower one does not replace the wider one — so `fax.received`'s extra member reads as
    # an unevaluated property of the base payload and lint reds on the example. Probed 2026-08-18.
    FaxEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxEventData'
    FaxReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxReceivedEventData'

    # -- Number lookups (one composite dip, nothing stored) ---------------------------------------
    #
    # No `type`/`id` and no `links` anywhere below, deliberately: a lookup is a computed answer with
    # no stored member behind it, so there is nothing for a `self` link to address. Giving it a
    # synthetic id would publish a URL a generated client is entitled to follow and nothing can
    # answer.
    NumberLookupRequest:
      type: object
      required: [number]
      properties:
        number:
          type: string
          maxLength: 32
          description: |
            The number to look up. 10 digits, or 11 beginning with `1`; punctuation and spaces are
            ignored, so `(650) 253-0000` and `+16502530000` are the same request.
      # There is no tenant field, and there is no way to add one: a lookup is always billed to the
      # account the credential belongs to.
      additionalProperties: false
    NumberLookupDipStatus:
      type: string
      description: |
        What one component did. `no_data` and `failed` both carry `data: null` and mean different
        things — see the operation description.
      enum: [answered, no_data, failed]
    DialedNumberGeography:
      type: object
      description: |
        Where the number you asked about is nominally from, from our own copy of LERG. **Not the
        LRN's** rate center, which is a different fact and lives under `components.lrn`.
      required: [rateCenter, state]
      properties:
        rateCenter:
          type: [string, 'null']
          description: Null for a toll-free number, which has no rate center. Absent, not missing.
        state:
          type: [string, 'null']
          description: Two-letter state or province code. Null for a toll-free number.
    LrnFacts:
      type: object
      description: The porting facts — who the number routes to now, and who owns its block.
      required:
        [lrn, spid, ocn, lata, lec, lineType, rateCenter, state, jurisdiction, local, portedAt]
      properties:
        lrn:
          type: string
          description: The location routing number, 11 digits.
        spid:
          type: [string, 'null']
          maxLength: 4
          description: |
            Who the number is ported to **now** — this is the one porting cares about. A string,
            never a number: values like `506J` exist.
        ocn:
          type: [string, 'null']
          maxLength: 4
          description: Who owns the number block. Often differs from `spid`. A string, never a number.
        lata:
          type: [string, 'null']
        lec:
          type: [string, 'null']
          description: The carrier's full name, as the source spells it.
        lineType:
          type: [string, 'null']
          description: |
            `CLEC`, `WIRELESS`, `ILEC`. This is what the **network** says. It is not what a losing
            carrier's bill says, and it must not be used to correct a port order's number type.
        rateCenter:
          type: [string, 'null']
          description: The **LRN's** rate center — not the dialed number's. The two often differ.
        state:
          type: [string, 'null']
          description: The **LRN's** state or province code.
        jurisdiction:
          type: [string, 'null']
          description: |
            A string, not a boolean — commonly the literal `INDETERMINATE`, which is not false.
        local:
          type: [string, 'null']
          description: A string, not a boolean, for the same reason as `jurisdiction`.
        portedAt:
          type: [string, 'null']
          format: date-time
          description: When the number last ported. Null if it never has.
    CallerNameFacts:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 15
          description: |
            The name the number presents, as the carrier spells it — uppercase, up to 15 characters.
    MessagingFacts:
      type: object
      description: Whether the number can carry text messages, and who carries them.
      required: [enabled, provider, country, countryCode]
      properties:
        enabled:
          type: boolean
          description: |
            Whether the number is enabled for messaging. **`false` means it cannot receive messages**
            — it never means "we do not know", which arrives as `status: no_data` with this whole
            object null.
        provider:
          type: [string, 'null']
          description: The messaging carrier's name.
        country:
          type: [string, 'null']
        countryCode:
          type: [string, 'null']
    NumberLookupLrnComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/LrnFacts'
            - type: 'null'
    NumberLookupCallerNameComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/CallerNameFacts'
            - type: 'null'
    NumberLookupMessagingComponent:
      type: object
      required: [status, data]
      properties:
        status:
          $ref: '#/components/schemas/NumberLookupDipStatus'
        data:
          oneOf:
            - $ref: '#/components/schemas/MessagingFacts'
            - type: 'null'
    NumberLookupComponents:
      type: object
      description: |
        The three paid components. Each reports its own outcome and they fail independently — a
        lookup with two answers and one failure is normal, and is billed in full.
      required: [lrn, callerName, messaging]
      properties:
        lrn:
          $ref: '#/components/schemas/NumberLookupLrnComponent'
        callerName:
          $ref: '#/components/schemas/NumberLookupCallerNameComponent'
        messaging:
          $ref: '#/components/schemas/NumberLookupMessagingComponent'
    NumberLookup:
      type: object
      required: [number, lookedUpAt, charged, dialedNumber, components]
      properties:
        number:
          type: string
          description: The number that was looked up, normalized to E.164.
        lookedUpAt:
          type: string
          format: date-time
          description: |
            When the components ran — so you can tell "we asked and learned nothing" from "we never
            asked".
        charged:
          type: boolean
          description: |
            Whether this lookup was billed. True when any component answered; false only when every
            one of them failed.
        dialedNumber:
          $ref: '#/components/schemas/DialedNumberGeography'
        components:
          $ref: '#/components/schemas/NumberLookupComponents'
    NumberLookupResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/NumberLookup'
