webhooks:
  fax.received:
    post:
      tags: [Webhook endpoints]
      operationId: onFaxReceived
      summary: A fax arrived and is ready to read
      description: |
        Fired when an inbound fax has been rendered, not when the call ended — nearly every
        consumer's first act is to fetch the PDF, and the PDF does not exist until the render has
        run.

        **It fires on a failed render too, with `render_failed: true`.** That means the fax is real
        and its metadata is complete, and only the document is missing. A call that answered and
        turned out not to be a fax is NOT this event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaxReceivedEvent'
            example:
              event_id: 0198c4a1-a314-75d6-07d8-92031425364a
              type: fax.received
              occurred_at: '2026-08-16T11:02:31+00:00'
              data:
                id: 0198c4a1-2b3c-7d4e-8f50-1a2b3c4d5e6f
                fax_account_id: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                tenant_id: 0198c4a1-b425-76e7-18e9-031425364a5b
                customer_id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
                direction: inbound
                status: received
                failure_code: null
                from: '+13025556789'
                to: '+14075550100'
                region: use1
                pages_total: 3
                pages_transferred: 3
                partial: false
                attempt_count: 1
                client_reference: null
                tags: null
                created_at: '2026-08-16T11:02:20+00:00'
                completed_at: '2026-08-16T11:02:31+00:00'
                render_failed: false
      responses:
        '2XX':
          description: |
            Any 2XX means you accepted it. Nothing else is read — not the body, not a header. A 3XX
            is not a 2XX: redirects are never followed, and one is recorded as a failed attempt.
