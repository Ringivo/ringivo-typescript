                    pagesTotal: 3
                    pagesTransferred: 3
                    partial: false
                    attemptCount: 1
                    resolution: fine
                    clientReference: chart-4471
                    coverPage:
                      to_name: Dr Ruiz
                      subject: Records
                    read: false
                    archived: false
                    tags:
                      clinic: north
                    documents:
                      - kind: pdf
                        ordinal: 0
                        contentType: application/pdf
                        byteSize: 40960
                        sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                        pages: 3
