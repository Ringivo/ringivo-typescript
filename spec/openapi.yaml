        deliveries of **fax-account-scoped** endpoints; a delivery of a customer- or tenant-scoped
        endpoint answers **404** to a `fax:*` token and requires `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - name: include
          in: query
          required: false
          schema:
            type: string
