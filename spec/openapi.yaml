                attributes:
                  name: Front desk
                  status: suspended
      responses:
        '200':
          description: The updated account.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Fax accounts]
      operationId: deleteFaxAccount
      summary: Retire a fax account
      description: The account stops being listed; its record survives.
      security:
        - bearerAuth: [fax-accounts:write]
      responses:
        '204':
          description: Retired.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

