components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A bearer token minted at `POST /oauth/token` and short-lived — `expires_in: 900`,
        re-minted rather than refreshed.

        The scopes named on each operation are the FRONT DOOR — a credential's reach is decided
        separately, by which tenant or customer it was issued for. The four this platform
        publishes:

        - `fax:read` — read fax resources
        - `fax:write` — send and manage faxes
        - `webhooks:read` — read your webhook endpoints and their delivery history
        - `webhooks:write` — register, change and remove your webhook endpoints

        ## `fax:*` and `webhooks:*` are not interchangeable

        Several webhook operations list `webhooks:*` and `fax:*` as alternatives. **They do not
        reach the same endpoints.** A `fax:read`/`fax:write` token reaches only webhook endpoints
        whose `scopeType` is **`fax_account`** — registering a callback for an inbox you already
        administer is part of running that inbox. Endpoints scoped to a **customer** or to your
        whole **tenant** require `webhooks:read`/`webhooks:write`, and a `fax:*` token gets a
        **404** on one: not-yours reads exactly like no-such-endpoint, on every verb including
        `rotate-secret`. The same narrowing carries to `webhook-deliveries`, which borrow their
        endpoint's reach.

        So a fax integrator managing its own inbox needs no webhook scope; anything wider does.

  parameters:
    FaxId:
      name: fax
      in: path
      required: true
      description: The fax's id.
      schema: { type: string, format: uuid }
    FaxAccountId:
      name: faxAccount
      in: path
      required: true
      description: The fax account's id.
      schema: { type: string, format: uuid }
    WebhookEndpointId:
      name: webhookEndpoint
      in: path
      required: true
      description: The webhook endpoint's id.
      schema: { type: string, format: uuid }
    PageSize:
      name: page[size]
      in: query
      required: false
      description: |
        Rows per page. The default is 25 and the ceiling is 100. A size past the ceiling, or one
        that is not a positive whole number, is refused with a 400 whose error carries
        `meta: {page: {maxSize: 100}}` — never clamped, because a clamped page looks like a short
        one and a caller cannot tell the two apart.
      schema: { type: integer, minimum: 1, maximum: 100 }
    PageAfter:
      name: page[after]
      in: query
      required: false
      description: |
        Return the page that FOLLOWS this cursor — an opaque cursor from `meta.page.nextCursor`, a
        resource's `meta.page.cursor`, or a pagination link; never build or edit one. A cursor
        replayed under a different `filter` or `sort` is refused with a 400. Cannot be combined with
        `page[before]`.
      schema: { type: string }
    PageBefore:
      name: page[before]
      in: query
      required: false
      description: |
        Return the page that PRECEDES this cursor — this is how you poll for rows that arrived since
        your last read. An opaque cursor from `meta.page.nextCursor`, a resource's
        `meta.page.cursor`, or a pagination link; never build or edit one. A cursor replayed under a
        different `filter` or `sort` is refused with a 400. Cannot be combined with `page[after]`.
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Sortable fields: `createdAt`, `id`. Prefix with `-` to reverse. The default is
        `-createdAt,-id`, newest first. Any other field is refused with a 400.

        The whitelist is short by design. A sortable field is a component of the cursor key, so it
        must be indexed — or the walk re-sorts the whole set on every page — and immutable, or the
        boundary moves under a walker and a row is served twice or skipped.
      schema: { type: string }
      example: '-createdAt'

  responses:
    Unauthenticated:
      description: No usable bearer token was presented.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    Forbidden:
      description: |
        Authenticated, and not entitled — a missing scope, permission or fax-account grant.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    NotFound:
      description: |
        Nothing of yours has that id. **This includes "it belongs to another scope"** — a 403 there
        would confirm the row exists.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    BadQuery:
      description: |
        A query parameter was not one this collection accepts — an unknown filter value, a
        `page[size]` past the ceiling, a `filter[tag]` with no tag name. Refused rather than
        ignored, because a filter that silently did nothing would answer 200 with the WHOLE
        collection to a caller who believes they narrowed it.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    UnprocessableDocument:
      description: |
        The document was well formed and could not be applied — a field the machinery owns carrying
        a CHANGED value, a value past a published limit, or a missing required member. Each error's
        `source.pointer` names the member.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
    RateLimited:
      description: 'Too many requests (`code: rate_limited`).'
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'

  schemas:
    # -- The token mint --------------------------------------------------------------------------
    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: |
            Always `client_credentials`. This endpoint serves more than one OAuth grant, and this
            member is what selects yours.
        client_id:
          type: string
          format: uuid
          description: The client id you were issued.
        client_secret:
          type: string
          description: Its secret. It travels in the body over TLS, never in a URL.
        tenant:
          type: string
          format: uuid
          description: |
            The reseller you are acting for. Your client must hold an active grant for it, or the
            request is refused with a 403.

            Optional only when your client holds exactly ONE active grant, which the server then
            uses. A client holding several and naming none is refused with `invalid_request`
            rather than picked between.
        customer:
          type: string
          format: uuid
          description: |
            One customer inside that tenant, when a grant names one. It SELECTS a context somebody
            already granted and narrows nothing by itself. Omit it for the tenant-wide token, and
            omit it rather than sending it empty — a blank value is refused, not read as absence.
        scope:
          type: string
          description: |
            The scopes you are asking for, space-delimited in ONE string — RFC 6749's encoding.
            What you receive is the intersection with your grant and, on a customer-scoped token,
            with the customer-scopeable set. Anything outside it is dropped silently, so read the
            scopes back off the response. A scope NAME nobody publishes is the exception and is
            refused with `invalid_scope`.
          examples: ['numbers:read numbers:route']
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, scopes]
      properties:
        access_token:
          type: string
          description: 'The bearer token. Send it as `Authorization: Bearer <token>`.'
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the token expires — 900, a fresh 15 minutes.
        scope:
          type: string
          description: |
            The scopes the token actually carries, space-delimited, after the intersection. This is
            the authoritative answer and it may be shorter than what you asked for.
          examples: ['numbers:read numbers:route']
        scopes:
          type: array
          items: { type: string }
          description: |
            The same set as an array. It is here so a caller reading it did not have to change
            when the mint moved; `scope` is the member the standard defines.
    OAuthError:
      type: object
      description: |
        How a token request is refused — RFC 6749's flat shape as `application/json`, NOT a
        JSON:API error document. Read it leniently: a refusal may carry members beyond the two
        below, and more may be added.
      required: [error]
      properties:
        error:
          type: string
          description: |
            The machine vocabulary to branch on.

            - `invalid_client` — the client id or the secret is wrong (401).
            - `unauthorized_client` — the credentials are good and no active grant matches, for
              the tenant or for the customer named. The two are not told apart (403).
            - `invalid_request` — the request names no context the server can resolve, or a
              selector is malformed (400).
            - `invalid_scope` — a scope name this platform does not publish (400).
          examples: [unauthorized_client]
        error_description:
          type: string
          description: A sentence for a person reading a log. Branch on `error`, never on this.
          examples: [No active integration grant for this tenant.]
        hint:
          type: string
          description: |
            An extra note some refusals carry — `invalid_scope` names the scope it could not
            resolve, for instance. Never guaranteed, so treat it as absent.

    # -- The deprecated integrator token mint ----------------------------------------------------
    IntegrationTokenRequest:
      type: object
      required: [client_id, client_secret, tenant]
      properties:
        client_id:
          type: string
          format: uuid
          description: The client id you were issued.
        client_secret:
          type: string
          description: Its secret. It travels in the body over TLS, never in a URL.
        tenant:
          type: string
          format: uuid
          description: |
            The reseller you are acting for. Your client must hold an active grant for it, or the
            request is refused with a 403.
        customer:
          type: [string, 'null']
          format: uuid
          description: |
            One customer inside that tenant, when a grant names one. It SELECTS a context somebody
            already granted and narrows nothing by itself. Omit it — or send null — for the
            tenant-wide token.
        scopes:
          type: array
          items: { type: string }
          description: |
            The scopes you are asking for. What you receive is the intersection with your grant and,
            on a customer-scoped token, with the customer-scopeable set. Anything outside it is
            dropped silently, so read `scopes` back off the response.
    IntegrationTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scopes]
      properties:
        access_token:
          type: string
          description: 'The bearer token. Send it as `Authorization: Bearer <token>`.'
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the token expires — 900, a fresh 15 minutes.
        scopes:
          type: array
          items: { type: string }
          description: |
            The scopes the token actually carries, after the intersection. This is the authoritative
            answer and it may be shorter than what you asked for.

    # -- JSON:API envelope -------------------------------------------------------------------------
    ResourceIdentifier:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    ResourceLinks:
      type: object
      description: Links belonging to one resource object.
      properties:
        self: { type: string, format: uri }
      additionalProperties: true
    CollectionLinks:
      type: object
      description: |
        Pagination links. `first` is always present, `prev` whenever a previous page exists, and
        `next` on every page but the last — on the final page `next` is ABSENT from the document
        altogether. Branch on `meta.page.nextCursor` instead: it is `null` at the end and present on
        every page, so one member answers "is there more?" everywhere. There is no `last` link.

        A link that does not apply is ABSENT rather than null — the encoder cannot carry a null
        href — so these three are plain strings whenever they appear at all.
      properties:
        self: { type: [string, 'null'], format: uri }
        first: { type: string, format: uri }
        prev: { type: string, format: uri }
        next: { type: string, format: uri }
      additionalProperties: true
    PageMeta:
      type: object
      description: |
        Where this page sits in the collection it came from.
      required: [size, nextCursor]
      properties:
        size:
          type: integer
          description: The number of rows a full page holds for this request.
        nextCursor:
          type: [string, 'null']
          description: |
            Send this back as `page[after]` for the page that follows. `null` on the final page —
            the end-of-feed signal.
        total:
          type: integer
          description: |
            The exact number of rows the collection holds under the filters applied, repeated on
            every page of the walk. Present on SOME collections only, so read it as optional: of the
            collections documented here `fax-accounts`, `fax-account-users` and `webhook-endpoints`
            publish it, and `faxes` and `webhook-deliveries` never do. Counting a table that only
            grows costs more with every row, which is the price a cursor walk exists to not pay.
      additionalProperties: true
    DocumentMeta:
      type: object
      description: |
        Document-level metadata. A paged collection carries `page` here.
      properties:
        page:
          $ref: '#/components/schemas/PageMeta'
      additionalProperties: true
    ResourceMeta:
      type: object
      description: |
        Metadata belonging to one resource object.
      properties:
        page:
          type: object
          description: |
            This row's own place in the collection that served it. Present on the members of a
            paginated collection, and absent everywhere else — a single-resource read and a
            side-loaded `included` row were never positions in a walk.
          properties:
            cursor:
              type: string
              description: |
                An opaque cursor for THIS row. Send it as `page[after]` for the rows after it or as
                `page[before]` for the rows before it, under the same `filter` and `sort`.
          additionalProperties: true
      additionalProperties: true
    RelationshipToOne:
      type: object
      description: |
        A to-one relationship. `data` is present only when the relationship was resolved — a plain
        read that included nothing gives `links` alone.
      properties:
        links:
          $ref: '#/components/schemas/ResourceLinks'
        data:
          oneOf:
            - $ref: '#/components/schemas/ResourceIdentifier'
            - type: 'null'
    RelationshipToMany:
      type: object
      description: A to-many relationship.
      properties:
        links:
          $ref: '#/components/schemas/ResourceLinks'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceIdentifier'
    ErrorSource:
      type: object
      description: |
        Where the problem is. A JSON:API document body gets a `pointer`; a flat form body or a query
        parameter gets a `parameter`.
      properties:
        pointer: { type: string }
        parameter: { type: string }
    Error:
      type: object
      description: One problem with one request.
      required: [status, title]
      properties:
        status:
          type: string
          description: The HTTP status, as a string.
        title:
          type: string
          description: A short human phrase — the same for every instance of a code.
        detail:
          type: string
          description: What went wrong this time, in a sentence.
        code:
          $ref: '#/components/schemas/ErrorCode'
        source:
          $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      description: |
        The stable machine vocabulary an integrator branches on. Not every refusal carries one:
        where no published code names the case, the status is the contract and `meta` carries the
        detail.
      enum:
        - validation_failed
        - caller_id_not_permitted
        - document_too_large
        - too_many_pages
        - unsupported_media_type
        - fax_account_suspended
        - rate_limited
        - not_found
        - forbidden
        - internal_error
    ErrorDocument:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'

    # -- Shared vocabularies -----------------------------------------------------------------------
    FaxDirection:
      type: string
      enum: [inbound, outbound]
    FaxStatus:
      type: string
      description: |
        `queued`, `converting`, `sending`, `delivered`, `partial` and `cancelled` belong to an
        outbound fax; `received` to an inbound one; `failed` to both.
      enum:
        - queued
        - converting
        - sending
        - delivered
        - partial
        - cancelled
        - received
        - failed
    FaxFailureCode:
      type: [string, 'null']
      description: The stable machine reason a fax ended badly. Null on every fax that has not failed.
      enum:
        - busy
        - no_answer
        - no_fax_tone
        - negotiation_failed
        - line_quality
        - line_dropped
        - incompatible
        - document_error
        - invalid_number
        - carrier_rejected
        - internal_error
        - null
    FaxAccountStatus:
      type: string
      description: A suspended account may receive faxes but not send them.
      enum: [active, suspended]
    FaxResolution:
      type: string
      description: The two vertical resolutions the renderer produces.
      enum: [fine, standard]
    WebhookScopeType:
      type: string
      description: |
        What an endpoint hears about. All three are matched as a containment order, so a
        reseller-wide endpoint and a per-account one both hear about the same fax.
      enum: [tenant, customer, fax_account]
    WebhookEventType:
      type: string
      description: Every event name a subscriber may ask for.
      enum:
        - fax.received
        - fax.queued
        - fax.converting
        - fax.sending
        - fax.delivered
        - fax.partial
        - fax.failed
        - fax.cancelled
    WebhookDeliveryStatus:
      type: string
      description: |
        Derived, not stored. `pending` is still on the retry ladder; `dead` ran out of rungs and is
        what an outage costs you.
      enum: [pending, delivered, dead]
    Tags:
      type: [object, 'null']
      description: |
        A flat map of short labels you own — the only filing system there is. Replaced wholesale on
        a write, never merged.
      additionalProperties: { type: [string, 'null'] }
    CoverPage:
      type: [object, 'null']
      description: |
        The cover page this fax was sent with, as it was supplied: a recipient name, a sender name,
        a subject and a message. A cover page IS a page — it is counted in `pages_total` and it
        bills.
      additionalProperties: true

    # -- faxes -------------------------------------------------------------------------------------
    FaxDocumentMetadata:
      type: object
      description: |
        What one of a fax's documents is, WITHOUT any way to reach it. No object key and no URL is
        ever published here.
      properties:
        kind:
          type: string
          description: '`source` is what you uploaded; `tiff` went on the wire; `pdf` is what a person reads; `thumb` is the preview.'
          enum: [source, tiff, pdf, thumb]
        ordinal: { type: integer }
        contentType: { type: [string, 'null'] }
        byteSize: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        pages: { type: [integer, 'null'] }
    FaxAttributes:
      type: object
      properties:
        direction:
          $ref: '#/components/schemas/FaxDirection'
        status:
          $ref: '#/components/schemas/FaxStatus'
        failureCode:
          $ref: '#/components/schemas/FaxFailureCode'
        from: { type: [string, 'null'], description: 'The sending number, in E.164.' }
        to: { type: [string, 'null'], description: 'The receiving number, in E.164.' }
        pagesTotal: { type: [integer, 'null'] }
        pagesTransferred: { type: [integer, 'null'] }
        partial:
          type: [boolean, 'null']
          description: |
            Are pages missing? Not folded into `status`, because an inbound fax that lost pages is
            still `received` while an outbound one is `partial`.
        attemptCount: { type: [integer, 'null'] }
        resolution: { type: [string, 'null'] }
        clientReference:
          type: [string, 'null']
          description: The reference your own system supplied at send time.
        coverPage:
          $ref: '#/components/schemas/CoverPage'
        read:
          type: boolean
          description: Yours to set. Setting it twice does not move when the fax was first read.
        archived:
          type: boolean
          description: Yours to set.
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FaxDocumentMetadata'
        createdAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    FaxRelationships:
      type: object
      properties:
        faxAccount:
          $ref: '#/components/schemas/RelationshipToOne'
        attempts:
          $ref: '#/components/schemas/RelationshipToMany'
    FaxResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [faxes] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAttributes'
        relationships:
          $ref: '#/components/schemas/FaxRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAttemptAttributes:
      type: object
      description: |
        One call placed for one fax. Two independent sources fill it: a busy or unanswered call
        produces no fax-protocol event, so `hangupCause` is the only classifier there — and the
        reverse happens too. Both sides are nullable because both are nullable in fact.
      properties:
        attemptNo: { type: [integer, 'null'] }
        transportProfile:
          type: [object, 'null']
          description: |
            The ladder rung this call used, whole — the transport plus whether ECM and V.17 were on.
            Null on an inbound call: nobody negotiated a rung for one.
          additionalProperties: true
        startedAt: { type: [string, 'null'], format: date-time }
        answeredAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        billableMs: { type: [integer, 'null'] }
        hangupCause: { type: [string, 'null'] }
        sipStatus: { type: [integer, 'null'] }
        faxSuccess: { type: [boolean, 'null'] }
        faxResultCode: { type: [integer, 'null'] }
        faxResultText: { type: [string, 'null'] }
        pagesTransferred: { type: [integer, 'null'] }
        pagesTotal: { type: [integer, 'null'] }
        transferRate: { type: [integer, 'null'] }
        ecmUsed: { type: [boolean, 'null'] }
        t38Used: { type: [boolean, 'null'] }
        imageResolution: { type: [string, 'null'] }
        badRows: { type: [integer, 'null'] }
        remoteStationId: { type: [string, 'null'] }
    FaxAttemptResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-attempts] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAttemptAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
    FaxDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxResource'
        included:
          type: array
          description: The side-loaded resources `include` asked for.
          items:
            $ref: '#/components/schemas/FaxAttemptResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/FaxAttemptResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [faxes] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              description: |
                Only `read`, `archived` and `tags` may CHANGE. Any other attribute may be echoed back
                with its current value, and is a 422 with a different one.
              properties:
                read: { type: boolean }
                archived: { type: boolean }
                tags:
                  $ref: '#/components/schemas/Tags'
              additionalProperties: true

    # -- POST /v1/faxes ----------------------------------------------------------------------------
    # Shared by both send bodies on purpose: the ceiling on each field is one validation rule in the
    # application, so two copies here would be two places for it to drift. A COMMENT, not description
    # text — it answers a spec author's question about the file, and an integrator reading the
    # rendered page is owed the fields, not our filing.
    CoverPageRequest:
      type: [object, 'null']
      description: |
        The four fields of the built-in cover page. A cover page IS a page — it is counted in
        `pages_total` and it bills. `null` is accepted the same as omitting the field or sending
        `{}` — none of the three add a cover page.
      properties:
        to_name: { type: string, maxLength: 128 }
        from_name: { type: string, maxLength: 128 }
        subject: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 2000 }
    SendFaxMultipartRequest:
      type: object
      description: |
        Upload the pages themselves. Up to five parts, sniffed on their bytes rather than on their
        names — PDF, TIFF, PNG and JPEG are what a fax can be made of.

        Send the `tags` and `cover_page` parts as plain JSON text, not as a `Blob`: append the JSON
        string directly as the part body, because a `Blob` part gains a filename and arrives as an
        upload instead of a field, which fails validation without saying why.
      required: [fax_account, to, documents]
      properties:
        fax_account:
          type: string
          format: uuid
          description: The account to send from.
        to:
          type: string
          description: The destination, in E.164. Nothing looser — this string is dialled.
          examples: ['+13025556789']
        from:
          type: string
          description: |
            The caller ID. Omit it to use the account's `defaultFromE164`; a number the account does
            not hold is a 403, whichever way it arrived.
          examples: ['+14075550100']
        resolution:
          $ref: '#/components/schemas/FaxResolution'
        cover_page:
          $ref: '#/components/schemas/CoverPageRequest'
        client_reference:
          type: string
          maxLength: 128
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          # The ceiling counts UPLOADS PLUS URLS, so it is the same five on both bodies
          # (FaxDocumentIntake::MAX_DOCUMENTS, applied to `count($uploads) + count($urls)`).
          maxItems: 5
          description: 'The file parts. Spell them `documents[]`; a single part named `documents` is accepted too.'
          items:
            type: string
            format: binary
    SendFaxUrlRequest:
      type: object
      description: |
        Point at the pages instead of uploading them. Every URL must be `https` on a public host, and
        uploads and URLs may not be mixed in one request.
      required: [fax_account, to, documents]
      properties:
        fax_account: { type: string, format: uuid }
        to: { type: string, examples: ['+13025556789'] }
        from: { type: string, examples: ['+14075550100'] }
        resolution:
          $ref: '#/components/schemas/FaxResolution'
        cover_page:
          $ref: '#/components/schemas/CoverPageRequest'
        client_reference: { type: string, maxLength: 128 }
        tags:
          $ref: '#/components/schemas/Tags'
        documents:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
    SendFaxAccepted:
      type: object
      description: |
        A flat acknowledgement, not a JSON:API document. Read the whole fax at
        `GET /v1/faxes/{fax}`.
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/FaxStatus'
            direction:
              $ref: '#/components/schemas/FaxDirection'
            from: { type: [string, 'null'] }
            to: { type: [string, 'null'] }
            client_reference: { type: [string, 'null'] }
            created_at: { type: [string, 'null'], format: date-time }
    CancelFaxResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            status:
              $ref: '#/components/schemas/FaxStatus'
    MediaLink:
      type: object
      description: |
        A capability that expires, plus the facts about what is behind it. Not a JSON:API resource:
        there is no stored member this URI could be a collection of.
      required: [url, expires_at, byte_size, sha256]
      properties:
        url:
          type: string
          format: uri
          description: |
            A time-limited download URL on your own API host. Fetch it with a plain `GET` and no
            `Authorization` header — the signature it carries is the authorization. Opaque: the
            signature covers the whole address, so any edit invalidates it. Short-lived — do not
            cache it past `expires_at` or share it.
        expires_at:
          type: string
          format: date-time
        byte_size:
          type: integer
        sha256:
          type: string
          description: The digest of the bytes behind `url`, so you can verify what you downloaded.

    # -- fax-accounts ------------------------------------------------------------------------------
    FaxAccountAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        headerText:
          type: [string, 'null']
          maxLength: 64
          description: |
            The header line printed across the top of every page. 64 characters is the fax
            protocol's own column, not a product choice.
        defaultFromE164:
          type: [string, 'null']
          description: |
            The caller ID a send falls back to. May be set before the number is routed — whether the
            account holds it is asked at the send.
        retentionDays:
          type: integer
          minimum: 1
          maximum: 2557
          description: How long this account's fax media is kept.
        complianceRetention: { type: boolean }
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 3
        status:
          $ref: '#/components/schemas/FaxAccountStatus'
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    FaxAccountRelationships:
      type: object
      properties:
        customer:
          $ref: '#/components/schemas/RelationshipToOne'
        numbers:
          $ref: '#/components/schemas/RelationshipToMany'
    FaxAccountResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-accounts] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAccountAttributes'
        relationships:
          $ref: '#/components/schemas/FaxAccountRelationships'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAccountDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxAccountResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxAccountResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountWritableAttributes:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        headerText: { type: [string, 'null'], maxLength: 64 }
        defaultFromE164: { type: [string, 'null'] }
        retentionDays: { type: integer, minimum: 1, maximum: 2557 }
        complianceRetention: { type: boolean }
        maxAttempts: { type: integer, minimum: 1, maximum: 3 }
        status:
          $ref: '#/components/schemas/FaxAccountStatus'
    FaxAccountCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes, relationships]
          properties:
            type: { type: string, enum: [fax-accounts] }
            attributes:
              allOf:
                - $ref: '#/components/schemas/FaxAccountWritableAttributes'
                - type: object
                  required: [name]
            relationships:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
    FaxAccountUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [fax-accounts] }
            id: { type: string, format: uuid }
            attributes:
              allOf:
                - $ref: '#/components/schemas/FaxAccountWritableAttributes'
                - type: object
                  required: [name]

    # -- fax-account-users -------------------------------------------------------------------------
    FaxAccountUserAttributes:
      type: object
      properties:
        userEmail:
          type: [string, 'null']
          description: |
            The grantee's email — a grant list is read to answer "who can see this?", and a page of
            ids answers nothing.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    FaxAccountUserResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [fax-account-users] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/FaxAccountUserAttributes'
        relationships:
          type: object
          properties:
            faxAccount:
              $ref: '#/components/schemas/RelationshipToOne'
            user:
              $ref: '#/components/schemas/RelationshipToOne'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    FaxAccountUserDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FaxAccountUserResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountUserCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FaxAccountUserResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    FaxAccountUserCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, relationships]
          properties:
            type: { type: string, enum: [fax-account-users] }
            relationships:
              type: object
              required: [faxAccount, user]
              properties:
                faxAccount:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
                user:
                  type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'

    # -- phone-numbers (read-only, through a fax account) ------------------------------------------
    PhoneNumberResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [phone-numbers] }
        id: { type: string, format: uuid }
        attributes:
          type: object
          properties:
            e164: { type: [string, 'null'] }
            status:
              type: [string, 'null']
              enum: [pending, active, failed, releasing, null]
            country: { type: [string, 'null'] }
            activatedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: [string, 'null'], format: date-time }
        relationships:
          type: object
          properties:
            customer:
              $ref: '#/components/schemas/RelationshipToOne'
            routingTarget:
              $ref: '#/components/schemas/RelationshipToOne'
            pbxNumber:
              $ref: '#/components/schemas/RelationshipToOne'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    PhoneNumberCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumberResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'

    # -- webhook-endpoints -------------------------------------------------------------------------
    WebhookEndpointAttributes:
      type: object
      properties:
        scopeType:
          $ref: '#/components/schemas/WebhookScopeType'
        scopeId:
          type: [string, 'null']
          format: uuid
          description: The id of the tenant, customer or fax account this endpoint hears about.
        url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        events:
          type: [array, 'null']
          maxItems: 64
          description: 'Null or `[]` both mean "every event in scope".'
          items:
            $ref: '#/components/schemas/WebhookEventType'
        active: { type: [boolean, 'null'] }
        secret:
          type: [string, 'null']
          description: |
            The signing secret, `whsec_`-prefixed. **Non-null only in the response to the create or
            the rotate that minted it** — every other read is `null`, because the platform holds no
            readable copy.
        secretPreviousExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the PREVIOUS secret stops signing. Null outside a rotation's grace window; the
            previous secret itself is never published.
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    WebhookEndpointResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [webhook-endpoints] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/WebhookEndpointAttributes'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    WebhookEndpointDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookEndpointCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookEndpointCreateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, attributes]
          properties:
            type: { type: string, enum: [webhook-endpoints] }
            attributes:
              type: object
              required: [url, scopeType, scopeId]
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: '`https` only, on a public host.'
                scopeType:
                  $ref: '#/components/schemas/WebhookScopeType'
                scopeId: { type: string, format: uuid }
                events:
                  type: [array, 'null']
                  maxItems: 64
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
                active: { type: boolean }
    WebhookEndpointUpdateRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [type, id, attributes]
          properties:
            type: { type: string, enum: [webhook-endpoints] }
            id: { type: string, format: uuid }
            attributes:
              type: object
              required: [url]
              description: |
                `scopeType` and `scopeId` may be echoed back unchanged; a different value is a 422.
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
                events:
                  type: [array, 'null']
                  maxItems: 64
                  items:
                    $ref: '#/components/schemas/WebhookEventType'
                active: { type: boolean }
              additionalProperties: true

    # -- webhook-deliveries ------------------------------------------------------------------------
    WebhookDeliveryAttributes:
      type: object
      properties:
        eventId:
          type: [string, 'null']
          description: The dedupe key. A retried delivery of the same event carries the same id.
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        payloadSha256:
          type: [string, 'null']
          description: |
            The digest of the exact bytes we signed. The body itself is never published here.
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attemptNo:
          type: [integer, 'null']
          description: How many POSTs have been made, not how many failed.
        statusCode:
          type: [integer, 'null']
          description: What your server answered. Null when we never reached it.
        durationMs: { type: [integer, 'null'] }
        error:
          type: [string, 'null']
          description: Why we could not reach you, when that is the reason.
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        deadAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
    WebhookDeliveryResource:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [webhook-deliveries] }
        id: { type: string, format: uuid }
        attributes:
          $ref: '#/components/schemas/WebhookDeliveryAttributes'
        relationships:
          type: object
          properties:
            endpoint:
              $ref: '#/components/schemas/RelationshipToOne'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/ResourceMeta'
    WebhookDeliveryDocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WebhookDeliveryResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/ResourceLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'
    WebhookDeliveryCollectionDocument:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryResource'
        included:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResource'
        links:
          $ref: '#/components/schemas/CollectionLinks'
        meta:
          $ref: '#/components/schemas/DocumentMeta'

    # -- The outbound webhook body -----------------------------------------------------------------
    FaxEventData:
      type: object
      description: |
        A SNAPSHOT of the fax, frozen when the transition happened — not a fresh read. A retry six
        hours later carries the same values, so a `fax.sending` event never says `delivered`.

        **No document content, no object keys and no URLs.** A webhook body travels to a third party
        over the public internet and is stored in their logs. Fetch the pages with your own
        credential at `GET /v1/faxes/{fax}/media`, which is also what records who looked.
      properties:
        id: { type: string, format: uuid }
        fax_account_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        customer_id: { type: [string, 'null'], format: uuid }
        direction:
          $ref: '#/components/schemas/FaxDirection'
        status:
          $ref: '#/components/schemas/FaxStatus'
        failure_code:
          $ref: '#/components/schemas/FaxFailureCode'
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        region: { type: [string, 'null'] }
        pages_total: { type: [integer, 'null'] }
        pages_transferred: { type: [integer, 'null'] }
        partial: { type: [boolean, 'null'] }
        attempt_count: { type: [integer, 'null'] }
        client_reference: { type: [string, 'null'] }
        tags:
          $ref: '#/components/schemas/Tags'
        created_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    FaxReceivedEventData:
      allOf:
        - $ref: '#/components/schemas/FaxEventData'
        - type: object
          properties:
            render_failed:
              type: boolean
              description: |
                Always present, never conditional. `true` means the fax is real and its metadata is
                complete, and only the rendered document is missing.
    WebhookEventEnvelope:
      type: object
      description: |
        The envelope every outbound webhook body shares. `data` is added by the event schema that
        uses it — see `FaxEvent`.

        ## Verify the signature before you trust it

        Every delivery carries a `Ringivo-Signature` header:

        ```
        Ringivo-Signature: t=1755331200,v1=9f86d0…,v1=2c26b4…
        ```

        `t` is the Unix second the delivery was signed. Each `v1` is
        `HMAC-SHA256(secret, "<t>.<raw body>")` in lowercase hex. To verify: recompute the MAC over
        `"<t>.<raw body>"` with your `whsec_` secret, compare it to each `v1` in **constant time**,
        and reject anything whose `t` is more than **300 seconds** from your own clock. Both halves
        must pass — a good MAC with an old `t` is a replay, and a fresh `t` with no matching MAC is
        a forgery.

        **Sign the RAW BODY, never a re-encoding.** Parsing the JSON and re-encoding it before
        verifying WILL fail, and correctly so: key order, unicode escaping and number formatting are
        free choices no two encoders make identically. This is the commonest mistake with
        signatures of this shape.

        **A second `v1` appears only during a rotation's 24-hour grace window**, signed with the
        previous secret, newest first — so a receiver that checks only the first one validates
        against the secret we want it to hold.

        ## Delivery is at-least-once

        Dedupe on `event_id`: a retried delivery of the same event carries the same id, and two
        genuine transitions never share one. A failed delivery is retried after **10s, 1m, 5m, 30m,
        2h and 6h** — seven POSTs in all, the last about eight and three-quarter hours after the
        event — and then dead-lettered. Ask
        `GET /v1/webhook-deliveries?filter[status]=dead` for what you missed.

        Answer any 2XX to accept. Redirects are never followed. We wait ten seconds; if your handler
        needs longer, answer 202 and do the work afterwards.
      required: [event_id, type, occurred_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: The dedupe key.
        type:
          $ref: '#/components/schemas/WebhookEventType'
        occurred_at:
          type: string
          format: date-time
          description: |
            When the transition happened — captured at the event, not at delivery, so a retry does
            not claim the fax was delivered when we finally reached you.
    # The envelope and the payload are composed here rather than the envelope carrying a `data` of
    # its own that each event overrides. Two `properties: {data: …}` in one `allOf` are BOTH applied
    # — the narrower one does not replace the wider one — so `fax.received`'s extra member reads as
    # an unevaluated property of the base payload and lint reds on the example. Probed 2026-08-18.
    FaxEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxEventData'
    FaxReceivedEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/FaxReceivedEventData'
