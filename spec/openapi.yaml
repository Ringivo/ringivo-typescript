          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[user]
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The grants.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/FaxAccountUserCollectionDocument'
              example:
