  /v1/webhook-endpoints:
    get:
      tags: [Webhook endpoints]
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      description: |
        **No response ever carries a signing secret** except the create and the rotate that minted
        it. Every other read answers `"secret": null` — an honest statement that the platform holds
        no readable copy.

        **Scope:** `fax:read` lists the endpoints its own credential reaches — its customer's for a
        customer-scoped token, its reseller's for a tenant integrator one. `webhooks:read` is what a
        PERSON needs to list their reseller's endpoints without a fax grant behind it.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[scope_type]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookScopeType'
        - name: filter[scope_id]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[active]
          in: query
          required: false
          schema: { type: boolean }
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more endpoint ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The endpoints.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointCollectionDocument'
              example:
                data:
                  - type: webhook-endpoints
                    id: 0198c4a1-8192-73b4-e5b6-708192031425
                    attributes:
                      scopeType: customer
                      scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                      url: https://hooks.acme-vet.example/faxes
                      events: [fax.received, fax.delivered]
                      filter: status:failed OR status:partial
                      active: true
                      secret: null
                      secretPreviousExpiresAt: null
                      createdAt: '2026-08-10T08:00:00.000000Z'
                      updatedAt: '2026-08-10T08:00:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Webhook endpoints]
      operationId: createWebhookEndpoint
      summary: Register a webhook endpoint
      description: |
        **The signing secret is in this response and nowhere else, ever.** Store it before you do
        anything else; there is no way to read it back.

        The URL must be `https` with a public host — plain http, credentials in the URL, a private
        address literal and a non-http scheme are each refused at registration. A hostname that
        does not resolve yet is accepted on purpose, so you can register before publishing DNS.

        `events` is the list you want, and **it must name at least one event type** — an omitted
        member, `null` and `[]` are each a 422. An endpoint that named none would receive every
        event type this platform ever adds, including families your integration has never seen. The
        list is published back verbatim rather than normalised, so a client can tell its write was
        understood. An event name this platform does not publish is a 422 too — a typo would
        otherwise subscribe you to silence.

        `scopeType`/`scopeId` say what the endpoint hears about, and neither can be changed
        afterwards: the delivery history is the record of what THAT scope was told.

        `filter` narrows delivery BELOW that scope, matched against the body's `data` object — a
        customer-scoped endpoint asks for one fax account with
        `fax_account_id:<id>`, which is how a per-inbox subscription is written. Its SYNTAX is
        checked here and a 422 names the character that could
        not be read; its FIELD NAMES are not checked against anything, so a filter naming a field
        the body does not carry is valid and matches nothing. The grammar is on the `filter`
        attribute.

        **Scope:** a `fax:write` token may register an endpoint at any scope it already reaches,
        but only for `fax.*` events — naming `message.received` or a `port_order.*` type with a
        `fax:*` token is a 422 on that member, and needs `webhooks:write`. A scope the token does
        not reach is refused on `scopeId`, whatever the events are.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreateRequest'
            example:
              data:
                type: webhook-endpoints
                attributes:
                  url: https://hooks.acme-vet.example/faxes
                  scopeType: customer
                  scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                  events: [fax.received, fax.delivered]
                  filter: status:failed OR status:partial
      responses:
        '201':
          description: |
            The created endpoint, carrying its signing secret for the only time.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: customer
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    filter: status:failed OR status:partial
                    active: true
                    secret: whsec_Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdo
                    secretPreviousExpiresAt: null
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-10T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            The URL, the event list, the filter or the scope was refused. A scope you may not use
            and a scope that does not exist are refused with the SAME message, on purpose — telling
            them apart would make this field a way to discover which ids are real. A filter is
            refused for its LENGTH or for a syntax error naming the character it stopped at — never
            for naming a field, which is not checked. Supplying your own `secret` is refused here
            too.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-endpoints/{webhookEndpoint}:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    get:
      tags: [Webhook endpoints]
      operationId: getWebhookEndpoint
      summary: Read one webhook endpoint
      description: |
        `secret` is always `null` here — see the create.

        **Scope:** `fax:read` reaches the endpoints its own credential reaches; one outside that
        reach answers **404** to a `fax:*` token, exactly as an id that names nothing does, and
        requires `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      responses:
        '200':
          description: The endpoint.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: customer
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    filter: status:failed OR status:partial
                    active: true
                    secret: null
                    secretPreviousExpiresAt: null
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-10T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Webhook endpoints]
      operationId: updateWebhookEndpoint
      summary: Change a webhook endpoint's URL, events or switch
      description: |
        `url`, `events`, `filter` and `active` are editable. `scopeType` and `scopeId` are not — a
        caller who wants a different scope removes this endpoint and registers another.

        **Sending `filter: null` clears it**, after which the endpoint hears everything its scope and
        `events` match again.

        **Scope:** `fax:write` reaches the endpoints its own credential reaches, and may leave them
        subscribed to **`fax.*` events only** — an edit naming `message.received` or a `port_order.*`
        type is a 422 on that member. An endpoint outside that reach answers **404** and requires
        `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdateRequest'
            example:
              data:
                type: webhook-endpoints
                id: 0198c4a1-8192-73b4-e5b6-708192031425
                attributes:
                  url: https://hooks.acme-vet.example/faxes/v2
                  events: [fax.received, fax.delivered]
                  filter: status:failed
                  active: false
      responses:
        '200':
          description: The updated endpoint.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Webhook endpoints]
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint
      description: |
        The fan-out stops at once, and **this cannot be undone**. The endpoint is deleted outright
        and its delivery rows go with it — the ones still being retried and the ones that
        dead-lettered. A delivery that landed never wrote a row, so nothing that describes a
        SUCCESSFUL delivery is lost; what goes is work owed to a URL you have just unregistered.

        The secret goes too, and it is not recoverable: it is shown once at registration and once at
        each rotation. Registering the same URL again means minting a new one and deploying it on
        the receiving server.

        **Read `GET /v1/webhook-deliveries?filter[status]=dead` first** if you still need to know
        what you missed. Afterwards, the record of the removal — who, when, and what the endpoint
        was subscribed to — is on your account's audit page.

        **Scope:** `fax:write` reaches the endpoints its own credential reaches; one outside that
        reach answers **404** to a `fax:*` token and requires `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-endpoints/{webhookEndpoint}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    post:
      tags: [Webhook endpoints]
      operationId: rotateWebhookEndpointSecret
      summary: Mint a new signing secret
      description: |
        A verb and not a PATCH, because it MINTS A CREDENTIAL and starts a clock.

        The new secret is in this response and nowhere else. The **previous secret goes on signing
        for a 24-hour grace window**, and `secretPreviousExpiresAt` is the deadline — during that
        window a delivery's signature header carries two `v1` values, newest first. Roll your own
        copy before the deadline.

        **Scope:** `fax:write` may rotate the secret of an endpoint its own credential reaches; one
        outside that reach answers **404** to a `fax:*` token and requires `webhooks:write`.
      security:
        - bearerAuth: [webhooks:write]
        - bearerAuth: [fax:write]
      responses:
        '200':
          description: The endpoint, carrying the newly minted secret.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDocumentResponse'
              example:
                data:
                  type: webhook-endpoints
                  id: 0198c4a1-8192-73b4-e5b6-708192031425
                  attributes:
                    scopeType: customer
                    scopeId: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
                    url: https://hooks.acme-vet.example/faxes
                    events: [fax.received, fax.delivered]
                    filter: status:failed OR status:partial
                    active: true
                    secret: whsec_bmV3c2VjcmV0dmFsdWUwMTIzNDU2Nzg5YWJjZGVm
                    secretPreviousExpiresAt: '2026-08-17T08:00:00.000000Z'
                    createdAt: '2026-08-10T08:00:00.000000Z'
                    updatedAt: '2026-08-16T08:00:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-deliveries:
    get:
      tags: [Webhook deliveries]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      description: |
        Read-only evidence of what went WRONG — not a delivery history.

        A delivery that reaches your endpoint leaves nothing here. Only failures are recorded: a row
        appears when an attempt fails, moves along the retry ladder, and is removed the moment a
        later attempt succeeds. So this collection answers one question — what do we still owe you,
        and what did we give up on?

        **`filter[status]=dead` is the query it exists for.** Delivery is at-least-once with a
        dead-letter, so "we tried and gave up" is a state that is reached without your server ever
        hearing about it; this is where you learn what you missed after an outage. `pending` is
        everything still on the ladder. Any other status value — `delivered` included, which this
        collection used to publish — is refused with a 400 rather than ignored.

        **Removing an endpoint deletes its rows here too**, in the same request. Read what you
        missed BEFORE you remove it.

        For proof that a specific event arrived, use your own receipt: every POST carries
        `Ringivo-Event-Id`, and the resource itself can be refetched.

        The body we POSTed is never published here — only its `payloadSha256` digest, so an
        integrator who kept what they received can prove it is what we sent.

        **Scope:** a delivery borrows its endpoint's reach, so `fax:read` lists the deliveries of
        the endpoints it reaches; the deliveries of an endpoint outside that reach require
        `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: include
          in: query
          required: false
          description: Side-load the endpoint this delivery was for.
          schema:
            type: string
            enum: [endpoint]
        - name: filter[endpoint]
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: filter[event_type]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookEventType'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more delivery ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: A page of deliveries.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryCollectionDocument'
              example:
                data:
                  - type: webhook-deliveries
                    id: 0198c4a1-9203-74c5-f6c7-819203142536
                    attributes:
                      eventId: 0198c4a1-a314-75d6-07d8-92031425364a
                      eventType: fax.received
                      payloadSha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                      status: dead
                      attemptNo: 7
                      statusCode: 500
                      durationMs: 812
                      error: null
                      nextAttemptAt: null
                      deliveredAt: null
                      deadAt: '2026-08-16T19:45:00.000000Z'
                      createdAt: '2026-08-16T11:02:31.000000Z'
                      updatedAt: '2026-08-16T19:45:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/webhook-deliveries/{webhookDelivery}:
    parameters:
      - name: webhookDelivery
        in: path
        required: true
        description: The delivery's id.
        schema: { type: string, format: uuid }
    get:
      tags: [Webhook deliveries]
      operationId: getWebhookDelivery
      summary: Read one webhook delivery
      description: |
        **Scope:** a delivery borrows its endpoint's reach, so `fax:read` reaches the deliveries of
        the endpoints it reaches; a delivery of an endpoint outside that reach answers **404** to a
        `fax:*` token and requires `webhooks:read`.
      security:
        - bearerAuth: [webhooks:read]
        - bearerAuth: [fax:read]
      parameters:
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: [endpoint]
      responses:
        '200':
          description: The delivery.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDocumentResponse'
              example:
                data:
                  type: webhook-deliveries
                  id: 0198c4a1-9203-74c5-f6c7-819203142536
                  attributes:
                    eventId: 0198c4a1-a314-75d6-07d8-92031425364a
                    eventType: fax.received
                    payloadSha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
                    status: dead
                    attemptNo: 7
                    statusCode: 500
                    durationMs: 812
                    error: null
                    nextAttemptAt: null
                    deliveredAt: null
                    deadAt: '2026-08-16T19:45:00.000000Z'
                    createdAt: '2026-08-16T11:02:31.000000Z'
                    updatedAt: '2026-08-16T19:45:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/number-lookups:
    post:
      tags: [Number lookups]
      operationId: lookUpNumber
      summary: Look up a phone number
      description: |
        Everything we can find out about one number: who carries it now, what name it presents, and
        whether it can receive text messages.

        **This call costs you money.** It is billed at your per-lookup rate, every time, for any
        number — including one you do not own and never will. There is no free or cached variant, and
        a repeated lookup of the same number is a second lookup.

        **It needs a personal access token, not a client-credentials token.** This is the only
        operation here with that requirement, and it follows from the line above: because a lookup
        spends your balance, it is not something a third-party integration's credential may do on
        your behalf. Mint a token for one of your own console users from the portal's Personal access tokens page
        (Account › Personal access tokens).
        That user needs permission to look numbers up, which is held by exactly the roles that can
        already buy a number — so if they can purchase a DID, they can run a lookup.

        **A POST, not a GET, for that reason.** A GET is safe and idempotent by definition, so
        proxies, prefetchers and retry logic are entitled to repeat one — and each repeat would be
        another charge.

        **Nothing is stored.** We return the answer and keep no copy of it, so there is no
        `GET /v1/number-lookups/{id}` to come back to and no id to come back with. Keep what you need
        from the response.

        ## The two geographies are two different facts

        `dialedNumber` describes the number you asked about. `components.lrn.data.rateCenter` and
        `.state` describe its **LRN** — the routing number it currently ports to. **They frequently
        disagree, and both are right**: `6502530000` is `MT VIEW` by dialed number and `MILLVALLEY`
        by LRN. Do not merge them, and do not treat one as a correction of the other. Use the LRN's
        when you care where the call actually lands, and the dialed number's when you care where the
        number is nominally from.

        `dialedNumber.rateCenter` and `.state` are `null` for a toll-free number. That is **absent,
        not missing**: toll-free numbers are assigned individually rather than in geographic blocks,
        so there is no rate center to report. Nothing failed.

        ## Read `status` before you read `data`

        Each of the three components reports its own outcome, and `data` is `null` for two of them:

        | `status` | What it means | Charged |
        |---|---|---|
        | `answered` | The provider returned data. It is in `data`. | yes |
        | `no_data` | The provider answered, and holds nothing for this number. | yes |
        | `failed` | We could not get an answer. | see `charged` |

        **`no_data` and `failed` are not the same fact.** "This number has no CNAM record" and "we
        could not ask" look identical if you only check `data == null`, and only the first is
        something to show a user as an answer.

        `charged` tells you whether this lookup was billed. A lookup where **some** components
        answered is billed in full; one where **every** component failed is not billed at all.
      security:
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberLookupRequest'
            example:
              number: '6502530000'
      responses:
        '200':
          description: |
            The lookup. **200 and not 201** — nothing was created, and there is nothing to fetch
            again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NumberLookupResult'
              example:
                data:
                  number: '+16502530000'
                  lookedUpAt: '2026-08-19T18:04:11+00:00'
                  charged: true
                  dialedNumber:
                    rateCenter: MT VIEW
                    state: CA
                  components:
                    lrn:
                      status: answered
                      data:
                        lrn: '14159686199'
                        spid: '8824'
                        ocn: '8826'
                        lata: '722'
                        lec: LEVEL 3 COMMUNICATIONS, LLC - CA
                        lineType: WIRELESS
                        rateCenter: MILLVALLEY
                        state: CA
                        jurisdiction: INDETERMINATE
                        local: INDETERMINATE
                        portedAt: '2014-12-23T15:47:47+00:00'
                    callerName:
                      status: answered
                      data:
                        name: GOOGLEPLEX
                    messaging:
                      status: no_data
                      data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Not a number we will look up — it is not a North American number, or its area
            code/exchange does not exist. **Nothing was looked up and you were not charged**: this
            check runs before any provider is asked.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Not a number we can look up
                    detail: >-
                      No exchange 650-999 exists, so +16509999999 is not a real number. Nothing was
                      looked up and nothing was charged.
                    source:
                      pointer: /number
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices:
    get:
      tags: [ZTP devices]
      operationId: listZtpDevices
      summary: List registered phone MAC addresses
      description: |
        Every MAC you have registered, newest first. `state` is where the vendor registration stands,
        and `lastConnectedAt` is when that phone last checked in with the redirect service — refreshed
        hourly, so `observedAt` tells you how old the reading is.

        `filter[mac]` takes any of the three spellings a MAC is written in — `001565f0517a`,
        `00:15:65:f0:51:7a`, `00-15-65-f0-51-7a` — so you can filter on the value printed on the back
        of the phone without re-spelling it.
      security:
        - bearerAuth: [ztp-devices:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[mac]
          in: query
          required: false
          description: One MAC address, in any of the three accepted spellings.
          schema: { type: string }
          example: '00:15:65:f0:51:7a'
        - name: filter[customer]
          in: query
          required: false
          description: Only the devices assigned to this customer.
          schema: { type: string, format: uuid }
        - name: filter[state]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProvisioningState'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more device ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The registered devices.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceCollectionDocument'
              example:
                data:
                  - type: ztp-devices
                    id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                    attributes:
                      mac: 001565f0517a
                      vendor: yealink
                      label: Front desk
                      state: active
                      stateDetail: null
                      stateChangedAt: '2026-08-26T09:14:02.000000Z'
                      registeredAt: '2026-08-26T09:13:58.000000Z'
                      lastConnectedAt: '2026-08-26T11:02:40.000000Z'
                      lastIp: 203.0.113.24
                      observedAt: '2026-08-26T11:30:00.000000Z'
                      createdAt: '2026-08-26T09:13:55.000000Z'
                      updatedAt: '2026-08-26T11:30:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [ZTP devices]
      operationId: registerZtpDevice
      summary: Register a phone MAC address
      description: |
        One MAC per call. Send it in any of the three accepted spellings — `001565f0517a`,
        `00:15:65:f0:51:7a` or `00-15-65-f0-51-7a`, upper or lower case — and it is stored and
        returned as 12 lowercase hexadecimal characters.

        The device is created in `pending` and the vendor call is queued, so `state` is what tells you
        whether the redirect is in place. Poll the device, or read the collection, until it reaches
        `active` or `failed`; a `failed` device carries the reason in `stateDetail` and can be retried
        once you have acted on it.

        **A MAC belongs to exactly one company.** If it is already registered by somebody else, the
        call is refused with a 422 and the message *This MAC is already registered — contact support.*
        — we will not tell you who holds it, and we will not move it. Re-registering a MAC you already
        have is an ordinary duplicate, and its refusal names the device you already own.

        `customer` is optional. Omit it and the device goes into your unassigned pool; a
        **customer-scoped** credential that omits it gets its own customer, because a device it could
        not see afterwards would be of no use to it.
      security:
        - bearerAuth: [ztp-devices:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ZtpDeviceCreateRequest'
            example:
              data:
                type: ztp-devices
                attributes:
                  mac: '00:15:65:f0:51:7a'
                  label: Front desk
                relationships:
                  customer:
                    data:
                      type: customers
                      id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
      responses:
        '201':
          description: The registered device, `pending` while the vendor call is queued.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The `customer` relationship names a customer that does not exist for you.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '404'
                    title: Not Found
                    detail: The related resource does not exist.
                    source:
                      pointer: /data/relationships/customer
        '422':
          description: |
            The MAC was not one we can accept — it is not a MAC address, it is already registered by
            another company, or it is already in your own inventory. `source.pointer` names the
            member.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Registration refused
                    detail: This MAC is already registered — contact support.
                    source:
                      pointer: /data/attributes/mac
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices/{ztpDevice}:
    parameters:
      - $ref: '#/components/parameters/ZtpDeviceId'
    get:
      tags: [ZTP devices]
      operationId: getZtpDevice
      summary: Read one registered device
      security:
        - bearerAuth: [ztp-devices:read]
      responses:
        '200':
          description: The device.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
              example:
                data:
                  type: ztp-devices
                  id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                  attributes:
                    mac: 001565f0517a
                    vendor: yealink
                    label: Front desk
                    state: failed
                    stateDetail: >-
                      This MAC is registered to another company's Yealink account — contact Yealink
                      support to have it released, then retry.
                    stateChangedAt: '2026-08-26T09:14:02.000000Z'
                    registeredAt: null
                    lastConnectedAt: null
                    lastIp: null
                    observedAt: null
                    createdAt: '2026-08-26T09:13:55.000000Z'
                    updatedAt: '2026-08-26T09:14:02.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [ZTP devices]
      operationId: updateZtpDevice
      summary: Re-label a device, or move it between your customers
      description: |
        Two fields are editable and nothing else: `label`, your own caption, and the `customer` the
        device is assigned to. Send `customer: {data: null}` to put it back in your unassigned pool.
        Assignment is bookkeeping on our side — the vendor never learns of it, and the phone is not
        touched.

        **The MAC cannot be changed.** A different MAC is a different phone: register that one and
        remove this registration. Sending a different `mac` is a 422; sending the same one in another
        spelling is not a change and is accepted.

        A **customer-scoped** credential cannot use this endpoint at all. Assignment decides whose a
        phone is, so it is never self-served by the customer it would move a device to.
      security:
        - bearerAuth: [ztp-devices:write]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ZtpDeviceUpdateRequest'
            example:
              data:
                type: ztp-devices
                id: 0198c4a1-6f70-7081-b283-4d5e6f708192
                attributes:
                  label: Suite 300
      responses:
        '200':
          description: The updated device.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ZtpDeviceDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableDocument'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [ZTP devices]
      operationId: deleteZtpDevice
      summary: Deregister a device
      description: |
        The device leaves your inventory immediately, and its removal from the vendor's redirect
        service is queued behind it. There is no precondition: a device stuck in `failed` is exactly
        the one you most need to be able to remove.
      security:
        - bearerAuth: [ztp-devices:write]
      responses:
        '204':
          description: Deregistered.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/ztp-devices/{ztpDevice}/retry:
    parameters:
      - $ref: '#/components/parameters/ZtpDeviceId'
    post:
      tags: [ZTP devices]
      operationId: retryZtpDevice
      summary: Try a refused registration again
      description: |
        Only a `failed` device can be retried, and only once you have acted on the reason in its
        `stateDetail` — a MAC held by another company at the vendor is released by that vendor's
        support desk and by nobody else, so retrying before then simply fails again.

        The device goes back to `pending` and the vendor call is queued, which is why this answers
        **202** rather than 200: the retry is accepted, not finished. Read `state` back to see where
        it got to.

        Any other state is a **409**: a device that is still settling has a run in flight, and one
        that is `active` has nothing to re-drive.
      security:
        - bearerAuth: [ztp-devices:write]
      responses:
        '202':
          description: Queued.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The device has not failed, so there is nothing to retry.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Nothing to retry
                    detail: This registration is active, not failed, so there is nothing to retry.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/messaging-enablements:
    get:
      tags: [Text messaging]
      operationId: listMessagingEnablements
      summary: List text-messaging requests
      description: |
        Every request you have made to turn text messaging on, newest first — in flight and
        historical, because a request is a permanent record of an attempt.

        `stage` is a 0-4 progress counter and is what to branch on; `stageWord` and `detail` are the
        sentences to show a person. `stage` is a HIGH-WATER MARK, not a position: a failed request
        keeps the stage it REACHED, so `status: failed` with `stage: 3` means the number's current
        provider had the authorization in front of them before it was refused, and `stage: 2` means
        it never got that far. That difference is what tells you whether retrying is worth a second
        attempt.
      security:
        - bearerAuth: [numbers:read]
        - bearerAuth: [numbers:messaging]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MessagingEnablementStatus'
        - name: filter[e164]
          in: query
          required: false
          description: One number in E.164, including requests for a number you have since released.
          schema: { type: string }
          example: '+13215550101'
        - name: filter[phoneNumber]
          in: query
          required: false
          description: |
            Every request for one number in your inventory, by that number's id. An id that is not
            one of yours matches nothing — it is never an error, because an empty list is the
            truthful answer to "requests for a number you do not have".
          schema: { type: string, format: uuid }
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more request ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Your text-messaging requests.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MessagingEnablementCollectionDocument'
              example:
                data:
                  - type: messaging-enablements
                    id: 0198c4a1-8f70-7081-b283-4d5e6f708201
                    attributes:
                      e164: '+13215550101'
                      status: submitted
                      stage: 3
                      stageWord: In review
                      detail: 'Submitted 2026-09-01. The losing provider is reviewing the authorization.'
                      failedCause: null
                      scheduledFor: '2026-09-01T14:02:00.000000Z'
                      submittedAt: '2026-09-01T14:02:07.000000Z'
                      completedAt: null
                      failedAt: null
                      retryAllowedAt: null
                      createdAt: '2026-09-01T14:02:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Text messaging]
      operationId: createMessagingEnablement
      summary: Turn text messaging on for a number
      description: |
        Name one of your numbers and we do the rest: we generate the letter of authorization, record
        the person who asked as its signer, and send the request immediately. The response is the new
        request in `scheduled`; read it back, or wait for the webhook, to learn how it ended.

        **This needs a personal access token, not a client-credentials token.** Turning messaging on
        SIGNS an authorization, and an authorization has to be signed by a person who can be named on
        it — an API credential has no name, no title and no capacity to state. A client-credentials
        token is refused with a 401 at the door, whatever scopes it holds. The same is true of turning
        messaging off. Reading this collection is not restricted that way.

        **There is nothing else to choose.** Every enablement is `A2P` with MMS on. Sending any other
        attribute is refused with a 422 rather than ignored.

        **A number that is still porting to us is not done here.** Text messaging on a porting number
        is chosen on the port order itself, where it fires when the voice port is released. Sending a
        `portOrder` relationship here is refused.

        The refusals worth handling: the number is not yet active (wait), it already has messaging,
        or a request for it is already in flight — there is no cancel, so a second request for one
        number is refused rather than queued.
      security:
        - personalAccessToken: []
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/MessagingEnablementCreateRequest'
            example:
              data:
                type: messaging-enablements
                relationships:
                  phoneNumber:
                    data:
                      type: phone-numbers
                      id: 0198c4a1-2f70-7081-b283-4d5e6f708111
      responses:
        '201':
          description: The request was accepted and sent.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MessagingEnablementDocumentResponse'
              example:
                data:
                  type: messaging-enablements
                  id: 0198c4a1-8f70-7081-b283-4d5e6f708202
                  attributes:
                    e164: '+13215550101'
                    status: scheduled
                    stage: 1
                    stageWord: Scheduled
                    detail: null
                    failedCause: null
                    scheduledFor: '2026-09-02T09:15:00.000000Z'
                    submittedAt: null
                    completedAt: null
                    failedAt: null
                    retryAllowedAt: null
                    createdAt: '2026-09-02T09:15:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No number of yours has that id. A number belonging to somebody else answers this too — we
            never confirm that another company's id exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: |
            The number cannot be text-enabled right now. The message says which of the four reasons
            it is, in words you can show a person.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Text messaging refused
                    detail: >-
                      Text messaging cannot be turned on for +13215550101 yet: the number is still
                      being set up with the carrier. Try again once it is active.
                    source:
                      pointer: /data/relationships/phoneNumber
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            Text messaging is not available on your account yet. This is ours to fix, not yours —
            contact support, and retrying later may succeed.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'

  /v1/messaging-enablements/{enablement}:
    get:
      tags: [Text messaging]
      operationId: getMessagingEnablement
      summary: Read one text-messaging request
      description: |
        One request and where it has got to. `include=phoneNumber` side-loads the number if you still
        hold it — a request outlives the number it was for, so this is null once a number is released.
        `include=portOrder` side-loads the port order a request rides, and is null for a request made
        directly against a number already in your inventory.
      security:
        - bearerAuth: [numbers:read]
        - bearerAuth: [numbers:messaging]
      parameters:
        - $ref: '#/components/parameters/MessagingEnablementId'
      responses:
        '200':
          description: The request.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MessagingEnablementDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/inbound-messages:
    get:
      tags: [Text messaging]
      operationId: listInboundMessages
      summary: List messages sent to your numbers
      description: |
        Every text and picture message somebody sent to one of your text-enabled numbers, newest
        first.

        THIS IS THE POLLING HALF OF A PAIR. The other is the `message.received` webhook: register an
        endpoint and your backend is told as each message arrives. Read this collection to catch up
        on what you missed while your endpoint was down, or instead of a webhook if you have no
        public callback URL.

        `receivedAt` is when the message was SENT, and `createdAt` is when we stored it — they differ
        by however long a redelivery took. Filter on the first; page on the second.

        **Media is described, never carried.** A picture message lists each part's content type,
        filename and size, and there is no image and no URL to fetch one: we do not keep the bytes.
      security:
        - bearerAuth: [numbers:read]
        - bearerAuth: [numbers:messaging]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[number]
          in: query
          required: false
          description: One of your numbers in E.164 — the number the message was sent TO.
          schema: { type: string }
          example: '+13215550101'
        - name: filter[from]
          in: query
          required: false
          description: The sender's number in E.164.
          schema: { type: string }
          example: '+12003004000'
        - name: filter[kind]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InboundMessageKind'
        - name: filter[receivedAfter]
          in: query
          required: false
          description: |
            Messages received at or after this instant. A value that is not a date matches NOTHING
            rather than being ignored — a filter that quietly did nothing would hand you your whole
            history while you believed you had narrowed it to a day.
          schema: { type: string, format: date-time }
        - name: filter[receivedBefore]
          in: query
          required: false
          description: Messages received at or before this instant. Both ends are inclusive.
          schema: { type: string, format: date-time }
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more message ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: A page of received messages.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InboundMessageCollectionDocument'
              example:
                data:
                  - type: inbound-messages
                    id: 0198c4a1-8f70-7081-b283-4d5e6f708301
                    attributes:
                      kind: sms
                      from: '+12003004000'
                      to: '+13215550101'
                      body: Hello World
                      media: []
                      receivedAt: '2026-09-03T09:14:02.000000Z'
                      createdAt: '2026-09-03T09:14:03.000000Z'
                      updatedAt: '2026-09-03T09:14:03.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/inbound-messages/{message}:
    get:
      tags: [Text messaging]
      operationId: getInboundMessage
      summary: Read one received message
      description: |
        One message, exactly as the list serves it. A message addressed to a number you do not carry
        text messaging for is not yours and answers 404.
      security:
        - bearerAuth: [numbers:read]
        - bearerAuth: [numbers:messaging]
      parameters:
        - $ref: '#/components/parameters/InboundMessageId'
      responses:
        '200':
          description: The message.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/InboundMessageDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/messaging-enablements/{enablement}/retry:
    post:
      tags: [Text messaging]
      operationId: retryMessagingEnablement
      summary: Try a failed text-messaging request again
      description: |
        **A retry is a new request, not a restart of the old one.** The failed request keeps its
        cause and its timestamps forever — that history is what support reads when a number will not
        enable — so this answers **201 with a different id**, carrying the same authorization.

        The response is that new request in full, so nothing has to be fetched afterwards.

        **Only a failed request can be retried**, and not within 24 hours of the failure. Both
        refusals are told apart by their status: a 422 means "not yet" and carries the instant you
        may try again in `meta.retryAllowedAt`; a 409 means the request did not fail at all, so there
        is nothing to try again.

        Send no body.
      security:
        - personalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/MessagingEnablementId'
      responses:
        '201':
          description: |
            A fresh request was created and sent — **the full resource, the same shape
            `POST /v1/messaging-enablements` answers with**, so you do not need a second call to
            learn where the new request stands.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MessagingEnablementDocumentResponse'
              example:
                data:
                  type: messaging-enablements
                  id: 0198c4a1-8f70-7081-b283-4d5e6f708203
                  attributes:
                    e164: '+13215550101'
                    status: scheduled
                    stage: 1
                    stageWord: Scheduled
                    detail: null
                    failedCause: null
                    scheduledFor: '2026-09-03T11:20:04.000000Z'
                    submittedAt: null
                    completedAt: null
                    failedAt: null
                    retryAllowedAt: null
                    createdAt: '2026-09-03T11:20:04.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The request did not fail, so there is nothing to try again — it is still on its way, or
            it already succeeded.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Nothing to retry
                    detail: >-
                      The request to text-enable +13215550101
                      (0198c4a1-8f70-7081-b283-4d5e6f708201) is submitted, so there is nothing to try
                      again. Only a failed request can be retried.
        '422':
          description: |
            It failed too recently. `meta.retryAllowedAt` on the error is when a new attempt is
            allowed — the same instant the resource carries as `retryAllowedAt`.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Too soon to try again
                    detail: >-
                      The request to text-enable +13215550101
                      (0198c4a1-8f70-7081-b283-4d5e6f708201) failed too recently to try again. A new
                      request can be made from 2026-09-03T11:20:00+00:00; staff can retry sooner from
                      the backoffice.
                    meta:
                      retryAllowedAt: '2026-09-03T11:20:00.000000Z'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/phone-numbers/{phoneNumber}/customer:
    parameters:
      - $ref: '#/components/parameters/PhoneNumberId'
    post:
      tags: [Phone numbers]
      operationId: assignPhoneNumberToCustomer
      summary: Give a number to one of your customers
      description: |
        The number leaves your own pool and becomes that customer's. Nothing is ordered and no
        carrier is told — this is your inventory bookkeeping, and it is true the moment the call
        returns.

        **Assignment is what makes routing legal.** A number nobody holds cannot be pointed
        anywhere, so this is the first of the two writes that put a number into service.

        **No number moves from one customer to another in one call.** Re-homing is four steps, in
        this order: remove the routing, take the number off its customer, assign it to the new one,
        route it again. The interruption in the middle is real, so the API makes you spell it out.

        The body is flat JSON carrying `customer_id`. Only a customer of yours resolves; any other
        id answers **404**, exactly as an id that names nothing does.

        **A customer-scoped credential cannot assign.** Which customer holds which number is a
        reseller decision, so a token narrowed to one customer is refused with a **403** even when it
        carries `numbers:assign`.
      security:
        - bearerAuth: [numbers:assign]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberAssignRequest'
            example:
              customer_id: 0198c4a1-4d5e-7f60-a172-3c4d5e6f7081
      responses:
        '204':
          description: The number is that customer's.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Nothing of yours has that id — the number in the path, or the customer the body named.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '404'
                    title: Customer not found
                    detail: No customer of yours has that id.
        '409':
          description: |
            The number already belongs to a customer (`Already assigned`), or its status is neither
            `pending` nor `active` (`Not assignable`). `title` tells the two apart.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Already assigned
                    detail: +14075550100 is already assigned to a customer. Take it off that customer first, then assign it here.
        '422':
          description: '`customer_id` is missing, or is not a uuid.'
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Unprocessable Entity
                    detail: The customer id field is required.
                    source:
                      pointer: /customer_id
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Phone numbers]
      operationId: unassignPhoneNumberFromCustomer
      summary: Take a number back into your own pool
      description: |
        The number returns to your own pool. It is NOT released: the row survives, you still hold the
        number, and the carrier is never told.

        No customer is named, because none is needed — the number carries its own owner, so this
        takes it off whoever holds it.

        **Three states refuse it, and each names the one step that clears the block**: the number
        stands inside its customer's phone system, it still routes somewhere, or it has an
        emergency-service registration. The phone system is answered FIRST of the three, because
        removing the routing — what the routed sentence asks for — is itself refused while the number
        stands in a phone system.
      security:
        - bearerAuth: [numbers:assign]
      responses:
        '204':
          description: The number is back in your own pool.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The number belongs to nobody (`Not assigned`), or a state refuses the removal:
            `Still in the PBX`, `Still routed`, `Still registered for e911`. `title` says which, and
            `detail` names the step that clears it.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Still routed
                    detail: +14075550100 still routes to something. Remove its routing first, then take it off its customer.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/phone-numbers/{phoneNumber}/routing:
    parameters:
      - $ref: '#/components/parameters/PhoneNumberId'
    post:
      tags: [Phone numbers]
      operationId: routePhoneNumber
      summary: Point a number at a destination
      description: |
        The number starts ringing somewhere. It is routed the moment this returns, the edge picks the
        change up on its next reconcile, and no carrier is involved at all.

        **The number must already belong to a customer, and the destination is always that customer's
        own.** No field here can name anybody else's: a `pbx` route is derived from the number's own
        customer, and a `fax_account` or `sip_trunk` id is looked up within that same customer — so
        another customer's id is refused as an id that names nothing.

        `target_type` chooses the KIND of destination, and defaults to `pbx`:

        | `target_type` | Where the calls go | What else the body carries |
        |---|---|---|
        | `pbx` (the default) | The customer's phone system | nothing — a customer has exactly one |
        | `fax` | One of the customer's fax accounts | `fax_account`, that account's id |
        | `sip_trunk` | One of the customer's SIP trunks | `sip_trunk`, that trunk's id |

        **The id field is required for its own kind and refused for any other**, rather than ignored:
        a body carrying `fax_account` and no `target_type` would otherwise be told its PBX route
        succeeded.

        **The body is flat JSON, and a JSON:API document is refused with a 400.** A wrapped document
        carries no top-level `target_type`, so reading it flat would answer 204 to a caller who asked
        for a fax route and give them a PBX one. To route to the customer's phone system, send no body
        at all.

        **Re-routing is two calls**: remove the routing, then route again. A number that already
        routes is refused, because the interruption between the two is real.

        **A customer-scoped credential may route a number that is already its own customer's** — the
        one write on this resource such a token can make, and the reason `numbers:route` is a separate
        scope from `numbers:assign`.
      security:
        - bearerAuth: [numbers:route]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberRouteRequest'
            example:
              target_type: fax
              fax_account: 0198c4a1-3c4d-7e5f-9061-2b3c4d5e6f70
      responses:
        '204':
          description: The number routes to that destination.
        '400':
          description: |
            The body was a JSON:API document. Send `target_type` at the top level of a flat JSON body,
            or send no body at all.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '400'
                    title: Unexpected document
                    detail: >-
                      This endpoint takes a flat JSON body, not a JSON:API document: send target_type
                      at the top level, or send no body at all to route to the customer’s PBX.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The number's own state refuses the route, and `title` says which. `Not routable` covers
            four states, each with its own sentence: the number belongs to nobody, its status is
            neither `pending` nor `active`, the customer has no phone system to route to, or that
            phone system is still being created. `Already routed` is cleared by removing the routing
            first.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    title: Not routable
                    detail: +14075550100 is not assigned to a customer. Assign it to a customer first, then route it.
        '422':
          description: |
            A field you sent is wrong, and `source.pointer` names it: `target_type` is not one of the
            three values; `fax_account` or `sip_trunk` is missing for its own kind, or was sent with
            another kind; the id names no destination of that customer's; or the destination refuses
            the attach — a suspended fax account, a disabled SIP trunk.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Unprocessable Entity
                    detail: That fax account is suspended. Reinstate it first, then route the number to it.
                    source:
                      pointer: /fax_account
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      tags: [Phone numbers]
      operationId: unroutePhoneNumber
      summary: Stop a number pointing anywhere
      description: |
        The number stops routing. It is NOT released and NOT taken off its customer — the customer
        still holds it, it simply rings nowhere — and the edge picks the change up on its next
        reconcile.

        Two states refuse it, and each names the one step that clears the block: the number is still
        inside its customer's phone system, or it is the default caller ID of the fax account it
        routes to (`code: number_is_default_caller_id`).
      security:
        - bearerAuth: [numbers:route]
      responses:
        '204':
          description: The number no longer routes anywhere.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The number does not route anywhere, or a state refuses the removal.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '409'
                    code: number_is_default_caller_id
                    title: Number is a default caller ID
                    detail: +14075550100 is the default caller ID of the Front desk fax account. Choose a different default there first, then remove this number's routing.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/phone-numbers/{phoneNumber}/messaging:
    delete:
      tags: [Text messaging]
      operationId: disableNumberMessaging
      summary: Turn text messaging off for a number
      description: |
        Messaging stops for this number. The number's `messaging` object reads `enabled: false`
        immediately, and the removal at the provider follows on its own.

        **This does not undo the request that turned it on.** That request completed, and the record
        of it stays in `GET /v1/messaging-enablements` — turning messaging off is a new act, not a
        reversal. Turning it back on later is a fresh request with a fresh authorization.

        Like turning messaging on, this needs a personal access token; a client-credentials token is
        refused with a 401.
      security:
        - personalAccessToken: []
      parameters:
        - $ref: '#/components/parameters/PhoneNumberId'
      responses:
        '204':
          description: Text messaging is off for this number.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The number does not have text messaging, so there is nothing to turn off.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Text messaging refused
                    detail: '+13215550101 does not have text messaging.'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/hosted-messaging-orders:
    get:
      tags: [Hosted messaging orders]
      operationId: listHostedMessagingOrders
      summary: List hosted messaging orders
      description: |
        Every number you have brought in for text messaging, newest first — in flight and
        historical, because an order is a permanent record of an attempt.

        An order OUTLIVES the number it made. Disconnect the number and this row stays, with
        `phoneNumber` gone to null and `e164` still saying which number it was about. That is what
        keeps "how did this number get here?" answerable afterwards.
      security:
        - bearerAuth: [port-orders:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[status]
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HostedMessagingOrderStatus'
        - name: filter[e164]
          in: query
          required: false
          description: One number in E.164, including orders for a number you have since disconnected.
          schema: { type: string }
          example: '+13215550101'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more order ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
            `filter[id][]=<id>`. Sent without the
            brackets it is refused with a 400.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Your hosted messaging orders.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HostedMessagingOrderCollectionDocument'
              example:
                data:
                  - type: hosted-messaging-orders
                    id: 0198c4a1-9f70-7081-b283-4d5e6f708301
                    attributes:
                      e164: '+13215550101'
                      status: claimed
                      mechanism: claimed
                      createdAt: '2026-09-02T09:15:00.000000Z'
        '400':
          $ref: '#/components/responses/BadQuery'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Hosted messaging orders]
      operationId: createHostedMessagingOrder
      summary: Bring a number in for text messaging
      description: |
        Name a number whose calls another provider carries, and we bring it into your inventory so
        you can text from it. One order always produces exactly one number — read it back through
        the `phoneNumber` relationship.

        **The number is an attribute, not a link.** Every other endpoint here points at a number you
        already hold; this one is how a number arrives, so there is no id to name yet.

        **Add `?include=phoneNumber` to get the number back in the same response.** Relationships
        carry their links always and their linkage only when you ask, so without the include you get
        the order and follow a link for the number it made.

        **Name who will authorize it.** The number's calls are carried by another provider, so the
        authorization has to come from whoever that provider bills rather than from you. Send their
        name and email address as `endUser` and we email them a secure link to read and sign the
        letter; text messaging starts once they have signed. It is required on every create because
        the mechanism is not knowable until we look, and it is kept only when the answer is
        `enabled` — a `claimed` order needed no authorization and stores none of it. The details are
        write-only and are never returned.

        **You do not choose the mechanism.** We check what the number already has and answer with
        what we did. `mechanism: claimed` means it was already
        text-enabled where it lives and we recorded it: nothing was ordered, nothing was signed and
        nothing was spent. `mechanism: enabled` means we asked its provider to turn messaging on,
        and `messagingEnablement` points at the request to follow. Sending `mechanism` yourself is
        refused with a 422 rather than ignored.

        **This does not move the number's calls.** Its voice service stays exactly where it is, and
        `GET /v1/phone-numbers/{id}` reports `voice.enabled: false` for it. Moving the calls too is
        a port order, and a later port keeps this number's texting rather than replacing the row.

        **Emergency service is not available on such a number** — we do not carry its 911 traffic,
        so registering an address for it is refused.

        The refusals worth handling: the value is not a phone number, somebody already holds it, or
        it is one of yours whose calls we already carry — for that last one, text messaging is the
        `messaging-enablements` collection instead.
      security:
        - bearerAuth: [port-orders:hosted-messaging]
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/HostedMessagingOrderCreateRequest'
            example:
              data:
                type: hosted-messaging-orders
                attributes:
                  e164: '+13215550101'
                  endUser:
                    name: Dana Okonkwo
                    email: dana@okonkwovet.test
                relationships:
                  customer:
                    data:
                      type: customers
                      id: 0198c4a1-1f70-7081-b283-4d5e6f708100
      responses:
        '201':
          description: The number is in your inventory, and this is the record of how.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HostedMessagingOrderDocumentResponse'
              example:
                data:
                  type: hosted-messaging-orders
                  id: 0198c4a1-9f70-7081-b283-4d5e6f708302
                  attributes:
                    e164: '+13215550101'
                    status: claimed
                    mechanism: claimed
                    createdAt: '2026-09-02T09:15:00.000000Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            No customer of yours has that id. A customer belonging to somebody else answers this too
            — we never confirm that another company's id exists.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
        '422':
          description: |
            The number cannot be brought in. The message says which of the three reasons it is, in
            words you can show a person.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ErrorDocument'
              example:
                errors:
                  - status: '422'
                    title: Hosted messaging order refused
                    detail: >-
                      +13215550101 is already one of your numbers, and we carry its calls. Turn text
                      messaging on from the number's own Messaging control instead — hosted
                      messaging is for a number whose calls another provider carries.
                    source:
                      pointer: /data/attributes/e164
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/hosted-messaging-orders/{hostedMessagingOrder}:
    get:
      tags: [Hosted messaging orders]
      operationId: getHostedMessagingOrder
      summary: Read one hosted messaging order
      description: |
        One order and what it produced. `include=phoneNumber` side-loads the number if you still
        hold it — an order outlives the number it made, so this is null once the number has been
        disconnected. `include=messagingEnablement` side-loads the text-messaging request on the
        enable path, and is null on the claim path, where nothing was ever sent.
      security:
        - bearerAuth: [port-orders:read]
      parameters:
        - $ref: '#/components/parameters/HostedMessagingOrderId'
      responses:
        '200':
          description: The order.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/HostedMessagingOrderDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/port-orders:
    get:
      tags: [Port orders]
      operationId: listPortOrders
      summary: List port orders
      description: |
        Every port-in you have opened, newest first — drafts included, because a draft is where an
        order spends the days before your customer has found their bill.

        `filter[status]` is the axis this collection is actually read by: *which of my ports are
        still in flight?* The words are the `PortOrderStatus` vocabulary, and the lifecycle they
        belong to is written out under **Open a draft** below.

        **There is no `meta.page.total` here.** The collection keeps every order you have ever
        filed, so an exact count would be a second query over that whole history on every page of a
        walk. Read the collection by following `links.next` until `meta.page.nextCursor` is `null`.
      security:
        - bearerAuth: [port-orders:read]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/Sort'
        - name: filter[status]
          in: query
          required: false
          description: Only the orders standing in this state.
          schema:
            $ref: '#/components/schemas/PortOrderStatus'
        - name: filter[id][]
          in: query
          required: false
          description: |
            One or more order ids. Repeat the parameter once per id:
            `filter[id][]=<first>&filter[id][]=<second>`. One id is still
