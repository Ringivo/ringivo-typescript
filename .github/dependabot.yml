# Dependabot for ringivo-typescript (the public `ringivo` npm SDK): npm and GitHub Actions.
#
# Dependabot is the only dependency bot in this repo (no Renovate), so it owns both surfaces:
#   * npm at "/": package.json and package-lock.json. The one runtime dependency is
#     openapi-fetch; everything else is a devDependency that never ships in the tarball.
#   * github-actions at "/": the `uses:` refs in .github/workflows, pinned by tag
#     (actions/checkout@v4). Dependabot moves the tag to the new release.
#
# package.json carries an `overrides` entry for esbuild (tsup 8 allows only esbuild ^0.27,
# which has an advisory). When a version-update PR moves tsup to 9, drop that override in it.
#
# Policy: weekly on Monday 06:00 UTC (off-hours), ALL version updates (major too). npm majors get
# their OWN grouped PR (`npm-major`): a major such as vitest 5 or tsup 9 can need Node 22 and fail
# the test-node20 job, and in one group with the minors and patches it would hold all of them red.
# A package with a pending major gets only the major, in `npm-major`, until that PR is migrated.
# The runtime dependency, openapi-fetch, gets its own PR (`npm-runtime`), whatever the step.
# github-actions is one grouped PR per week. Every entry: at most 2 open PRs, and a 14-day
# cooldown on version updates so a release has time to be yanked before it lands here.
# SECURITY UPDATES are a repo setting (Settings > Code security), not a key in this file. They
# use this file's security groups and labels; `cooldown` does not hold them back.
# A Dependabot PR gets Dependabot secrets only; the pull_request workflow (ci.yml) reads none.
# A version or security PR never publishes: a release is a separate, deliberate version bump.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      # The one dependency that ships. Under semver a 0.x "minor" can break, and for a library
      # Dependabot widens the published range (^0.17.0 becomes ^0.18.0), so it gets its own PR.
      # Listed before `npm`: a dependency joins the first group whose rules match it.
      npm-runtime:
        applies-to: version-updates
        patterns: ["openapi-fetch"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
