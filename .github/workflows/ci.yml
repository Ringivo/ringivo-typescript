name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # BUILD BEFORE TEST, on purpose. tests/grey-label.test.ts scans the
      # built `dist/` — the tarball is what ships, and the repository is not.
      # It fails rather than skips on an empty `dist/`, so this order is a
      # requirement and not a preference.
      - run: npm run build
      - run: npm test
      # The PACKAGE, as npm would publish it: exports/main/types point at
      # files that exist and carry the right format. Pinned, like the
      # generator, so a new rule lands as a reviewed bump and not as a red
      # build nobody changed anything for.
      - run: npx --yes publint@0.3.15 --strict
      # How each module mode RESOLVES the types (node10, node16 from CJS and
      # from ESM, bundler) — what publint does not check.
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .
  # The same gates on Node 20, the oldest line `engines` allows: isRetryable()
  # reads the shape of the errors Node's own fetch throws, and that shape
  # belongs to the runtime. A SEPARATE JOB rather than a matrix on `test`, on
  # purpose: the `main` ruleset requires the check named exactly `test`, and a
  # matrix would rename it to `test (22)`, which nothing could then satisfy —
  # every pull request and every spec-sync landing would block.
  test-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  # Node 24, the active LTS line (Node 20 left upstream support on
  # 2026-04-30, and is kept above only while `engines` still names it). Not a
  # required check: it is the line the next `engines` floor will move to.
  test-node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
