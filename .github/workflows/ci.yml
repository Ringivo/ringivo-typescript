name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # BUILD BEFORE TEST, on purpose. tests/grey-label.test.ts scans the
      # built `dist/` — the tarball is what ships, and the repository is not.
      # It fails rather than skips on an empty `dist/`, so this order is a
      # requirement and not a preference.
      - run: npm run build
      - run: npm test
